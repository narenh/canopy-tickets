  overlayClosed();
}

// Your name, photo and Venmo username can be changed from any browser
// you're signed in on -- no movie needs to be unlocked.
async function saveProfile(){
  const errorEl = document.getElementById('profileError');
  errorEl.textContent = '';
  try{
    const res = await fetch('/api/profile', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        firstName: document.getElementById('profileFirst').value,
        lastName: document.getElementById('profileLast').value,
        venmoHandle: document.getElementById('profileVenmo').value
      })
    });
    if (await handleAuthFailure(res)) return;
    const data = await res.json().catch(() => ({}));
    if (res.status === 403){ errorEl.textContent = t('friend.profile.locked'); return; }
    if (data.reason === 'bad_venmo'){ errorEl.textContent = t('friend.profile.badVenmo'); return; }
    if (!res.ok){ errorEl.textContent = data.error || t('friend.profile.failed'); return; }
    me = data.person;
    renderMe();
    closeProfile();
    loadList();
  }catch(e){
    errorEl.textContent = t('friend.profile.failed');
  }
}

document.getElementById('profilePhotoInput').addEventListener('change', async (e) => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const errorEl = document.getElementById('profileError');
  errorEl.textContent = '';
  let result;
  try{
    result = await cropProfilePhoto(file, t('welcome.cropHint'));
  }catch(err){
    errorEl.textContent = t('welcome.photoUnreadable');
    return;
  }
  if (!result) return;
  const form = new FormData();
  form.append('photo', result.blob, 'photo.jpg');
  try{
    const res = await fetch('/api/profile/photo', { method: 'POST', body: form });
    if (await handleAuthFailure(res)) return;
    if (res.status === 403){ errorEl.textContent = t('friend.profile.locked'); return; }
    if (!res.ok){ errorEl.textContent = t('friend.profile.failed'); return; }
    me = (await res.json()).person;
    renderMe();
    document.getElementById('profilePhoto').src = me.photoUrl;
    loadList();
  }catch(err){
    errorEl.textContent = t('friend.profile.failed');
  }
});

// ---------------- "ARE THESE YOURS?" ----------------
// Seats reserved before profiles existed carry a name and no owner. These
// are the ones in movies unlocked here, grouped by the name on them;
// names that start with your first name come first, already ticked.
// Claiming always takes the movie's password, typed right then -- even
// when the movie is unlocked on this phone, or a new profile on a phone
// with everything unlocked could take anyone's seat. Ticked seats are
// claimed one movie at a time, each with its own password.
let existingSeats = [];

async function openExisting(fromProfile){
  let seats = [];
  try{
    const res = await fetch('/api/public/claimable');
    if (await handleAuthFailure(res)) return;
    if (res.ok) seats = (await res.json()).seats || [];
  }catch(e){}
  seats = seats.filter(x => !isPastShowtime(x));
  if (!seats.length){
    // Back from the password step with everything already claimed.
    if (!document.getElementById('existingOverlay').classList.contains('hidden')) closeExisting();
    else if (fromProfile) alert(t('friend.existing.none'));
    return;
  }
  existingSeats = seats;
  const first = (me && me.firstName || '').toLowerCase();
  const isLikely = (name) => !!first && name.toLowerCase().split(/\s+/)[0] === first;
  const byName = new Map();
  seats.forEach(x => {
    if (!byName.has(x.name)) byName.set(x.name, []);
    byName.get(x.name).push(x);
  });
  const names = Array.from(byName.keys()).sort((a, b) =>
    (isLikely(b) - isLikely(a)) || a.localeCompare(b));
  const list = document.getElementById('existingList');
  list.innerHTML = '';
  names.forEach(name => {
    const head = document.createElement('div');
    head.className = 'existing-name';
    head.textContent = name;
    list.appendChild(head);
    byName.get(name).forEach(x => {
      const row = document.createElement('label');
      row.className = 'existing-seat';
      row.innerHTML = '<input type="checkbox"' + (isLikely(name) ? ' checked' : '') +
        ' data-showtime="' + escapeHtml(x.showtimeId) + '" data-seat="' + escapeHtml(x.seatId) + '" data-movie="' + escapeHtml(x.movieId) + '"><span>' +
        escapeHtml(x.title + ' \u00b7 ' + formatDateDisplay(x.date) + ' \u00b7 ' + formatTimeDisplay(x.time) + ' \u00b7 ' + x.seatId) +
        '</span>';
      list.appendChild(row);
    });
  });
  document.getElementById('existingError').textContent = '';
  showExistingPick();
  document.getElementById('existingOverlay').classList.remove('hidden');
  overlayOpened();
}

function showExistingPick(){
  document.getElementById('existingPassword').classList.add('hidden');
  document.getElementById('existingPick').classList.remove('hidden');
}

// The ticked seats, grouped by movie in the order they appear -- each
// group is one password and one claim.
let claimQueue = [];
let claimDone = 0;

function tickedByMovie(){
  const groups = [];
  document.querySelectorAll('#existingList input:checked').forEach(i => {
    let g = groups.find(x => x.movieId === i.dataset.movie);
    if (!g){
      const x = existingSeats.find(e => e.movieId === i.dataset.movie);
      g = { movieId: i.dataset.movie, title: x ? x.title : '', seats: [] };
      groups.push(g);
    }
    g.seats.push({ showtimeId: i.dataset.showtime, seatId: i.dataset.seat });
  });
  return groups;
}

function closeExisting(){
  document.getElementById('existingOverlay').classList.add('hidden');
  overlayClosed();
}

function submitExisting(){
  claimQueue = tickedByMovie();
  claimDone = 0;
  if (!claimQueue.length){ closeExisting(); return; }
  askExistingPassword();
}

function askExistingPassword(){
  const g = claimQueue[0];
  const total = claimDone + claimQueue.length;
  document.getElementById('existingPwTitle').textContent = t('friend.existing.pwHeading', { title: g.title });
  document.getElementById('existingPwHint').textContent = t('friend.existing.pwHint') +
    (total > 1 ? ' ' + t('friend.existing.pwStep', { n: claimDone + 1, count: total }) : '');
  document.getElementById('existingPwError').textContent = '';
  const input = document.getElementById('existingPwInput');
  input.value = '';
  input.placeholder = t('friend.unlock.placeholder');
  document.getElementById('existingPick').classList.add('hidden');
  document.getElementById('existingPassword').classList.remove('hidden');
  setTimeout(() => input.focus(), 0);
}

// Back to the list. Movies already claimed on the way are done, so the
// list is fetched again without them.
function backToExistingPick(){
  if (claimDone){ claimDone = 0; openExisting(false); loadList(); return; }
  showExistingPick();
}

async function submitExistingPassword(e){
  e.preventDefault();
  const g = claimQueue[0];
  if (!g) return;
  const input = document.getElementById('existingPwInput');
  const errorEl = document.getElementById('existingPwError');
  const btn = document.getElementById('existingPwSubmit');
  errorEl.textContent = '';
  btn.disabled = true;
  try{
    const res = await fetch('/api/public/claim-existing', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ movieId: g.movieId, password: input.value, seats: g.seats })
    });
    if (await handleAuthFailure(res)) return;
    if (!res.ok){
      errorEl.textContent = res.status === 403 ? t('friend.unlock.wrong')
        : res.status === 429 ? t('friend.unlock.tooMany') : t('friend.existing.failed');
      input.select();
      return;
    }
    claimQueue.shift();
    claimDone++;
    if (claimQueue.length){ askExistingPassword(); return; }
    closeExisting();
    setTab('mine');
    await loadList();
  }catch(err){
    errorEl.textContent = t('friend.unlock.failed');
  }finally{
    btn.disabled = false;
  }
}

// ---------------- CONCESSIONS ----------------
//
// A cart belongs to a SEAT, and only the seat's owner can open it: your
// own seat, or a guest you booked. A seat reserved before profiles has
// no owner until its person claims it ("Are these yours?"), so nobody
// can touch its order from here. The server enforces the same thing.
//
// Menu items are the host's list (admin editor). A cart line snapshots
// the item's name and price at the moment it was added, so the host
// repricing or removing a menu item never silently rewrites an order
// someone already placed -- a line whose item has since left the menu
// still shows, flagged, and can still be edited down to zero.

// Matches MAX_QTY in lib/seats.js -- a cart line over this gets clamped
// server-side, so stopping the stepper here keeps the number on screen
// honest instead of letting it disagree with what got saved.
const MAX_CART_QTY = 99;

// Nobody sitting next to Naren gets offered peanut candy. Played for a
// laugh, but it's an allergy, so it's built to fail safe rather than to
// be cute: see hidePeanutRows() for what it deliberately does NOT do.
//
// Matched on a word boundary so "Naren", "naren" and "Naren H" all count
// while a "Karen" two seats over doesn't.
const PEANUT_NEIGHBOR = /\bnaren\b/i;
// Name-matched rather than by a list of ids, so it keeps working after
// the host renames an item or adds one of their own. Reese's is on here
// by brand: the word "peanut" isn't in the name, the peanut butter is.
const PEANUT_ITEM = /peanut|reese/i;

let concessionMenu = [];   // [{id, name, price, note, section, optionGroup}] from /api/public/concession-menu
let optionGroups = [];     // [{id, label, options[]}] -- the choice lists items point at
let openSections = [];     // section names that start expanded rather than folded away
let cartShowtimeId = null;
let cartSeatId = null;
// The order, one entry per unit ordered -- NOT one per menu item with a
// quantity. That's what lets popcorn chicken with ranch and another with
// bbq be two separate things rather than one row that can only hold one
// answer.
let cartOrder = [];        // [{uid, itemId, name, price, option, note}]
let cartUid = 0;           // per-line handle, so a row can be removed without index maths
const menuRowEls = new Map();   // itemId -> { count } in the catalog
const orderRowEls = new Map();  // uid -> { el } in the order list
let sectionEls = [];            // collapsed catalog sections, for live counts
let cartLocked = false;    // past the cutoff -- read-only
// There's no Save button: every add and remove writes straight through.
// With the pick made before a line exists, every state the cart can be in
// is already a valid order, so asking someone to confirm it was ceremony
// -- and a fourth full-width button in a footer that was crowding the
// menu out.
let saveTimer = null;      // debounce handle, so a burst of taps is one request
let saveInFlight = false;  // only ever one PUT at a time, so writes can't land out of order
let savePending = false;   // a change arrived mid-flight; save again when it lands
let saveState = 'idle';    // 'idle' | 'saving' | 'error'
let lastClaim = null;      // {showtimeId, seatId} -- for the success overlay's "Add concessions"

async function loadConcessionMenu(){
  try{
    const res = await fetch('/api/public/concession-menu');
    if (await handleAuthFailure(res)) return;
    if (!res.ok) return;
    const data = await res.json();
    concessionMenu = Array.isArray(data.items) ? data.items : [];
    optionGroups = Array.isArray(data.optionGroups) ? data.optionGroups : [];
    openSections = Array.isArray(data.openSections) ? data.openSections : [];
  }catch(e){
    // Non-fatal -- an already-loaded menu stays usable, and a cart that
    // has never loaded one shows the "no menu yet" state.
  }
}

function concessionsTotal(lines){
  const total = (lines || []).reduce((sum, l) => sum + (l.price || 0) * (l.qty || 0), 0);
  return Math.round(total * 100) / 100;
}

function concessionTax(subtotal){
  if (!(subtotal > 0) || !(concessionTaxRate > 0)) return 0;
  return Math.round(subtotal * concessionTaxRate * 100) / 100;
}

// "8.625%" rather than "8.62%" -- the rate really does carry a third
// decimal, and rounding the label makes the arithmetic look wrong.
function formatTaxRate(rate){
  return (rate * 100).toFixed(3).replace(/0+$/, '').replace(/\.$/, '') + '%';
}

// Local Date for a showtime's start, or null if it hasn't got a usable
// date/time. Built field-by-field rather than by parsing "2026-02-12T19:00"
// as a string, which some browsers read as UTC and some as local.
function showtimeStart(obj){
  if (typeof obj.date !== 'string' || typeof obj.time !== 'string') return null;
  const d = obj.date.split('-').map(Number);
  // Not `t`: that's the copy lookup from public/copy.js, and shadowing it
  // inside a function is the kind of thing that only breaks later.
  const hm = obj.time.split(':').map(Number);
  if (d.length < 3 || hm.length < 2 || d.some(n => !Number.isFinite(n)) || hm.some(n => !Number.isFinite(n))) return null;
  const dt = new Date(d[0], d[1] - 1, d[2], hm[0], hm[1], 0, 0);
  return Number.isFinite(dt.getTime()) ? dt : null;
}

// Open until the host closes it from the editor, which they do when they
// go and place the order. Not a clock: the only moment that actually
// matters is the one where the order gets handed over, and nothing but
// the host knows when that is. Anything without the flag is open, so a
// showtime from before this existed stays editable.
function concessionsOpen(obj){
  return !(obj && obj.ordersClosed);
}

// "Chicken Tenders ×2 (BBQ Sauce, Icing Cup)" -- one cart line in words.
// The picks are part of what was ordered, not a footnote, so they ride
// along wherever the line is named.
function concessionLineLabel(l){
  const options = (l.options || []).filter(Boolean);
  return l.name + (l.qty > 1 ? ' ×' + l.qty : '') + (options.length ? ' (' + options.join(', ') + ')' : '');
}

// One-line "what's in this cart" for the seat row on the list card.
function concessionSummary(lines){
  if (!lines || !lines.length) return '';
  const total = concessionsTotal(lines);
  return lines.map(concessionLineLabel).join(', ') + (total > 0 ? ' — ' + formatPrice(total) : '');
}

// The choice list an item comes with, or [] for one that's just itself.
// An item pointing at a group the host hasn't filled in yet reads as no
// choices at all rather than an empty dropdown.
function optionsForItem(itemId){
  const item = concessionMenu.find(i => i.id === itemId);
  if (!item || !item.optionGroup) return [];
  const group = optionGroups.find(g => g.id === item.optionGroup);
  return group && Array.isArray(group.options) ? group.options : [];
}

function optionLabelForItem(itemId){
  const item = concessionMenu.find(i => i.id === itemId);
  const group = item && optionGroups.find(g => g.id === item.optionGroup);
  return group ? group.label : 'Choice';
}

// The menu body is a catalog: one row per item, a single "+" and nothing
// else. Everything a friend has actually chosen lives in its own list
// above the totals, one row per unit.
//
// It reads as a small thing but it's the difference between being able to
// express "popcorn chicken with ranch AND another with bbq" and not: a
// quantity of 2 on a single row can only carry one idea of what that
// order is. One line per unit means each one carries its own choice.
function buildMenuRows(){
  return concessionMenu.map(item => ({
    itemId: item.id,
    name: item.name,
    price: item.price,
    note: item.note || '',
    section: item.section || ''
  }));
}

// Expands the seat's saved cart into one order line per unit, taking that
// unit's pick off the stored options array.
//
// This is also the migration path for carts saved by the old quantity UI:
// a stored { qty: 2, options: ['BBQ', 'Ranch'] } becomes two lines, which
// is what it always meant. Lines whose item has since left the menu come
// through as ordinary order lines -- still visible, still removable, just
// with nothing in the catalog to add another from.
function buildCartOrder(lines){
  const out = [];
  (lines || []).forEach(l => {
    const options = l.options || [];
    const qty = Math.max(1, l.qty || 0);
    for (let unit = 0; unit < qty; unit++){
      out.push({
        uid: ++cartUid,
        itemId: l.itemId || '',
        name: l.name,
        price: l.price,
        option: options[unit] || '',
        note: l.note || ''
      });
    }
  });
  return out;
}

// One wire line per order line. Coalescing identical ones back into a
// quantity would just have to be undone on the next open, and 50 lines
// (MAX_CART_LINES server-side) is a lot of concessions for one seat.
function cartLines(){
  return cartOrder.map(l => ({
    itemId: l.itemId,
    name: l.name,
    price: l.price,
    qty: 1,
    note: l.note || '',
    options: l.option ? [l.option] : []
  }));
}

// Every order line for an item that comes with a choice has to have one
// picked before the cart will save. An order reaching the host as
// "Popcorn Chicken" with no sauce named is one they can't actually place.
//
// Only items whose group actually has options count: an item whose group
// the host hasn't filled in yet can't be picked from, so it would
// otherwise block saving forever. Lines whose item has left the menu are
// exempt for the same reason -- there's no group left to pick from.
function missingChoices(){
  const byName = new Map();
  cartOrder.forEach(l => {
    if (l.option) return;
    if (!optionsForItem(l.itemId).length) return;
    const prev = byName.get(l.name) || { name: l.name, label: optionLabelForItem(l.itemId).toLowerCase(), missing: 0 };
    prev.missing++;
    byName.set(l.name, prev);
  });
  return Array.from(byName.values());
}

function orderCountFor(itemId){
  return cartOrder.filter(l => l.itemId === itemId).length;
}

function currentCartShowtime(){
  return allShowtimes.find(s => s.id === cartShowtimeId) || null;
}

// Seats either side of this one in the same row. Deliberately NOT the
// rows in front or behind: seat numbers don't line up across rows (row A
// is offset -- see padStart in seat-layout.js), so "same number, next
// row" is not the seat behind you, and guessing wrong here would be
// worse than the narrower answer.
function neighborSeatIds(seatId){
  const m = /^([A-Za-z]+)(\d+)$/.exec(seatId || '');
  if (!m) return [];
  const n = Number(m[2]);
  return [m[1] + (n - 1), m[1] + (n + 1)];
}

function hasPeanutNeighbor(showtime, seatId){
  const seats = (showtime && showtime.seats) || {};
  return neighborSeatIds(seatId).some(id => seats[id] && PEANUT_NEIGHBOR.test(seats[id].name || ''));
}

// Menu items to leave out of the catalog. Silent by design: the people
// this applies to are in on the joke, and a banner explaining the bit is
// worse than the bit.
//
// It deliberately does not touch the order list. A peanut item already
// ordered stays visible and removable there -- hiding a line someone is
// being charged for would be worse than showing it -- and only its "+"
// in the catalog goes away. Nor is any of this enforcement: the host sees
// every order in full, which is the copy that matters at the counter.
function hiddenPeanutItemIds(){
  if (!hasPeanutNeighbor(currentCartShowtime(), cartSeatId)) return new Set();
  const ordered = new Set(cartOrder.map(l => l.itemId));
  return new Set(
    concessionMenu.filter(i => PEANUT_ITEM.test(i.name || '') && !ordered.has(i.id)).map(i => i.id)
  );
}

// ---------------- CART OVERLAY ----------------
async function openCart(showtimeId, seatId){
  const obj = allShowtimes.find(s => s.id === showtimeId);
  if (!obj) return;
  const seat = (obj.seats || {})[seatId];
  if (!seat || !seat.name || !seat.mine) return;

  cartShowtimeId = showtimeId;
  cartSeatId = seatId;
  cartLocked = !concessionsOpen(obj);
  saveState = 'idle';
  saveInFlight = false;
  savePending = false;
  if (saveTimer){ clearTimeout(saveTimer); saveTimer = null; }

  document.getElementById('cartTitle').textContent = 'Concessions';
  document.getElementById('cartSub').textContent = t('friend.cart.subtitle', { seat: seatId, name: seat.name });
  document.getElementById('cartError').textContent = '';
  document.getElementById('cartStatus').textContent = '';

  renderCartLockedBanner();

  const body = document.getElementById('cartBody');
  body.innerHTML = '<div class="cart-empty-menu">Loading menu...</div>';
  document.getElementById('cartOverlay').classList.remove('hidden');
  overlayOpened();
  // Pins the showtime list behind the sheet. Without it a phone will
  // happily scroll the page underneath once the menu hits its end, which
  // is the one thing a full-screen sheet shouldn't do.
  document.body.classList.add('cart-open');

  // Refetched on every open rather than once at page load: the host adds
  // menu items from their own device, and a friend who left this page
  // sitting open all afternoon shouldn't be ordering off yesterday's menu.
  await loadConcessionMenu();

  // Bail out if the overlay got closed (or switched to another seat)
  // while that request was in flight.
  if (cartShowtimeId !== showtimeId || cartSeatId !== seatId) return;

  // Re-read rather than reusing the `seat` captured before the await --
  // a save on another seat replaces the whole showtime object in
  // allShowtimes, so the one from before the fetch can be detached.
  const current = allShowtimes.find(s => s.id === showtimeId);
  const freshSeat = current && (current.seats || {})[seatId];
  if (!freshSeat || !freshSeat.name){ closeCartOverlay(); return; }

  cartOrder = buildCartOrder(freshSeat.concessions);
  renderCart();
}

function openCartFromSuccess(){
  if (!lastClaim) return;
  closeSuccessOverlay();
  openCart(lastClaim.showtimeId, lastClaim.seatId);
}

function closeCartOverlay(){
  // Flush first: closing a second after a tap must not drop that tap.
  // runSave() reads the cart state, so it has to run before it's cleared.
  if (saveTimer){
    clearTimeout(saveTimer);
    saveTimer = null;
    runSave();
  }
  cartShowtimeId = null;
  cartSeatId = null;
  cartOrder = [];
  orderRowEls.clear();
  document.getElementById('cartOverlay').classList.add('hidden');
  document.body.classList.remove('cart-open');
  overlayClosed();
}

// Shown whenever the cart is read-only. Its own function because the
// cart can close underneath an open page -- the host presses the button
// while somebody is mid-order -- so this has to be reachable from the
// save's rejection handler as well as from opening the cart.
function renderCartLockedBanner(){
  const locked = document.getElementById('cartLocked');
  locked.classList.toggle('hidden', !cartLocked);
  locked.textContent = t('friend.cart.locked');
}

function renderCart(){
  renderCartLockedBanner();
  const body = document.getElementById('cartBody');
  body.innerHTML = '';
  menuRowEls.clear();
  sectionEls = [];

  const menuRows = buildMenuRows();
  if (menuRows.length === 0){
    const empty = document.createElement('div');
    empty.className = 'cart-empty-menu';
    empty.textContent = t('friend.cart.menuEmpty');
    body.appendChild(empty);
  } else {
    const hidden = hiddenPeanutItemIds();
    const visible = menuRows.filter(row => !hidden.has(row.itemId));

    // Unsectioned items inline; a named section folded away behind a
    // header, rendered at the position of its FIRST item rather than
    // always at the end -- that's what lets drinks sit collapsed at the
    // top and snacks and candy sit collapsed underneath the food, in
    // whatever order the menu itself is in.
    const emitted = new Set();
    visible.forEach(row => {
      if (!row.section){
        body.appendChild(buildMenuRowEl(row));
        return;
      }
      if (emitted.has(row.section)) return;
      emitted.add(row.section);
      body.appendChild(buildCartSectionEl(row.section, visible.filter(r => r.section === row.section)));
    });
  }

  renderOrderList();
  renderCartFoot();
}

// A collapsed section. Native <details>, so the open/closed state is the
// browser's to keep and there's nothing to wire up for the keyboard.
function buildCartSectionEl(name, rows){
  const wrap = document.createElement('details');
  wrap.className = 'cart-section';

  const inOrder = rows.reduce((n, r) => n + orderCountFor(r.itemId), 0);
  // Open when the menu says this is one of the sections worth having on
  // screen from the start, or when something in it is already ordered --
  // a friend reopening their cart should see where their Skittles came
  // from without hunting for it.
  wrap.open = inOrder > 0 || openSections.indexOf(name) !== -1;

  const summary = document.createElement('summary');
  const label = document.createElement('span');
  label.textContent = name;
  summary.appendChild(label);

  const count = document.createElement('span');
  count.className = 'cart-section-count' + (inOrder ? ' has-order' : '');
  count.textContent = inOrder
    ? t('friend.cart.sectionInOrder', { count: inOrder })
    : t(rows.length === 1 ? 'friend.cart.sectionItemsOne' : 'friend.cart.sectionItemsMany', { count: rows.length });
  count.dataset.total = String(rows.length);
  summary.appendChild(count);
  wrap.appendChild(summary);

  const inner = document.createElement('div');
  inner.className = 'cart-section-body';
  rows.forEach(row => inner.appendChild(buildMenuRowEl(row)));
  wrap.appendChild(inner);

  sectionEls.push({ el: wrap, count, rows });
  return wrap;
}

// One catalog row: what it is, what it costs, and a "+".
function buildMenuRowEl(row){
  const el = document.createElement('div');
  el.className = 'cart-item';

  const rowEl = document.createElement('div');
  rowEl.className = 'ci-row';

  const main = document.createElement('div');
  main.className = 'ci-main';

  const nameEl = document.createElement('div');
  nameEl.className = 'ci-name';
  nameEl.textContent = row.name;
  main.appendChild(nameEl);

  const priceEl = document.createElement('div');
  priceEl.className = 'ci-price';
  priceEl.textContent = [
    row.price > 0 ? formatPrice(row.price) : t('friend.cart.noPriceSet'),
    // The host's own label for this item ("50c off"), not a discount the
    // app applies -- the price to its left is what gets charged.
    row.note || ''
  ].filter(Boolean).join(' · ');
  main.appendChild(priceEl);

  rowEl.appendChild(main);

  // How many of this are already down in the order below. Without it,
  // tapping "+" on a row 30 items up the list gives no sign it landed.
  const count = document.createElement('span');
  count.className = 'ci-count';
  rowEl.appendChild(count);

  const add = document.createElement('button');
  add.type = 'button';
  add.className = 'ci-add';
  add.textContent = '+';
  add.setAttribute('aria-label', 'Add ' + row.name);
  rowEl.appendChild(add);
  el.appendChild(rowEl);

  // The choice is made HERE, before the line exists, because the order
  // list below is deliberately not editable -- changing your mind is
  // remove and re-add. That also means "+" can't be pressed until there's
  // something to add: half an order of popcorn chicken with no sauce
  // named isn't a thing the host can go and buy.
  const choices = optionsForItem(row.itemId);
  let picker = null;
  if (choices.length){
    const label = optionLabelForItem(row.itemId);
    picker = buildChoicePicker(label, row.name, choices, () => {
      add.disabled = cartLocked || !picker.value;
    });
    picker.button.disabled = cartLocked;
    el.appendChild(picker.el);
  }

  add.disabled = cartLocked || !!(picker && !picker.value);
  add.addEventListener('click', () => {
    if (picker && !picker.value) return;
    addOrderLine(row, picker ? picker.value : '');
    if (picker){
      // Back to blank so the next one is a deliberate pick rather than a
      // silent repeat of the last -- two tenders with the same sauce
      // should be as explicit as two with different ones.
      picker.reset();
      add.disabled = true;
    }
  });

  menuRowEls.set(row.itemId, { count });
  syncMenuRowCount(row.itemId);
  return el;
}

// Stands in for a <select>: a button that names the current pick and a
// list of buttons underneath it. Same two taps as the native picker, but
// it can be styled to sit under a 14px item name without dwarfing it, and
// without iOS zooming the page in on focus.
let openChoicePicker = null;   // only one list open at a time

function buildChoicePicker(label, itemName, choices, onChange){
  const wrap = document.createElement('div');
  wrap.className = 'ci-choice';

  const placeholder = t('friend.cart.choosePrompt', { label: label.toLowerCase() });
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'ci-choice-btn needs-choice';
  btn.setAttribute('aria-expanded', 'false');
  btn.setAttribute('aria-label', label + ' for ' + itemName);
  const text = document.createElement('span');
  text.textContent = placeholder;
  btn.appendChild(text);
  wrap.appendChild(btn);

  const list = document.createElement('div');
  list.className = 'ci-choice-list';
  list.hidden = true;
  wrap.appendChild(list);

  const api = { el: wrap, button: btn, value: '' };

  api.close = function(){
    list.hidden = true;
    btn.setAttribute('aria-expanded', 'false');
    if (openChoicePicker === api) openChoicePicker = null;
  };
  api.reset = function(){
    api.value = '';
    text.textContent = placeholder;
    btn.classList.add('needs-choice');
    api.close();
  };

  btn.addEventListener('click', () => {
    if (!list.hidden){ api.close(); return; }
    if (openChoicePicker) openChoicePicker.close();
    list.hidden = false;
    btn.setAttribute('aria-expanded', 'true');
    openChoicePicker = api;
  });

  choices.forEach(name => {
    const opt = document.createElement('button');
    opt.type = 'button';
    opt.className = 'ci-choice-opt';
    opt.textContent = name;
    opt.addEventListener('click', () => {
      api.value = name;
      text.textContent = name;
      btn.classList.remove('needs-choice');
      api.close();
      onChange();
    });
    list.appendChild(opt);
  });

  return api;
}

function syncMenuRowCount(itemId){
  const refs = menuRowEls.get(itemId);
  if (!refs) return;
  const n = orderCountFor(itemId);
  refs.count.textContent = n ? '×' + n : '';
}

function syncSectionCounts(){
  sectionEls.forEach(({ count, rows }) => {
    const inOrder = rows.reduce((n, r) => n + orderCountFor(r.itemId), 0);
    count.textContent = inOrder
      ? t('friend.cart.sectionInOrder', { count: inOrder })
      : t(count.dataset.total === '1' ? 'friend.cart.sectionItemsOne' : 'friend.cart.sectionItemsMany', { count: count.dataset.total });
    count.classList.toggle('has-order', inOrder > 0);
  });
}

// ---------------- ORDER LIST ----------------
function renderOrderList(){
  const list = document.getElementById('cartOrderList');
  list.innerHTML = '';
  orderRowEls.clear();

  document.getElementById('cartOrderWrap').classList.toggle('hidden', cartOrder.length === 0);
  cartOrder.forEach(line => list.appendChild(buildOrderRowEl(line)));
  syncOrderCount();
  syncSectionCounts();
}

function setOrderPanelCollapsed(collapsed){
  const wrap = document.getElementById('cartOrderWrap');
  wrap.classList.toggle('is-collapsed', collapsed);
  document.getElementById('cartOrderToggle').setAttribute('aria-expanded', String(!collapsed));
}

// Collapsing hands the whole card back to the menu. The count in the
// header is what makes that safe to do -- see syncOrderCount below.
function toggleOrderPanel(){
  setOrderPanelCollapsed(!document.getElementById('cartOrderWrap').classList.contains('is-collapsed'));
}

// The count on the panel header, which is the whole of what's readable
// when it's collapsed -- so it has to stay right whether or not the list
// itself is on screen.
function syncOrderCount(){
  const n = cartOrder.length;
  document.getElementById('cartOrderCount').textContent =
    n ? t(n === 1 ? 'friend.cart.orderCountOne' : 'friend.cart.orderCountMany', { count: n }) : '';
}

function addOrderLine(row, option){
  if (cartLocked) return;
  const line = {
    uid: ++cartUid,
    itemId: row.itemId,
    name: row.name,
    price: row.price,
    option: option || '',
    note: ''
  };
  cartOrder.push(line);

  // Appended rather than re-rendering the whole list, so a note someone
  // is part-way through typing on another line keeps its focus.
  const wrap = document.getElementById('cartOrderWrap');
  wrap.classList.remove('hidden');
  document.getElementById('cartOrderList').appendChild(buildOrderRowEl(line));
  syncOrderCount();

  markCartChanged();
  syncMenuRowCount(row.itemId);
  syncSectionCounts();
  renderCartFoot();

  // Adding into a collapsed panel would put the line somewhere nobody
  // can see; open it so "+" visibly does something, then scroll the new
  // line into view within it.
  setOrderPanelCollapsed(false);
  const refs = orderRowEls.get(line.uid);
  if (refs) refs.el.scrollIntoView({ block: 'nearest' });
}

function removeOrderLine(uid){
  if (cartLocked) return;
  const idx = cartOrder.findIndex(l => l.uid === uid);
  if (idx === -1) return;
  const [gone] = cartOrder.splice(idx, 1);

  const refs = orderRowEls.get(uid);
  if (refs) refs.el.remove();
  orderRowEls.delete(uid);

  document.getElementById('cartOrderWrap').classList.toggle('hidden', cartOrder.length === 0);
  syncOrderCount();
  markCartChanged();
  syncMenuRowCount(gone.itemId);
  syncSectionCounts();
  renderCartFoot();
}

// One line, read-only. Changing a pick is remove-and-re-add, which keeps
// the list scannable -- a dozen rows each carrying a dropdown and a text
// box is a form, not an order.
function buildOrderRowEl(line){
  const el = document.createElement('div');
  el.className = 'order-row';

  const main = document.createElement('div');
  main.className = 'order-main';

  const nameEl = document.createElement('span');
  nameEl.className = 'order-name';
  nameEl.textContent = line.name;
  main.appendChild(nameEl);

  const choices = optionsForItem(line.itemId);
  if (line.option){
    const opt = document.createElement('span');
    opt.className = 'order-option';
    opt.textContent = ' · ' + line.option;
    main.appendChild(opt);
  } else if (choices.length){
    // Only reachable for a line saved before this item had a choice (or
    // before this UI asked for one up front). It can't be fixed in place,
    // so it says what to do about it.
    const opt = document.createElement('span');
    opt.className = 'order-option is-missing';
    opt.textContent = t('friend.cart.noChoice', { label: optionLabelForItem(line.itemId).toLowerCase() });
    main.appendChild(opt);
  }

  // Notes aren't editable here any more, but one saved earlier is still
  // part of the order and still has to reach the host.
  if (line.note){
    const note = document.createElement('span');
    note.className = 'order-line-note';
    note.textContent = ' · ' + line.note;
    main.appendChild(note);
  }

  el.appendChild(main);

  const priceEl = document.createElement('span');
  priceEl.className = 'order-price';
  priceEl.textContent = line.price > 0 ? formatPrice(line.price) : '';
  el.appendChild(priceEl);

  const remove = document.createElement('button');
  remove.type = 'button';
  remove.className = 'order-remove';
  remove.textContent = '×';
  remove.disabled = cartLocked;
  remove.setAttribute('aria-label', 'Remove ' + line.name);
  remove.addEventListener('click', () => removeOrderLine(line.uid));
  el.appendChild(remove);

  orderRowEls.set(line.uid, { el });
  return el;
}

function markCartChanged(){
  saveState = 'saving';
  renderSaveStatus();
  if (saveTimer) clearTimeout(saveTimer);
  // Short debounce so adding three things in a row is one write, not
  // three; long enough to coalesce taps, short enough that closing the
  // card straight afterwards still flushes something tiny.
  saveTimer = setTimeout(runSave, 350);
}

function renderSaveStatus(){
  const el = document.getElementById('cartStatus');
  el.classList.toggle('is-error', saveState === 'error');
  if (saveState === 'saving'){
    el.textContent = 'Saving\u2026';
  } else if (saveState === 'error'){
    // The only affordance left for a failed write, now that there's no
    // Save button to press again -- silent loss is the one thing autosave
    // must not do.
    el.textContent = t('friend.cart.saveRetry');
  } else {
    el.textContent = 'Saved';
  }
}

async function runSave(){
  saveTimer = null;
  if (!cartShowtimeId || !cartSeatId || cartLocked) return;
  // One write at a time. A second change mid-flight doesn't start a
  // racing request that might land first -- it queues, and the state that
  // finally gets written is the latest one.
  if (saveInFlight){ savePending = true; return; }
  saveInFlight = true;

  const showtimeId = cartShowtimeId;
  const seatId = cartSeatId;
  const items = cartLines();

  try{
    const res = await fetch(
      '/api/public/showtimes/' + encodeURIComponent(showtimeId) +
      '/seats/' + encodeURIComponent(seatId) + '/concessions',
      {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ items })
      }
    );
    if (await handleAuthFailure(res)) return;
    if (!res.ok){
      // The host closing the cart while this page was open is the one
      // failure a retry can't fix, so say what happened and lock the card
      // rather than leaving a retry button that will never work.
      let closed = false;
      if (res.status === 409){
        try { closed = (await res.clone().json()).reason === 'orders_closed'; } catch (e) {}
      }
      if (closed){
        saveState = 'idle';
        savePending = false;
        const obj = currentCartShowtime();
        if (obj) obj.ordersClosed = true;
        cartLocked = true;
        document.getElementById('cartError').textContent = t('friend.cart.saveClosed');
        renderCart();
        renderCards();
        return;
      }
      saveState = 'error';
      document.getElementById('cartError').textContent = res.status === 409 ? t('friend.cart.saveNotReserved') : '';
      renderSaveStatus();
      return;
    }
    const data = await res.json();
    const idx = allShowtimes.findIndex(s => s.id === showtimeId);
    if (idx !== -1) allShowtimes[idx] = data.showtime;
    saveState = 'idle';
    document.getElementById('cartError').textContent = '';
    // Only touch the cart's own chrome if it's still this cart on screen
    // -- the close path fires a last save on the way out.
    if (cartShowtimeId === showtimeId && cartSeatId === seatId){
      renderSaveStatus();
      renderCartFoot();
    }
    // The list underneath is showing this seat's old order -- redraw it
    // (and the seat map, if the picker is what's open behind this).
    renderCards();
    if (currentShowtimeId === showtimeId) buildSeatmap(data.showtime);
  }catch(e){
    saveState = 'error';
    renderSaveStatus();
  }finally{
    saveInFlight = false;
    if (savePending){
      savePending = false;
      runSave();
    }
  }
}

function retrySave(){
  if (saveState !== 'error') return;
  markCartChanged();
}

// Totals + the pay row. Pay links are shown only when what's on screen
// matches what's been saved -- offering a pre-filled "pay $43.46" button
// for an order the host hasn't actually received yet is the one way this
// screen could genuinely cost someone money.
function renderCartFoot(){
  const obj = currentCartShowtime();
  const seat = obj && (obj.seats || {})[cartSeatId];
  const totals = document.getElementById('cartTotals');
  const lines = cartLines();
  const concessions = concessionsTotal(lines);
  const tax = concessionTax(concessions);
  const ticketPrice = obj && typeof obj.price === 'number' ? obj.price : 0;
  const ticketPaid = !!(seat && seat.paid);
  // The host's seat settles itself: they bought the tickets and they're
  // buying the concessions, so there's nobody for them to pay.
  const isHost = !!(seat && seat.host);

  // The ticket and the food are two different bills that come due at
  // different times, and the gap between them is the whole reason this
  // isn't one number.
  //
  // A ticket costs what it costs the moment the seat is claimed, so it
  // can be settled straight away -- and the post-claim card offers to.
  //
  // A cart can't be settled until it stops moving, which is when the host
  // places the order at the cutoff. Before that the total on screen is a
  // draft: people decide what they want on the day (am I hungry, do I
  // have dinner plans), so a cart typically gets filled in hours before
  // the show and changes several times while it does. Paying against a
  // draft means paying the wrong number.
  const concessionsCost = Math.round((concessions + tax) * 100) / 100;
  const concessionsSettled = isHost || !!(seat && seat.concessionsPaid);
  const concessionsOwed = concessionsSettled ? 0 : concessionsCost;
  // Everything still outstanding, draft food included -- what you'll end
  // up sending, so there are no surprises later.
  const owed = isHost ? 0 : Math.round(((ticketPaid ? 0 : ticketPrice) + concessionsOwed) * 100) / 100;
  // What can actually be settled right now. Same as `owed` once orders
  // have closed; before that it's the ticket alone.
  const payable = isHost ? 0 : Math.round(((ticketPaid ? 0 : ticketPrice) + (cartLocked ? concessionsOwed : 0)) * 100) / 100;
  const foodPending = concessionsOwed > 0 && !cartLocked;

  totals.innerHTML = '';
  if (ticketPrice > 0){
    totals.appendChild(cartTotalRow(
      t('friend.totals.ticket'),
      ticketPaid ? '<span class="paid-note">' + escapeHtml(t('friend.totals.paidNote')) + '</span>' : escapeHtml(formatPrice(ticketPrice)),
      // Not on the host's own seat: it was never owed, so there's nothing
      // to take back.
      ticketPaid && !isHost ? () => setCartPaid({ ticket: false }) : null
    ));
  }
  totals.appendChild(cartTotalRow(t('friend.totals.concessions'), escapeHtml(concessions > 0 ? formatPrice(concessions) : '--')));
  // Only when there's something to tax -- a row of "Tax $0.00" above an
  // empty order is noise.
  if (tax > 0){
    totals.appendChild(cartTotalRow(t('friend.totals.tax', { rate: formatTaxRate(concessionTaxRate) }), escapeHtml(formatPrice(tax))));
  }
  if (concessionsSettled && concessionsCost > 0 && !isHost){
    totals.appendChild(cartTotalRow(
      t('friend.totals.concessionsPaid'),
      '<span class="paid-note">&#10003;</span>',
      () => setCartPaid({ concessions: false })
    ));
  }
  // No owed row at all on the host's own seat -- there's nothing for them
  // to pay, so the line has nothing to say. The costs above still show,
  // since what the order comes to is worth knowing either way.
  if (!isHost){
    if (owed > 0){
      const owedRow = cartTotalRow(t('friend.totals.owed'), escapeHtml(formatPrice(owed)));
      owedRow.classList.add('is-owed');
      totals.appendChild(owedRow);
    } else if (ticketPaid || concessionsSettled){
      // Something was actually settled, as opposed to a seat that's free
      // and has ordered nothing -- that one owes nothing either, and
      // congratulating it would be strange.
      const doneRow = cartTotalRow(t('friend.totals.settled'), '<span class="paid-note">&#10003;</span>');
      doneRow.classList.add('is-settled');
      totals.appendChild(doneRow);
    }
  }

  // A locked cart has no save button, so there's nothing to hold back.
  const missing = cartLocked ? [] : missingChoices();
  const hint = document.getElementById('cartHint');
  hint.classList.toggle('hidden', missing.length === 0);
  if (missing.length){
    // Names them and says what to do: these lines can't be edited in
    // place, so "still to choose" on its own would be a dead end.
    hint.textContent = t('friend.cart.missingHint', {
      items: missing.map(m => t(m.missing > 1 ? 'friend.cart.missingItemMany' : 'friend.cart.missingItem',
        { label: m.label, name: m.name, count: m.missing })).join(', ')
    });
  }

  // Nothing to confirm and nothing to discard -- every change is already
  // written -- so Close is just Close.

  // Note carries the seat so the host can tell two friends' payments
  // apart in a Venmo feed; Cash App has no note param at all (see
  // buildCashAppLink).
  const payNote = (obj && obj.title ? obj.title : 'Movie') +
    ' (' + formatDateShort(obj ? obj.date : '') + ', ' + cartSeatId + ')' +
    (concessions > 0 ? ' + concessions' : '');
  // Withheld while a write is in flight or has failed (the figure on the
  // button would be one the host hasn't got), and while a line is short
  // its pick, because that order isn't one they can actually place.
  //
  // Everything below offers `payable`, not `owed`: sending the draft food
  // total now and having it change before the order goes in is worse than
  // sending it twice, and it would put the app's record out of step with
  // what actually got sent.
  const showPay = saveState === 'idle' && missing.length === 0 && payable > 0;

  const venmoEl = document.getElementById('cartVenmoLink');
  const venmoUrl = showPay ? buildVenmoLink(payable, payNote) : null;
  venmoEl.classList.toggle('hidden', !venmoUrl);
  if (venmoUrl){
    venmoEl.href = venmoUrl;
    if (opensInNewTab(venmoUrl)) venmoEl.target = '_blank';
    else venmoEl.removeAttribute('target');
    venmoEl.textContent = t('friend.totals.venmo', { amount: formatPrice(payable) });
  }

  const cashEl = document.getElementById('cartCashappLink');
  const cashUrl = showPay ? buildCashAppLink(payable) : null;
  cashEl.classList.toggle('hidden', !cashUrl);
  if (cashUrl){
    cashEl.href = cashUrl;
    cashEl.textContent = t('friend.totals.cashApp', { amount: formatPrice(payable) });
  }

  // Held back on exactly the same terms as the pay links: while a write
  // is in flight the figure on screen isn't the one the host will see,
  // and marking that paid would settle an amount neither of them agreed
  // on. Nothing payable, nothing to mark.
  const markEl = document.getElementById('cartMarkPaid');
  markEl.classList.toggle('hidden', !(showPay && !isHost));
  // Short on the button (it's a third of the row); the amount is right
  // beside it on the pay link, and stays in the accessible name.
  markEl.textContent = t('friend.totals.markPaid');
  markEl.setAttribute('aria-label', t('friend.totals.markPaidFull', { amount: formatPrice(payable) }));
  markEl.disabled = paidInFlight;
  // An empty two-thirds would leave "I've paid" floating right.
  document.getElementById('cartPayLinks').classList.toggle('hidden', !venmoUrl && !cashUrl);

  document.getElementById('cartCalLink').href = '/calendar/' + encodeURIComponent(cartShowtimeId) +
    '.ics?seat=' + encodeURIComponent(cartSeatId);

  // Says why the button is asking for less than the row above it does.
  // Without it that gap reads as a bug.
  const pendingEl = document.getElementById('cartFoodPending');
  pendingEl.classList.toggle('hidden', !(foodPending && !isHost));
  if (foodPending) pendingEl.textContent = t('friend.totals.foodPending');
}

// "Paid" is somebody saying so. Venmo and Cash App hand off to another
// app and never report back, so there is no other way this could work,
// and a friend group that shares one password to reserve each other's
// seats is not one that needs this policed. Anyone can mark any seat,
// anyone can undo it, and the host can overrule all of it in the editor.
let paidInFlight = false;

// Marks a seat without a cart open behind it -- the post-claim card, where
// the list underneath still needs redrawing but there's no footer to
// re-render. Deliberately not awaited by its callers: the card moves to
// its next step immediately either way, and a write that fails leaves the
// seat owing, which is the safe way for this to be wrong.
async function markSeatPaid(showtimeId, seatId, patch){
  try{
    const res = await fetch('/api/public/showtimes/' + encodeURIComponent(showtimeId) +
      '/seats/' + encodeURIComponent(seatId) + '/paid', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(patch)
    });
    if (!res.ok) return;
    const data = await res.json();
    const idx = allShowtimes.findIndex(x => x.id === showtimeId);
    if (idx !== -1) allShowtimes[idx] = data.showtime;
    renderCards();
    if (currentShowtimeId === showtimeId) buildSeatmap(data.showtime);
  }catch(e){ /* left owing -- see above */ }
}

async function setCartPaid(patch){
  if (!cartShowtimeId || !cartSeatId || paidInFlight) return;
  paidInFlight = true;
  renderCartFoot();
  try{
    const res = await fetch('/api/public/showtimes/' + encodeURIComponent(cartShowtimeId) +
      '/seats/' + encodeURIComponent(cartSeatId) + '/paid', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(patch)
    });
    if (await handleAuthFailure(res)) return;
    if (!res.ok) return;
    const data = await res.json();
    // The server's copy of the seat is the one that decides what's still
    // owed, and the list behind this card is showing the old answer.
    const idx = allShowtimes.findIndex(x => x.id === cartShowtimeId);
    if (idx !== -1) allShowtimes[idx] = data.showtime;
    renderCards();
    if (currentShowtimeId === cartShowtimeId) buildSeatmap(data.showtime);
  } catch (err){
    // Nothing to roll back -- the footer redraws from the copy we still
    // have, which is the state the server is still in.
  } finally {
    paidInFlight = false;
    renderCartFoot();
  }
}

// Settles exactly what the button just offered. The food only counts
// once orders have closed and its total is final -- before that the
// button is the ticket alone, and marking the food paid off a draft is
// the thing this is carefully not doing.
function markCartPaid(){
  setCartPaid({ ticket: true, concessions: cartLocked });
}

function cartTotalRow(label, valueHtml, onUndo){
  const row = document.createElement('div');
  row.className = 'cart-total-row';
  row.innerHTML = '<span>' + escapeHtml(label) + '</span><span>' + valueHtml + '</span>';
  if (onUndo){
    const undo = document.createElement('button');
    undo.type = 'button';
    undo.className = 'paid-undo';
    undo.textContent = t('friend.totals.undo');
    undo.addEventListener('click', onUndo);
    row.lastChild.appendChild(undo);
  }
  return row;
}

// ---------------- INIT ----------------
// A reload keeps its history entry, so put back the view it names once
// there's a list to find it in. Straight after setting up a profile,
// offer the seats reserved under your name before profiles existed.
loadMe().then(loadList).then(() => {
  if (navState().canopyView !== 'grid') applyNavState(navState());
  let isNew = false;
  try{ isNew = sessionStorage.getItem('canopy_new_profile') === '1'; sessionStorage.removeItem('canopy_new_profile'); }catch(e){}
  if (isNew) openExisting(false);
});
loadConfig(); // populates venmoHandle for the post-claim pay link
loadConcessionMenu(); // so the post-claim overlay knows whether to offer concessions
</script>
