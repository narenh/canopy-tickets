<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Upcoming Showtimes</title>
<!-- OG_META -->
<style>
  :root{
    --gold:#c9a24b;
    --gold-dark:#8a712f;
    --red:#e2333d;
    --green:#2ecc71;
    --venmo:#008CFF;
    --cashapp:#00D64F;
    --bg:#0b0b0d;
    --muted:#9a9a9a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:#fff;
    font-family:-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    padding-bottom:40px;
  }
  .hidden{display:none !important;}
  /* Set while the concessions sheet is open -- see closeCartOverlay. */
  body.cart-open{overflow:hidden;}

  /* Everything here is laid out mobile-first (full-bleed, no width cap),
     which on a desktop window stretches every card, header and form row
     across the whole screen. Cap the content column and center it so a
     wide window just gets margins instead of 2000px-wide cards. The
     full-screen overlays are deliberately not in here -- they're
     position:fixed against the viewport and cap their own cards.

     880, not a rounder 800: the widest seat map (IMAX, 34 seats at
     22px + 2px gap, plus .seatmap's 16px side padding) needs ~846px,
     and anything narrower puts each row's last seat behind a
     horizontal scroll on desktop. Narrow this and check the IMAX
     picker before assuming it's only a prose-width knob. */
  #listView, #pickerView{
    max-width:880px;
    margin:0 auto;
  }

  /* ---------- LIST VIEW ---------- */
  .list-header{
    padding:24px 20px 10px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .site-logo{
    display:block;
    max-height:40px;
    max-width:100%;
    width:auto;
    height:auto;
    margin:0 0 10px;
  }
  .list-header h1{
    font-size:26px;
    margin:0 0 4px;
  }
  .list-header p{
    margin:0;
    color:var(--muted);
    font-size:14px;
  }
  .logout-link{
    color:var(--muted);
    font-size:12px;
    cursor:pointer;
    text-decoration:underline;
    white-space:nowrap;
    margin-top:4px;
  }
  .cards{
    /* 10, not 20, at the sides. Paired with the card's own 10 below it
       this puts a card's contents at 20px -- the same left edge as the
       page title above them, which they never shared before -- while the
       card itself sits closer to the screen edge and the rows inside it
       get the width back. */
    padding:14px 10px 20px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .card{
    background:#151517;
    border:1px solid #2a2a2a;
    border-radius:14px;
    padding:14px 10px;
  }
  /* Poster + title/info/seat-count column, side by side; the claimed-
     seat names and the Reserve button below stay full-width (not part
     of this row). */
  .card-body{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:10px;
    cursor:pointer;
    /* Pulled out to the card's edges and padded back, so the pressed and
       focused states cover the full width of the header rather than a
       box floating inside it. */
    margin-left:-10px;
    margin-right:-10px;
    padding:4px 10px;
    border-radius:10px;
  }
  .card-body:hover{background:#1a1a1d;}
  .card-body:focus-visible{outline:2px solid var(--gold);outline-offset:-2px;}
  /* Says the header goes somewhere. Muted, because the Reserve button
     below it is the call to action and this shouldn't compete. */
  .card-chevron{
    flex:0 0 auto;
    width:8px;
    height:8px;
    margin-left:2px;
    border-right:2px solid var(--muted);
    border-top:2px solid var(--muted);
    transform:rotate(45deg);
  }
  .card-info{flex:1;min-width:0;}
  /* Same box whether or not this title has a poster yet, so every card's
     title/info column starts at the same x regardless. */
  .poster-thumb{
    flex:0 0 auto;
    width:60px;
    height:90px;
    border-radius:8px;
    overflow:hidden;
    background:#000;
  }
  .poster-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .poster-thumb.poster-placeholder{background:#0f0f10;border:1px solid #2a2a2a;}
  .card h3{
    margin:0 0 4px;
    font-size:18px;
  }
  /* Date + time get their own row directly under the title -- it's what
     you actually scan a list of showtimes for, so it shouldn't be buried
     mid-way through a pipe-separated run of theater/format/price.
     Bigger and bolder than .meta, but deliberately the same secondary
     #ccc: size and weight carry the emphasis, not brightness, so it
     stays clearly below the white title in the hierarchy. */
  .card .when{
    color:#ccc;
    font-size:15px;
    font-weight:700;
    line-height:1.3;
    margin-bottom:5px;
  }
  .card .meta{
    color:#ccc;
    font-size:13px;
    line-height:1.4;
    /* No min-height here anymore. It used to reserve 2 lines so a short
       info column couldn't come out shorter than the poster's fixed
       90px; the .when row above now supplies that height on its own, and
       reserving it twice just left a blank gap under a one-line meta. */
    margin-bottom:6px;
  }
  .seats-avail-line{
    font-size:14px;
    font-weight:700;
    margin-bottom:8px;
  }
  .seats-avail-green{color:var(--green);}
  .seats-avail-red{color:var(--red);}
  .seats-empty{
    color:var(--muted);
    font-size:13px;
    margin-bottom:8px;
  }
  .seat-line{
    font-size:13px;
    color:#ddd;
    margin-bottom:3px;
  }
  .seat-line b{color:var(--gold);}
  /* Same size and weight as the name beside it -- only the colour sets
     it back, so the two read as one label rather than a name with a
     footnote. The margin is the breathing room between them. */
  .seat-line .seat-id{
    color:var(--muted);
    font-weight:700;
    margin-right:9px;
  }
  .seat-line .unpaid-tag{color:#e2857a;font-size:11px;margin-left:6px;}
  .claimed-list{margin-bottom:10px;}
  .claim-btn{
    width:100%;
    background:var(--gold);
    color:#241c07;
    border:none;
    border-radius:20px;
    padding:10px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
  }
  .claim-btn:disabled{
    background:#2a2a2a;
    color:var(--muted);
    cursor:not-allowed;
  }
  .empty-state, .loading-state{
    padding:40px 20px;
    text-align:center;
    color:var(--muted);
    font-size:14px;
  }

  /* ---------- SEAT PICKER VIEW ---------- */
  .header{
    padding:20px 20px 14px;
  }
  .top-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .back-btn{
    font-size:22px;
    color:#fff;
    cursor:pointer;
    opacity:.85;
    padding:4px 8px 4px 0;
  }
  .picker-title{
    font-size:22px;
    font-weight:800;
    line-height:1.15;
    flex:1;
  }
  .picker-subtitle{
    margin-top:8px;
    color:#e8e8e8;
    font-size:14px;
  }
  /* screen-wrap is now a flex item inside .seatmap itself (built in JS,
     one per render) so it scrolls horizontally in lock-step with the
     seat rows instead of staying fixed while they scroll underneath it.
     Its width gets set explicitly in JS to match the widest row, so the
     arc's peak and the word "SCREEN" line up with the actual center of
     the seat block rather than a fixed 900px guess. */
  .screen-wrap{padding:0 0 10px;text-align:center;flex:0 0 auto;}
  .screen-curve{display:block;width:100%;height:26px;}
  .screen-label{color:#ccc;font-size:11px;letter-spacing:3px;margin-top:2px;}
  .seatmap{
    display:flex;
    flex-direction:column;
    /* Flush-left, not centered -- `align-items:safe center` (the
       previous approach) silently falls back to flex-start on browsers
       that don't support the `safe` keyword (confirmed: Mobile Safari),
       so different rows ended up genuinely centered in some browsers
       and flush-left in others, with row A's alignment fix computed
       for the wrong one. Flush-left is unambiguous everywhere -- row
       A's own padStart (see seat-layout.js) is what actually aligns it
       now, not a browser's cross-axis alignment support. */
    align-items:flex-start;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    padding:6px 16px 10px;
  }
  .row{
    display:flex;
    justify-content:flex-start;
    gap:2px;
    margin:2px 0;
    width:max-content;
  }
  /* Stadium-style rooms with a few flat rows up front (e.g. Dolby's A-C)
     get extra breathing room here before the raised rows start -- no
     divider line, just space. */
  .row.row-gap-after{
    margin-bottom:24px;
  }
  .seat{
    position:relative;
    width:22px;
    height:20px;
    border-radius:4px;
    background:#2a2a2a;
    border:1px solid #3a3a3a;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:7px;
    color:#666;
    font-weight:700;
    user-select:none;
    flex:0 0 auto;
  }
  /* Deliberately not var(--gold)/var(--red) here -- those still cover
     buttons/text elsewhere on this page. Pickable is the one seat state
     you'd actually tap, so it gets its own brighter/more saturated
     gold to read as the obvious call to action; taken is done/inert
     (nothing to click), so a darker, less alarming red keeps it from
     visually competing with pickable for attention. */
  .seat.pickable{background:#e8b93f;border-color:#a9791b;color:#2e2308;cursor:pointer;}
  .seat.taken{background:#7a2a30;border-color:#551c20;color:#e8d4d4;cursor:not-allowed;}
  /* A wheelchair space is just the icon -- no seat box at all, so it
     doesn't read as a seat you'd claim the way a companion seat is. A
     companion seat keeps the normal seat box (same shape/coloring as
     any other seat, state colors included) and just swaps its number
     for the icon. Comes after the state rules above so it wins the tie
     (same specificity, later wins) on wc's own state classes. */
  .seat.wc{background:none;border:none;}
  /* Blank spacer -- see seat-layout.js's `padStart`. Same box size as a
     real seat (so it takes up exactly one column) but otherwise nothing:
     no border, no background, not part of the tab/hover/click behavior. */
  .seat-filler{width:22px;height:20px;flex:0 0 auto;}
  /* Custom hover tooltip (seat number + assignment), bigger and more
     legible than the browser's native title-attribute tooltip. */
  .seat:hover::before{
    content:attr(data-tooltip);
    position:absolute;
    bottom:130%;
    left:50%;
    transform:translateX(-50%);
    background:#000;
    color:#fff;
    padding:4px 8px;
    border-radius:6px;
    font-size:12px;
    font-weight:400;
    white-space:nowrap;
    z-index:20;
    pointer-events:none;
    border:1px solid #444;
  }
  .toolbar-note{
    color:var(--muted);
    font-size:11.5px;
    padding:0 20px 10px;
  }
  .legend{
    margin-top:12px;
    padding:14px 20px;
    border-top:1px solid #2a2a2a;
    display:flex;
    flex-wrap:wrap;
    gap:18px;
    font-size:13px;
    color:#ddd;
  }
  .legend-item{display:flex;align-items:center;gap:8px;}
  .legend-swatch{width:18px;height:18px;border-radius:4px;display:inline-block;}
  .sw-pickable{background:#e8b93f;border:1px solid #a9791b;}
  .sw-taken{background:#7a2a30;}
  .sw-unavail{background:#2a2a2a;border:1px solid #3a3a3a;}

  /* ---------- CLAIM OVERLAY ---------- */
  .claim-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:50;
  }
  .claim-card{
    width:100%;
    max-width:320px;
    background:#151517;
    border:1px solid #2a2a2a;
    border-radius:14px;
    padding:20px;
  }
  .claim-title{
    font-size:17px;
    font-weight:700;
    margin-bottom:6px;
  }
  .claim-sub{
    color:var(--muted);
    font-size:12px;
    margin-bottom:14px;
  }
  .claim-card input[type="text"]{
    width:100%;
    background:#0f0f10;
    color:#fff;
    border:1px solid #3a3a3a;
    border-radius:10px;
    padding:10px 12px;
    font-size:15px;
    margin-bottom:14px;
  }
  .claim-actions{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .claim-actions button, .claim-actions a{
    width:100%;
    padding:10px;
    border-radius:20px;
    font-size:14px;
    cursor:pointer;
    border:1px solid #3a3a3a;
    background:#1e1e1e;
    color:#fff;
    text-align:center;
    text-decoration:none;
    display:block;
    box-sizing:border-box;
  }
  .claim-actions .claim-submit-btn, .claim-actions .venmo-btn{
    background:var(--venmo);
    color:#fff;
    border:none;
    font-weight:700;
  }
  /* The first thing on this card and the one that stops being possible
     once it's dismissed, so it gets a solid fill rather than the plain
     dark of the secondary buttons. Gold, not a blue of its own: it's the
     page's own accent, and it keeps the two blue-ish fills below it
     reading as the pay buttons rather than as a set of three. */
  .claim-actions .cal-btn{
    background:var(--gold);
    color:#241c07;
    border:none;
    font-weight:700;
  }
  .claim-actions .cashapp-btn{
    background:var(--cashapp);
    color:#04240f;
    border:none;
    font-weight:700;
  }
  /* The cart's Save button sits right above the pay buttons and shares
     their shape -- without this it keeps its bright "press me" blue in
     the nothing-to-save state, one button away from two that really are
     pressable. */
  .claim-actions button:disabled{
    background:#1e1e1e;
    color:var(--muted);
    border:1px solid #3a3a3a;
    font-weight:400;
    cursor:default;
  }
  .success-sub{
    color:#e8e8e8;
    font-size:14px;
    margin-bottom:10px;
  }
  .success-step{
    color:var(--muted);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.08em;
    min-height:14px;
    margin-bottom:10px;
  }
  .claim-error{
    color:#e2857a;
    font-size:12px;
    min-height:16px;
    margin-bottom:6px;
  }

  /* ---------- CONCESSIONS (list card) ---------- */
  /* A reserved seat's line is the entry point to its cart, so the whole
     line is the tap target rather than a separate small button hanging
     off the end of it -- there's one of these per claimed seat and a row
     of 12 tiny buttons would be both uglier and harder to hit on a
     phone. It's a <button> (not a div with onclick) so keyboard and
     screen-reader users get it for free. */
  button.seat-line{
    display:flex;
    align-items:center;
    gap:8px;
    width:100%;
    text-align:left;
    background:#101012;
    border:1px solid #232326;
    border-radius:10px;
    padding:8px 10px;
    margin-bottom:6px;
    color:#ddd;
    font-family:inherit;
    font-size:13px;
    cursor:pointer;
  }
  button.seat-line:hover{border-color:#3a3a3a;}
  .seat-line-main{flex:1;min-width:0;}
  .seat-line-who{margin-bottom:2px;}
  .concession-summary{
    color:var(--muted);
    font-size:11.5px;
    line-height:1.35;
    /* Long orders wrap instead of stretching the card -- the full cart
       is one tap away, this line is only ever a glance. */
    overflow-wrap:anywhere;
  }
  .concession-summary.has-items{color:#cbbf9a;}
  .concession-cta{
    flex:0 0 auto;
    color:var(--gold);
    font-size:11px;
    font-weight:700;
    white-space:nowrap;
  }

  /* ---------- CART OVERLAY ---------- */
  /* Wider and taller than the claim/success cards: this one is a list of
     every menu item, not a single field. The head and foot stay put and
     only the item list scrolls, so the running total and the Save button
     never scroll out of reach mid-order. */
  /* A phone gets the whole screen rather than a card floating on a
     dimmed page: at this size the margins were costing rows of menu, and
     a sheet that fills the display makes the menu the only thing on
     screen that scrolls. */
  @media (max-width: 600px){
    #cartOverlay{padding:0;}
    #cartOverlay .cart-card{
      width:100%;
      max-width:none;
      height:100%;
      border-radius:0;
      border:none;
    }
  }
  .cart-card{
    max-width:420px;
    /* height, not max-height: the menu below is sized flex-basis 0, so it
       contributes no natural height of its own and the card would
       otherwise shrink-wrap the order panel and footer, leaving the menu
       pinned at its minimum even on a tall screen. Fixing the sheet's
       height lets the menu take everything the order panel doesn't. */
    height:min(88vh, 760px);
    display:flex;
    flex-direction:column;
    padding:0;
  }
  .cart-head{
    position:relative;
    padding:16px 20px 6px;
    flex:0 0 auto;
  }
  .cart-close-x{
    position:absolute;
    top:8px;
    right:10px;
    width:34px;
    height:34px;
    border-radius:50%;
    border:none;
    background:none;
    color:var(--muted);
    font-size:26px;
    line-height:1;
    padding:0;
    cursor:pointer;
  }
  .cart-close-x:hover{color:#fff;}
  /* Leaves room for the X so a long movie title can't run under it. */
  .cart-head .claim-title{padding-right:34px;}
  .cart-subrow{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:10px;
  }
  .cart-subrow .claim-sub{margin-bottom:0;}
  .cart-body{
    /* basis 0, not auto: with `auto` the menu's natural height (40-odd
       rows) dominated the shrink weighting, so the order panel below
       absorbed almost all of it and collapsed to two rows. At basis 0 the
       menu takes the space that's left over instead, and min-height is
       the floor a long order can't push it through. */
    flex:1 1 0;
    min-height:132px;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    /* Tighter at the sides than the head and foot: every row now sits
       inside a section, which brings its own border and padding, so the
       old 20px stacked into a deep gutter. At 10px the section labels
       still line up with the title above them.
       No padding at the TOP, because a sticky header's `top: 0` is inset
       by the scroller's padding -- 4px here was 4px of band above the
       pinned header with item rows sliding visibly through it. The first
       section's own margin supplies the spacing instead. */
    padding:0 10px 4px;
  }
  .cart-foot{
    flex:0 0 auto;
    padding:12px 20px 18px;
    border-top:1px solid #2a2a2a;
  }
  .cart-item{
    padding:9px 0;
    border-bottom:1px solid #202023;
  }
  .cart-item:last-child{border-bottom:none;}
  /* The item and its stepper sit on one row; the note field (when there
     is one) drops to a full-width line underneath, which is the only way
     it's usable at phone width. */
  .ci-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .ci-main{flex:1;min-width:0;}
  .ci-name{font-size:14px;color:#fff;overflow-wrap:anywhere;}
  .ci-price{font-size:12px;color:var(--muted);margin-top:1px;}
  .ci-off-menu{color:#e2857a;}
  /* One tap, one line. No quantity control: a quantity can only carry
     one idea of what the order is, and two popcorn chickens may well
     want two different sauces. */
  .ci-add{
    flex:0 0 auto;
    width:30px;
    height:30px;
    border-radius:50%;
    border:none;
    background:var(--gold);
    color:#241c07;
    font-size:18px;
    font-weight:700;
    line-height:1;
    padding:0;
    cursor:pointer;
  }
  .ci-add:disabled{opacity:.35;cursor:not-allowed;}
  .ci-count{
    flex:0 0 auto;
    font-size:12px;
    font-weight:700;
    color:var(--gold);
    min-width:16px;
    text-align:right;
  }
  .ci-choice-select{
    width:100%;
    margin-top:7px;
    background:#0f0f10;
    color:#fff;
    border:1px solid #2f2f2f;
    border-radius:8px;
    padding:6px 8px;
    font-size:12.5px;
    font-family:inherit;
  }
  /* Amber, not red: nothing is wrong yet, there's just a pick to make
     before the "+" will do anything. */
  .ci-choice-select.needs-choice{
    border-color:var(--gold-dark);
    color:var(--gold);
  }

  /* ---------- ORDER LIST ---------- */
  .cart-order{
    /* Shrink, don't grow: this is the item that gives up room when the
       card runs short, which is why its min-height is 0 and the menu's
       isn't. */
    flex:0 1 auto;
    min-height:0;
    display:flex;
    flex-direction:column;
    max-height:min(168px, 24vh);
    /* Belt and braces with the inner list's own scroll: whatever the
       list does, nothing from this panel paints over the totals. */
    overflow:hidden;
    padding:0 20px;
    border-top:1px solid #2a2a2a;
  }
  .cart-order-toggle{
    flex:0 0 auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    width:100%;
    cursor:pointer;
    background:none;
    border:none;
    font-family:inherit;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--muted);
    padding:6px 0 5px;
    text-align:left;
  }
  .cart-order-toggle::before{
    content:'\25b8';
    display:inline-block;
    margin-right:5px;
    transition:transform .15s;
  }
  .cart-order:not(.is-collapsed) .cart-order-toggle::before{transform:rotate(90deg);}
  .cart-order-toggle span:first-of-type{flex:1;}
  .cart-order.is-collapsed .cart-order-list{display:none;}
  .cart-order-count{
    flex:0 0 auto;
    text-transform:none;
    letter-spacing:0;
    font-size:11.5px;
    color:var(--gold);
  }
  /* Capped in px as well as vh so the footer's height is predictable on a
     short phone, where vh alone still left the menu with a few rows. Past
     the cap this list scrolls inside itself; collapsing it gives the whole
     card back to the menu. */
  .cart-order-list{
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding-bottom:6px;
  }
  .cart-pay-row{display:flex;gap:8px;}
  .cart-pay-row a{flex:1 1 0;min-width:0;font-size:13px;}
  .order-row{
    display:flex;
    align-items:baseline;
    gap:8px;
    padding:4px 0;
    font-size:13px;
  }
  .order-main{flex:1;min-width:0;overflow-wrap:anywhere;}
  .order-name{color:#fff;}
  .order-option{color:var(--gold);}
  .order-option.is-missing{color:#e2857a;}
  .order-line-note{color:var(--muted);font-size:11.5px;}
  .order-price{flex:0 0 auto;color:var(--muted);font-size:12px;}
  .order-remove{
    flex:0 0 auto;
    width:22px;
    height:22px;
    border-radius:50%;
    border:1px solid #3a3a3a;
    background:#1e1e1e;
    color:var(--muted);
    font-size:14px;
    line-height:1;
    padding:0;
    cursor:pointer;
  }
  .order-remove:disabled{opacity:.35;cursor:not-allowed;}
  /* Amber rather than red: nothing is broken, there's just a pick still
     owed before this will save. */
  .cart-hint{
    background:#241c07;
    border:1px solid var(--gold-dark);
    color:#f0dda9;
    border-radius:8px;
    padding:7px 10px;
    font-size:11.5px;
    margin-bottom:10px;
    overflow-wrap:anywhere;
  }
  .cart-totals{
    font-size:13px;
    color:#ddd;
    margin-bottom:12px;
  }
  .cart-total-row{
    display:flex;
    justify-content:space-between;
    gap:12px;
    padding:2px 0;
  }
  .cart-total-row.is-owed{
    font-size:15px;
    font-weight:700;
    color:#fff;
    border-top:1px solid #2a2a2a;
    margin-top:6px;
    padding-top:7px;
  }
  .cart-total-row .paid-note{color:var(--green);}
  /* A section used to be a hairline rule and some bold white text, which
     read as just another item row -- the headers were easy to scroll
     straight past. Now each one is a card of its own: its own border,
     its own darker ground, and clear air above and below. */
  /* Square, not rounded. A rounded card whose header is a separately
     rounded box never quite nests -- the two radii (12 and 11) left a
     hairline halo in every corner -- and the header's rule and the rows'
     rules were inset differently, so none of the lines agreed. Square
     corners and one inset make every hairline span the same width. */
  .cart-section{
    margin:12px 0;
    border:1px solid #26262a;
    background:#101012;
  }
  .cart-section summary{
    /* Sticks to the top of the scrolling menu while its own section is
       open, so "which list am I in" is answerable without scrolling back
       up -- the point where a 25-row section is most confusing is in the
       middle of it. */
    position:sticky;
    top:0;
    z-index:2;
    /* Paints its own colour upward past the pin point. The scroller clips
       it at the top edge, so this costs nothing visually but guarantees
       no strip of item row can show above the header -- browsers don't
       agree on exactly where `top: 0` lands, and on iOS the gap was wider
       than the padding alone accounts for. */
    box-shadow:0 -14px 0 0 #1a1a1e;
    display:flex;
    align-items:center;
    gap:9px;
    padding:11px 12px;
    background:#1a1a1e;
    font-size:11.5px;
    font-weight:800;
    letter-spacing:.09em;
    text-transform:uppercase;
    /* Gold, not white: nothing else in this list is gold except the "+"
       buttons, so a header can't be mistaken for an item's name. */
    color:var(--gold);
    cursor:pointer;
    list-style:none;
    user-select:none;
  }
  .cart-section summary::-webkit-details-marker{display:none;}
  .cart-section[open] summary{
    border-bottom:1px solid #26262a;
  }
  /* A real chevron rather than a 5px triangle, and in the accent colour
     so it reads as a control. */
  .cart-section summary::before{
    content:'';
    flex:0 0 auto;
    width:7px;
    height:7px;
    border-right:2px solid var(--gold);
    border-bottom:2px solid var(--gold);
    transform:rotate(-45deg);
    margin-left:2px;
    margin-right:1px;
    transition:transform .15s;
  }
  .cart-section[open] summary::before{transform:rotate(45deg);margin-top:-3px;}
  /* The label sits between the chevron and the count, so it gets the slack. */
  .cart-section summary span:first-of-type{flex:1;}
  /* Plain text, not a chip: it's a footnote on the header, and a bordered
     pill on every section was more furniture than the number deserves.
     Colour alone carries the "something in here is ordered" state. */
  .cart-section-count{
    flex:0 0 auto;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.02em;
    text-transform:none;
    color:var(--muted);
  }
  .cart-section-count.has-order{color:var(--gold);}
  /* No padding on the wrapper: the rows carry their own, so each row's
     rule runs the full width of the section the way the header's does,
     instead of stopping 10px short at both ends. */
  .cart-section-body{padding:0;}
  /* Indented so a row inside a section reads as belonging to the header
     above it rather than as another top-level item. */
  .cart-section-body .cart-item{padding:9px 12px;}
  .cart-section-body .cart-item:last-child{border-bottom:none;}
  .cart-empty-menu{
    color:var(--muted);
    font-size:13px;
    padding:18px 0;
    text-align:center;
  }
  .cart-locked{
    background:#241c07;
    border:1px solid var(--gold-dark);
    color:#f0dda9;
    border-radius:8px;
    padding:8px 10px;
    font-size:12px;
    margin-bottom:10px;
  }
  /* Unlike the claim overlay's error line, this one doesn't reserve a
     blank row: the cart head already carries a title, a subtitle and
     (sometimes) the closed-orders banner, and two more empty reserved
     lines under them push the first item off a short screen. Errors here
     are rare enough that the shift when one appears is the better trade. */
  .cart-head .claim-error{min-height:0;}
  /* No reserved height any more -- it shares the seat's line, so an empty
     status costs nothing instead of holding a gap open above the menu. */
  .cart-status{
    flex:0 0 auto;
    color:var(--muted);
    font-size:11.5px;
    white-space:nowrap;
  }
  .cart-status.is-error{color:#e2857a;cursor:pointer;text-decoration:underline;}
</style>
</head>
<body>

  <!-- ===================== LIST VIEW ===================== -->
  <div id="listView">
    <div class="list-header">
      <div>
        <!-- LOGO_IMG -->
        <h1>Upcoming Showtimes</h1>
        <p>Reserve a spot below. Tap any reserved seat to add concessions, up to 2 hours before showtime.</p>
      </div>
      <div class="logout-link" onclick="logout()">Log out</div>
    </div>
    <div class="cards" id="cardsContainer">
      <div class="loading-state">Loading...</div>
    </div>
  </div>

  <!-- ===================== SEAT PICKER VIEW ===================== -->
  <div id="pickerView" class="hidden">
    <div class="header">
      <div class="top-row">
        <div class="back-btn" onclick="backToList()">&#8592;</div>
        <div class="picker-title" id="pickerTitle">Movie Title</div>
      </div>
      <div class="picker-subtitle" id="pickerSubtitle"></div>
    </div>

    <div class="seatmap" id="seatmap"></div>
    <div class="toolbar-note" id="pickerNote"></div>

    <div class="legend">
      <div class="legend-item"><span class="legend-swatch sw-pickable"></span> Open</div>
      <div class="legend-item"><span class="legend-swatch sw-taken"></span> Taken</div>
      <div class="legend-item"><span class="legend-swatch sw-unavail"></span> Not Purchased</div>
    </div>
  </div>

  <!-- ===================== CLAIM OVERLAY ===================== -->
  <div class="claim-overlay hidden" id="claimOverlay">
    <div class="claim-card">
      <div class="claim-title" id="claimTitle">Claim seat</div>
      <div class="claim-sub">Your name will be shown next to this seat so the host knows it's yours.</div>
      <div class="claim-error" id="claimError"></div>
      <input type="text" id="claimName" placeholder="Your name" autocomplete="name">
      <div class="claim-actions">
        <button type="button" class="claim-submit-btn" onclick="submitClaim()">Reserve</button>
        <button type="button" onclick="closeClaimOverlay()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- ===================== SUCCESS / PAY OVERLAY ===================== -->
  <div class="claim-overlay hidden" id="successOverlay">
    <div class="claim-card">
      <div class="claim-title">You're in! &#127916;</div>
      <div class="success-sub" id="successSub"></div>
      <div class="success-step" id="successStep"></div>
      <!-- Built a step at a time by renderSuccessStep(): one decision on
           screen, its skip underneath, then the next one. A column of
           five buttons made every one of them look optional. -->
      <div class="claim-actions" id="successActions"></div>
    </div>
  </div>

  <!-- ===================== CONCESSION CART OVERLAY ===================== -->
  <div class="claim-overlay hidden" id="cartOverlay">
    <div class="claim-card cart-card">
      <div class="cart-head">
        <!-- Close in the corner as well as at the foot: on a full-screen
             sheet the bottom button is a scroll away from wherever
             someone's thumb is, and the corner X is where anyone
             dismissing a full-screen thing reaches first. -->
        <button type="button" class="cart-close-x" id="cartCloseX" onclick="closeCartOverlay()" aria-label="Close">&#215;</button>
        <div class="claim-title" id="cartTitle">Concessions</div>
        <!-- The seat and the save state share a line. On its own row the
             status reserved height between the seat and the first item
             whether or not it had anything to say. -->
        <div class="cart-subrow">
          <div class="claim-sub" id="cartSub"></div>
          <!-- Doubles as the retry affordance: with no Save button, a
               failed write has nothing else to offer. -->
          <div class="cart-status" id="cartStatus" onclick="retrySave()"></div>
        </div>
        <div class="cart-locked hidden" id="cartLocked"></div>
        <div class="claim-error" id="cartError"></div>
      </div>
      <div class="cart-body" id="cartBody"></div>
      <!-- Its own flex item between the menu and the footer, not part of
           either. That is what stops a long order squeezing the menu: the
           menu has a min-height the flex algorithm will not go below, and
           this panel gives up space instead, scrolling inside whatever it
           gets. Collapsing it hands the rest back. -->
      <div class="cart-order hidden" id="cartOrderWrap">
        <!-- A button and a div rather than <details>: Chrome puts a
             details element's content in its own internal box, which
             ignores the flex height cap around it -- the list rendered
             straight over the totals and the buttons below instead of
             scrolling inside its panel. -->
        <button type="button" class="cart-order-toggle" id="cartOrderToggle" aria-expanded="true" onclick="toggleOrderPanel()">
          <span>Your order</span>
          <span class="cart-order-count" id="cartOrderCount"></span>
        </button>
        <div class="cart-order-list" id="cartOrderList"></div>
      </div>
      <div class="cart-foot">
        <div class="cart-hint hidden" id="cartHint"></div>
        <div class="cart-totals" id="cartTotals"></div>
        <div class="claim-actions">
          <!-- Side by side rather than stacked: stacking every button
               made this footer most of the card's height, and on a short
               phone that came straight out of the menu above. -->
          <div class="cart-pay-row">
            <a class="venmo-btn hidden" id="cartVenmoLink" href="#" target="_blank" rel="noopener">Venmo</a>
            <a class="cashapp-btn hidden" id="cartCashappLink" href="#" target="_blank" rel="noopener">Cash App</a>
          </div>
          <button type="button" id="cartCloseBtn" onclick="closeCartOverlay()">Close</button>
        </div>
      </div>
    </div>
  </div>

<script src="/seat-layout.js"></script>
<script>

// Inline (not an emoji -- at seat-icon size, the wheelchair emoji renders
// as a tiny broken-looking glyph on several platforms, easily mistaken
// for a failed image load). Path data from svgrepo.com/svg/333986/handicap
// (public domain style icon set). Fixed blue rather than currentColor --
// a seat's background swings from gold to red to green depending on
// state, and this blue reads clearly against all of them by hue alone.
const WHEELCHAIR_ICON_SVG =
  '<svg viewBox="0 0 24 24" width="13" height="13" fill="#3399ff"><circle cx="9" cy="4" r="2"/>' +
  '<path d="M16.98 14.804A1 1 0 0 0 16 14h-4.133l-.429-3H16V9h-4.847l-.163-1.142A1 1 0 0 0 10 7H9a1.003 1.003 0 0 0-.99 1.142l.877 6.142A2.009 2.009 0 0 0 10.867 16h4.313l.839 4.196c.094.467.504.804.981.804h3v-2h-2.181l-.839-4.196z"/>' +
  '<path d="M12.51 17.5c-.739 1.476-2.25 2.5-4.01 2.5A4.505 4.505 0 0 1 4 15.5a4.503 4.503 0 0 1 2.817-4.167l-.289-2.025C3.905 10.145 2 12.604 2 15.5 2 19.084 4.916 22 8.5 22a6.497 6.497 0 0 0 5.545-3.126l-.274-1.374H12.51z"/></svg>';

let allShowtimes = [];     // last-loaded list from /api/public/showtimes
let currentShowtimeId = null;
let claimingSeatId = null;
let seatEls = {};          // seatId -> DOM element, populated by buildSeatmap
// Applied to the concessions subtotal only -- California doesn't tax
// admissions, and cinema food is taxable even where the same item bought
// in a shop wouldn't be. Served by the server so this page and the
// editor can't drift apart on it; 0 until config loads, so a cart drawn
// before then quotes the untaxed total rather than a wrong one.
let concessionTaxRate = 0;
let venmoHandle = null;    // loaded once from /api/public/config
let cashappHandle = null;  // loaded once from /api/public/config

// Bouncing to '/' on a 401 is normally a one-shot fix (session expired,
// go log in again). But if the page we land on still thinks we're
// authed while the API disagrees (e.g. right after a redeploy handed out
// a new session secret), that bounce repeats forever. Refuse to redirect
// more than once in a few seconds -- show a manual link instead of
// hammering the server or the browser's redirect-loop detector.
function handleAuthFailure(res){
  if (res.status !== 401) return false;
  const key = 'canopy_auth_redirect_at';
  const last = Number(sessionStorage.getItem(key) || 0);
  if (Date.now() - last < 4000){
    document.body.innerHTML =
      '<div style="padding:60px 20px;text-align:center;color:#9a9a9a;font-family:-apple-system,sans-serif;">' +
      'Session trouble &mdash; <a href="/" style="color:#c9a24b;">click here to sign in again</a>.</div>';
    return true;
  }
  sessionStorage.setItem(key, String(Date.now()));
  window.location.href = '/';
  return true;
}

async function logout(){
  try{ await fetch('/api/logout', { method: 'POST' }); }catch(e){}
  window.location.href = '/';
}

async function loadConfig(){
  try{
    const res = await fetch('/api/public/config');
    if (await handleAuthFailure(res)) return;
    if (!res.ok) return;
    const data = await res.json();
    venmoHandle = data.venmoHandle || null;
    cashappHandle = data.cashappHandle || null;
    concessionTaxRate = typeof data.concessionTaxRate === 'number' ? data.concessionTaxRate : 0;
  }catch(e){
    // Non-fatal -- the claim flow just skips both pay links.
  }
}

// Builds a Venmo pay link pre-filled with amount + a note identifying
// what it's for, so paying is a single tap instead of hunting the host
// down in Venmo's search.
//
// Deliberately not using URLSearchParams here: its toString() encodes
// spaces as "+" (the application/x-www-form-urlencoded convention), but
// Venmo's app displays the note as-is without decoding "+" back to a
// space, so the note showed up literally full of plus signs. encodeURIComponent
// encodes spaces as %20 instead, which Venmo does render correctly.
function buildVenmoLink(amount, note){
  if (!venmoHandle) return null;
  const parts = ['txn=pay', 'note=' + encodeURIComponent(note)];
  if (typeof amount === 'number') parts.push('amount=' + encodeURIComponent(amount.toFixed(2)));
  return 'https://venmo.com/' + encodeURIComponent(venmoHandle) + '?' + parts.join('&');
}

// Cash App's pay links only support pre-filling an amount, not a note --
// unlike Venmo, there's no query param for that.
function buildCashAppLink(amount){
  if (!cashappHandle) return null;
  let url = 'https://cash.app/$' + encodeURIComponent(cashappHandle);
  if (typeof amount === 'number') url += '/' + amount.toFixed(2);
  return url;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function formatPrice(price){
  return (typeof price === 'number') ? ('$' + price.toFixed(2)) : '';
}

function formatDateDisplay(iso){
  try{
    const [y,m,d] = iso.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    return dt.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
  }catch(e){ return iso; }
}
// Short numeric form for the Venmo note, e.g. "2026-02-12" -> "2/12/26".
function formatDateShort(iso){
  try{
    const [y,m,d] = iso.split('-').map(Number);
    return m + '/' + d + '/' + String(y).slice(-2);
  }catch(e){ return iso; }
}
function formatTimeDisplay(t){
  try{
    const [h,m] = t.split(':').map(Number);
    const dt = new Date();
    dt.setHours(h, m, 0, 0);
    return dt.toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' });
  }catch(e){ return t; }
}

// ---------------- VIEW SWITCHING ----------------
function showList(){
  document.getElementById('pickerView').classList.add('hidden');
  document.getElementById('listView').classList.remove('hidden');
}
function showPicker(){
  document.getElementById('listView').classList.add('hidden');
  document.getElementById('pickerView').classList.remove('hidden');
}
function backToList(){
  currentShowtimeId = null;
  showList();
  loadList();
}

// Today's date as the calendar on the wall has it, NOT as UTC has it.
//
// This used to be toISOString().slice(0,10), which is UTC -- so from 5pm
// Pacific (midnight UTC) onwards it returned TOMORROW, and every showtime
// dated today started comparing as past. Tonight's movie would drop off
// the friend list and into the collapsed Past section exactly when people
// were opening the page to use it. A showtime's `date` comes from an
// <input type="date">, which is local, so the thing it's compared against
// has to be local too.
function todayISO(){
  const d = new Date();
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return d.getFullYear() + '-' + month + '-' + day;
}

// A showtime disappears from the friend-facing list starting the day
// after it occurs -- it's still shown on its own date, just not the day
// after. Plain YYYY-MM-DD string comparison against today's own
// YYYY-MM-DD (both local) sidesteps any UTC/local timezone conversion
// bugs a real Date object could introduce.
function isPastShowtime(obj){
  return typeof obj.date === 'string' && obj.date < todayISO();
}

// ---------------- LIST VIEW ----------------
async function loadList(){
  const container = document.getElementById('cardsContainer');
  container.innerHTML = '<div class="loading-state">Loading...</div>';
  try{
    const res = await fetch('/api/public/showtimes');
    if (await handleAuthFailure(res)) return;
    if (!res.ok) throw new Error('failed to load');
    const data = await res.json();
    allShowtimes = (data.showtimes || []).filter(obj => !isPastShowtime(obj));
    renderCards();
  }catch(e){
    container.innerHTML = '<div class="empty-state">Could not load showtimes. Try again.</div>';
  }
}

// Redraws the list from whatever's already in allShowtimes -- split out
// of loadList so saving a concession cart can refresh the seat lines it
// just changed without a second trip to the server for a list it already
// got back from the save.
function renderCards(){
  const container = document.getElementById('cardsContainer');
  if (allShowtimes.length === 0){
    container.innerHTML = '<div class="empty-state">No showtimes posted yet. Check back soon.</div>';
    return;
  }
  container.innerHTML = '';
  allShowtimes.forEach(obj => container.appendChild(buildCard(obj)));
}

function showtimeSubtitle(obj){
  return [obj.theater, formatDateDisplay(obj.date), formatTimeDisplay(obj.time), obj.format, formatPrice(obj.price)]
    .filter(Boolean).join(' | ');
}
// A list card splits that same information across two rows -- date/time
// on its own prominent row, everything else on the .meta line under it.
// showtimeSubtitle() above is left alone for the picker header, which is
// a single line of its own and reads fine as one run.
function showtimeWhen(obj){
  return [formatDateDisplay(obj.date), formatTimeDisplay(obj.time)].filter(Boolean).join(' \u00b7 ');
}
function showtimeWhere(obj){
  return [obj.theater, obj.format, formatPrice(obj.price)].filter(Boolean).join(' | ');
}

// Poster art, when this title has any (see server's posterUrlForTitle),
// goes to the left of the title/info/open-seat-count column -- not the
// claimed-seat names or the button below, which stay full-width. Same
// fixed size whether or not there's actually a poster, so cards line up
// evenly; the placeholder fills that box instead of leaving a gap when
// a title has no art yet.
function buildPosterEl(obj){
  const poster = document.createElement('div');
  poster.className = 'poster-thumb';
  if (obj.posterUrl){
    const img = document.createElement('img');
    img.src = obj.posterUrl;
    img.alt = '';
    poster.appendChild(img);
  } else {
    poster.classList.add('poster-placeholder');
  }
  return poster;
}

function buildCard(obj){
  const card = document.createElement('div');
  card.className = 'card';

  // The whole header opens the seat map -- for a sold-out showtime too,
  // where it's the only way in and reads as a chart of who's sitting
  // where rather than something to pick from.
  //
  // role/tabindex rather than a <button>: the header carries an <h3>,
  // which isn't valid inside a button, and losing the heading to satisfy
  // the element would be the wrong trade.
  const body = document.createElement('div');
  body.className = 'card-body';
  body.setAttribute('role', 'button');
  body.setAttribute('tabindex', '0');
  body.setAttribute('aria-label', 'Seat map for ' + (obj.title || 'this showtime'));
  body.addEventListener('click', () => openSeatPicker(obj.id));
  body.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      openSeatPicker(obj.id);
    }
  });
  body.appendChild(buildPosterEl(obj));

  const info = document.createElement('div');
  info.className = 'card-info';

  const h3 = document.createElement('h3');
  h3.textContent = obj.title || 'Untitled';
  info.appendChild(h3);

  // Skipped entirely rather than left as an empty row when a showtime
  // somehow has neither a date nor a time -- an empty div would still
  // contribute its margin and open a gap under the title.
  const whenText = showtimeWhen(obj);
  if (whenText){
    const when = document.createElement('div');
    when.className = 'when';
    when.textContent = whenText;
    info.appendChild(when);
  }

  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = showtimeWhere(obj);
  info.appendChild(meta);

  const seats = obj.seats || {};
  const ids = Object.keys(seats).sort(compareSeatIds);
  const claimed = ids.filter(id => seats[id].name);
  const availCount = ids.length - claimed.length;

  if (ids.length === 0){
    const empty = document.createElement('div');
    empty.className = 'seats-empty';
    empty.textContent = 'No seats posted yet';
    info.appendChild(empty);
  } else {
    const availLine = document.createElement('div');
    availLine.className = 'seats-avail-line ' + (availCount > 0 ? 'seats-avail-green' : 'seats-avail-red');
    availLine.textContent = availCount + ' seat' + (availCount === 1 ? '' : 's') + ' available';
    info.appendChild(availLine);
  }

  body.appendChild(info);

  const chevron = document.createElement('div');
  chevron.className = 'card-chevron';
  chevron.setAttribute('aria-hidden', 'true');
  body.appendChild(chevron);

  card.appendChild(body);

  if (ids.length > 0){
    if (claimed.length > 0){
      const claimedList = document.createElement('div');
      claimedList.className = 'claimed-list';
      const ordersOpen = concessionsOpen(obj);
      claimed.forEach(id => claimedList.appendChild(buildClaimedSeatLine(obj, id, ordersOpen)));
      card.appendChild(claimedList);
    }

    const pickBtn = document.createElement('button');
    pickBtn.className = 'claim-btn';
    if (availCount > 0){
      pickBtn.textContent = 'Reserve';
      pickBtn.onclick = () => openSeatPicker(obj.id);
    } else {
      pickBtn.textContent = 'Sold Out';
      pickBtn.disabled = true;
    }
    card.appendChild(pickBtn);
  }

  return card;
}

// One claimed seat on a list card. The whole row is the way into that
// seat's concession cart -- see the CONCESSIONS block below for why any
// friend can open any seat's, not just their own.
function buildClaimedSeatLine(obj, seatId, ordersOpen){
  const seat = (obj.seats || {})[seatId] || {};
  const lines = seat.concessions || [];

  const row = document.createElement('button');
  row.type = 'button';
  row.className = 'seat-line';
  row.addEventListener('click', () => openCart(obj.id, seatId));

  const main = document.createElement('div');
  main.className = 'seat-line-main';

  const who = document.createElement('div');
  who.className = 'seat-line-who';
  // Paid seats show just the name -- only unpaid ones get a tag, so this
  // list reads as "who still owes" rather than a payment log.
  // Seat first, then who's in it: the seat is what you're scanning for
  // when you're looking down a row, and it's the shorter of the two so
  // the names line up.
  who.innerHTML = '<span class="seat-id">' + escapeHtml(seatId) + '</span><b>' + escapeHtml(seat.name || '') + '</b>' +
    (seat.paid ? '' : '<span class="unpaid-tag">unpaid</span>');
  main.appendChild(who);

  // A count, not the contents. Spelling out four people's orders in full
  // turns the showtime list into a wall of sauces; whoever cares about
  // the detail is one tap from it, and the host has the itemised copy.
  const summary = document.createElement('div');
  summary.className = 'concession-summary' + (lines.length ? ' has-items' : '');
  summary.textContent = lines.length
    ? '\uD83C\uDF7F ' + lines.length + ' item' + (lines.length === 1 ? '' : 's')
    : 'No concessions';
  main.appendChild(summary);

  row.appendChild(main);

  const cta = document.createElement('div');
  cta.className = 'concession-cta';
  cta.textContent = ordersOpen ? (lines.length ? 'Edit' : '+ Add') : 'View';
  row.appendChild(cta);

  return row;
}

// ---------------- SEAT PICKER VIEW ----------------
function openSeatPicker(id){
  const obj = allShowtimes.find(s => s.id === id);
  if (!obj) return;
  currentShowtimeId = id;
  document.getElementById('pickerTitle').textContent = obj.title || 'Movie Title';
  document.getElementById('pickerSubtitle').textContent = showtimeSubtitle(obj);

  // Nothing to tap on a sold-out map, so don't tell people to tap.
  const pickerSeats = obj.seats || {};
  const anyOpen = Object.keys(pickerSeats).some(id => !pickerSeats[id].name);
  document.getElementById('pickerNote').textContent = anyOpen
    ? "Tap a gold seat to reserve it. Red seats are already taken; gray seats aren't part of this block."
    : "Every seat in this block is taken \u2014 hover or tap a red seat to see whose it is. Gray seats aren't part of this block.";

  // Show the picker before building the map -- buildSeatmap measures row
  // widths via offsetWidth, which reads 0 on anything still inside a
  // display:none ancestor.
  showPicker();
  buildSeatmap(obj);
}

// Screen arc + "SCREEN" label, built fresh into #seatmap alongside the
// rows (not as a separate element above it) so it's part of the same
// horizontally-scrolling flex column -- it scrolls in lock-step with the
// seats instead of sitting fixed while they scroll underneath it.
function buildScreenWrap(){
  const screenWrap = document.createElement('div');
  screenWrap.className = 'screen-wrap';
  screenWrap.innerHTML =
    '<svg class="screen-curve" viewBox="0 0 900 26" preserveAspectRatio="none">' +
    '<path d="M10,20 Q450,-10 890,20" stroke="#eee" stroke-width="2" fill="none"/></svg>' +
    '<div class="screen-label">SCREEN</div>';
  return screenWrap;
}

function buildSeatmap(obj){
  const seats = obj.seats || {};
  const seatmap = document.getElementById('seatmap');
  seatmap.innerHTML = '';
  seatEls = {};

  const rowDefs = getSeatLayout(obj.screen);

  const screenWrap = buildScreenWrap();
  seatmap.appendChild(screenWrap);

  rowDefs.forEach(row => {
    const rowEl = document.createElement('div');
    rowEl.className = 'row' + (row.gapAfter ? ' row-gap-after' : '');
    // Blank, non-interactive slots before the first real seat -- see
    // seat-layout.js's `padStart` comment. Rows render flush-left, so
    // this is what actually sets this row's horizontal offset from
    // every other row -- not dependent on any browser's cross-axis
    // centering support.
    for (let p = 0; p < (row.padStart || 0); p++){
      const filler = document.createElement('div');
      filler.className = 'seat-filler';
      rowEl.appendChild(filler);
    }
    for (let i = row.count; i >= 1; i--){
      const seatId = row.letter + i;
      const type = row.special[i] || 'seat';
      const seatEl = document.createElement('div');
      seatEl.className = 'seat' + (type !== 'seat' ? ' ' + type : '');
      if (type === 'wc' || type === 'comp') {
        seatEl.innerHTML = WHEELCHAIR_ICON_SVG;
      } else {
        seatEl.textContent = seatId;
      }
      seatEl.setAttribute('aria-label', seatId);
      seatEl.dataset.tooltip = seatId + ' — not purchased';

      const entry = seats[seatId];
      if (entry && entry.name){
        seatEl.classList.add('taken');
        seatEl.dataset.tooltip = seatId + ' — ' + entry.name;
      } else if (entry){
        seatEl.classList.add('pickable');
        seatEl.dataset.tooltip = seatId + ' — available';
        seatEl.addEventListener('click', () => openClaimOverlay(seatId));
      }
      rowEl.appendChild(seatEl);
      seatEls[seatId] = seatEl;
    }
    seatmap.appendChild(rowEl);
  });

  // Match the screen's width to the widest row so its peak/label center
  // on the actual seat block instead of a fixed guess.
  const rowWidths = Array.from(seatmap.querySelectorAll('.row')).map(r => r.offsetWidth);
  if (rowWidths.length) screenWrap.style.width = Math.max(...rowWidths) + 'px';
}

// ---------------- CLAIM OVERLAY ----------------
function openClaimOverlay(seatId){
  claimingSeatId = seatId;
  document.getElementById('claimTitle').textContent = 'Reserve seat ' + seatId;
  document.getElementById('claimError').textContent = '';
  document.getElementById('claimName').value = '';
  document.getElementById('claimOverlay').classList.remove('hidden');
  setTimeout(() => document.getElementById('claimName').focus(), 0);
}

function closeClaimOverlay(){
  claimingSeatId = null;
  document.getElementById('claimOverlay').classList.add('hidden');
}

// ---------------- SUCCESS / PAY OVERLAY ----------------
// The card after a seat is claimed asks one thing at a time: settle up,
// then put it in the calendar, then order something. Each has its own way
// out, and skipping one moves to the next rather than dismissing the lot.
//
// A step that can't do anything is never offered -- no payment handles
// set, no usable date to build an event from, no menu to order off.
let successSteps = [];
let successStepTotal = 0;  // fixed at open, so "2 of 3" doesn't renumber as steps are consumed
let successShowtime = null;
let successSeatId = null;

function openSuccessOverlay(showtime, seatId){
  successShowtime = showtime;
  successSeatId = seatId;

  document.getElementById('successSub').textContent =
    'Seat ' + seatId + ' for ' + (showtime.title || 'this showtime') + (typeof showtime.price === 'number' ? ' -- ' + formatPrice(showtime.price) : '') + '.';

  const seat = (showtime.seats || {})[seatId];
  // Nobody for the host to pay, so don't offer to send them money.
  const isHost = !!(seat && seat.host);
  const canPay = !isHost && !!(buildVenmoLink(showtime.price, '') || buildCashAppLink(showtime.price));

  successSteps = [];
  if (canPay) successSteps.push('pay');
  if (showtimeStart(showtime)) successSteps.push('calendar');
  if (concessionMenu.length) successSteps.push('concessions');
  successStepTotal = successSteps.length;

  renderSuccessStep();
  document.getElementById('successOverlay').classList.remove('hidden');
}

function successButton(label, className, onClick){
  const btn = document.createElement('button');
  btn.type = 'button';
  if (className) btn.className = className;
  btn.textContent = label;
  btn.addEventListener('click', onClick);
  return btn;
}

function renderSuccessStep(){
  const actions = document.getElementById('successActions');
  const stepEl = document.getElementById('successStep');
  actions.innerHTML = '';
  stepEl.textContent = '';

  const step = successSteps[0];
  if (!step){
    // Nothing this showtime can offer -- one way out rather than an
    // empty card.
    actions.appendChild(successButton('Done', '', closeSuccessOverlay));
    return;
  }

  // Only worth saying when there's more than one, and it's what tells
  // someone that "Skip" moves on rather than closing the card.
  if (successStepTotal > 1){
    stepEl.textContent = 'Step ' + (successStepTotal - successSteps.length + 1) + ' of ' + successStepTotal;
  }

  if (step === 'pay'){
    const price = successShowtime.price;
    const note = (successShowtime.title || 'Movie') + ' (' + formatDateShort(successShowtime.date) + ', ' + successSeatId + ')';
    const venmo = buildVenmoLink(price, note);
    const cash = buildCashAppLink(price);
    // Both open in a new tab, so advancing straight away leaves the next
    // step waiting when they come back rather than the one they just did.
    if (venmo) actions.appendChild(successLink(
      typeof price === 'number' ? ('Pay ' + formatPrice(price) + ' via Venmo') : 'Pay via Venmo', 'venmo-btn', venmo, true));
    if (cash) actions.appendChild(successLink(
      typeof price === 'number' ? ('Pay ' + formatPrice(price) + ' via Cash App') : 'Pay via Cash App', 'cashapp-btn', cash, true));
    actions.appendChild(successButton('Skip', '', advanceSuccessStep));
    return;
  }

  if (step === 'calendar'){
    const href = '/api/public/showtimes/' + encodeURIComponent(successShowtime.id) +
      '/calendar.ics?seat=' + encodeURIComponent(successSeatId);
    // No target: iOS shows the Add to Calendar sheet over the page, and a
    // blank tab is what you get if you fight it.
    actions.appendChild(successLink('\uD83D\uDCC5 Add to calendar', 'cal-btn', href, false));
    actions.appendChild(successButton('Skip', '', advanceSuccessStep));
    return;
  }

  // concessions
  actions.appendChild(successButton('\uD83C\uDF7F Add concessions', '', openCartFromSuccess));
  actions.appendChild(successButton('Later', '', advanceSuccessStep));
}

function successLink(label, className, href, newTab){
  const a = document.createElement('a');
  a.className = className;
  a.href = href;
  a.textContent = label;
  if (newTab){
    a.target = '_blank';
    a.rel = 'noopener';
  }
  a.addEventListener('click', () => {
    // Doing the thing counts as finishing the step.
    setTimeout(advanceSuccessStep, 0);
  });
  return a;
}

function advanceSuccessStep(){
  successSteps.shift();
  if (!successSteps.length){
    closeSuccessOverlay();
    return;
  }
  renderSuccessStep();
}

function closeSuccessOverlay(){
  document.getElementById('successOverlay').classList.add('hidden');
}

async function submitClaim(){
  if (!claimingSeatId || !currentShowtimeId) return;
  const errorEl = document.getElementById('claimError');
  const name = document.getElementById('claimName').value.trim();
  if (!name){
    errorEl.textContent = 'Enter your name first.';
    return;
  }
  try{
    const res = await fetch('/api/public/showtimes/' + currentShowtimeId + '/claim', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ seatId: claimingSeatId, name })
    });
    if (await handleAuthFailure(res)) return;
    if (res.status === 409){
      errorEl.textContent = 'Sorry, someone just claimed that seat. Pick another.';
      return;
    }
    if (!res.ok){
      errorEl.textContent = 'Could not claim that seat. Try again.';
      return;
    }
    const data = await res.json();
    const claimedSeatId = claimingSeatId;
    lastClaim = { showtimeId: currentShowtimeId, seatId: claimedSeatId };
    closeClaimOverlay();
    // Refresh the in-memory copy for this showtime and redraw the map so
    // the newly-claimed seat shows red immediately.
    const idx = allShowtimes.findIndex(s => s.id === currentShowtimeId);
    if (idx !== -1) allShowtimes[idx] = data.showtime;
    buildSeatmap(data.showtime);
    openSuccessOverlay(data.showtime, claimedSeatId);
  }catch(e){
    errorEl.textContent = 'Could not reach the server. Try again.';
  }
}

// ---------------- CONCESSIONS ----------------
//
// There's no per-friend identity anywhere in this app -- one shared
// password, and a name typed free-text at claim time -- so a cart belongs
// to a SEAT, not to a login, and anyone on the reservation page can open
// and edit any reserved seat's cart. That's deliberate (and matches how
// the rest of the friend side already works): it's what makes "I'm at the
// counter, add a popcorn to Jordan's too" a thing you can just do.
//
// Menu items are the host's list (admin editor). A cart line snapshots
// the item's name and price at the moment it was added, so the host
// repricing or removing a menu item never silently rewrites an order
// someone already placed -- a line whose item has since left the menu
// still shows, flagged, and can still be edited down to zero.

// Matches MAX_QTY in lib/seats.js -- a cart line over this gets clamped
// server-side, so stopping the stepper here keeps the number on screen
// honest instead of letting it disagree with what got saved.
const MAX_CART_QTY = 99;

// The reservation page promises orders close 2 hours before showtime, so
// the host has a point at which the list stops moving and they can
// actually go buy it all.
//
// This is enforced here and NOT on the server, on purpose. A showtime's
// date/time are stored as bare local strings with no timezone, and the
// server runs in a container that's effectively UTC -- a server-side
// cutoff would lock a San Francisco showtime's carts seven or eight hours
// early. The friend's own clock is the same wall clock the showtime was
// written in, so it's the only one that can read this correctly. It's a
// cutoff in the same spirit as everything else here: it keeps honest
// people honest, and the host can still sort anything out by text.
const CONCESSION_CUTOFF_HOURS = 2;

// Nobody sitting next to Naren gets offered peanut candy. Played for a
// laugh, but it's an allergy, so it's built to fail safe rather than to
// be cute: see hidePeanutRows() for what it deliberately does NOT do.
//
// Matched on a word boundary so "Naren", "naren" and "Naren H" all count
// while a "Karen" two seats over doesn't.
const PEANUT_NEIGHBOR = /\bnaren\b/i;
// Name-matched rather than by a list of ids, so it keeps working after
// the host renames an item or adds one of their own. Reese's is on here
// by brand: the word "peanut" isn't in the name, the peanut butter is.
const PEANUT_ITEM = /peanut|reese/i;

let concessionMenu = [];   // [{id, name, price, note, section, optionGroup}] from /api/public/concession-menu
let optionGroups = [];     // [{id, label, options[]}] -- the choice lists items point at
let openSections = [];     // section names that start expanded rather than folded away
let cartShowtimeId = null;
let cartSeatId = null;
// The order, one entry per unit ordered -- NOT one per menu item with a
// quantity. That's what lets popcorn chicken with ranch and another with
// bbq be two separate things rather than one row that can only hold one
// answer.
let cartOrder = [];        // [{uid, itemId, name, price, option, note}]
let cartUid = 0;           // per-line handle, so a row can be removed without index maths
const menuRowEls = new Map();   // itemId -> { count } in the catalog
const orderRowEls = new Map();  // uid -> { el } in the order list
let sectionEls = [];            // collapsed catalog sections, for live counts
let cartLocked = false;    // past the cutoff -- read-only
// There's no Save button: every add and remove writes straight through.
// With the pick made before a line exists, every state the cart can be in
// is already a valid order, so asking someone to confirm it was ceremony
// -- and a fourth full-width button in a footer that was crowding the
// menu out.
let saveTimer = null;      // debounce handle, so a burst of taps is one request
let saveInFlight = false;  // only ever one PUT at a time, so writes can't land out of order
let savePending = false;   // a change arrived mid-flight; save again when it lands
let saveState = 'idle';    // 'idle' | 'saving' | 'error'
let lastClaim = null;      // {showtimeId, seatId} -- for the success overlay's "Add concessions"

async function loadConcessionMenu(){
  try{
    const res = await fetch('/api/public/concession-menu');
    if (await handleAuthFailure(res)) return;
    if (!res.ok) return;
    const data = await res.json();
    concessionMenu = Array.isArray(data.items) ? data.items : [];
    optionGroups = Array.isArray(data.optionGroups) ? data.optionGroups : [];
    openSections = Array.isArray(data.openSections) ? data.openSections : [];
  }catch(e){
    // Non-fatal -- an already-loaded menu stays usable, and a cart that
    // has never loaded one shows the "no menu yet" state.
  }
}

function concessionsTotal(lines){
  const total = (lines || []).reduce((sum, l) => sum + (l.price || 0) * (l.qty || 0), 0);
  return Math.round(total * 100) / 100;
}

function concessionTax(subtotal){
  if (!(subtotal > 0) || !(concessionTaxRate > 0)) return 0;
  return Math.round(subtotal * concessionTaxRate * 100) / 100;
}

// "8.625%" rather than "8.62%" -- the rate really does carry a third
// decimal, and rounding the label makes the arithmetic look wrong.
function formatTaxRate(rate){
  return (rate * 100).toFixed(3).replace(/0+$/, '').replace(/\.$/, '') + '%';
}

// Local Date for a showtime's start, or null if it hasn't got a usable
// date/time. Built field-by-field rather than by parsing "2026-02-12T19:00"
// as a string, which some browsers read as UTC and some as local.
function showtimeStart(obj){
  if (typeof obj.date !== 'string' || typeof obj.time !== 'string') return null;
  const d = obj.date.split('-').map(Number);
  const t = obj.time.split(':').map(Number);
  if (d.length < 3 || t.length < 2 || d.some(n => !Number.isFinite(n)) || t.some(n => !Number.isFinite(n))) return null;
  const dt = new Date(d[0], d[1] - 1, d[2], t[0], t[1], 0, 0);
  return Number.isFinite(dt.getTime()) ? dt : null;
}

// Open unless we can actually establish the cutoff has passed -- a
// showtime with a missing or unparseable date/time stays editable rather
// than locking everyone out of a cart for no visible reason.
function concessionsOpen(obj){
  const start = showtimeStart(obj);
  if (!start) return true;
  return Date.now() < start.getTime() - CONCESSION_CUTOFF_HOURS * 3600 * 1000;
}

// "Chicken Tenders ×2 (BBQ Sauce, Icing Cup)" -- one cart line in words.
// The picks are part of what was ordered, not a footnote, so they ride
// along wherever the line is named.
function concessionLineLabel(l){
  const options = (l.options || []).filter(Boolean);
  return l.name + (l.qty > 1 ? ' ×' + l.qty : '') + (options.length ? ' (' + options.join(', ') + ')' : '');
}

// One-line "what's in this cart" for the seat row on the list card.
function concessionSummary(lines){
  if (!lines || !lines.length) return '';
  const total = concessionsTotal(lines);
  return lines.map(concessionLineLabel).join(', ') + (total > 0 ? ' — ' + formatPrice(total) : '');
}

// The choice list an item comes with, or [] for one that's just itself.
// An item pointing at a group the host hasn't filled in yet reads as no
// choices at all rather than an empty dropdown.
function optionsForItem(itemId){
  const item = concessionMenu.find(i => i.id === itemId);
  if (!item || !item.optionGroup) return [];
  const group = optionGroups.find(g => g.id === item.optionGroup);
  return group && Array.isArray(group.options) ? group.options : [];
}

function optionLabelForItem(itemId){
  const item = concessionMenu.find(i => i.id === itemId);
  const group = item && optionGroups.find(g => g.id === item.optionGroup);
  return group ? group.label : 'Choice';
}

// The menu body is a catalog: one row per item, a single "+" and nothing
// else. Everything a friend has actually chosen lives in its own list
// above the totals, one row per unit.
//
// It reads as a small thing but it's the difference between being able to
// express "popcorn chicken with ranch AND another with bbq" and not: a
// quantity of 2 on a single row can only carry one idea of what that
// order is. One line per unit means each one carries its own choice.
function buildMenuRows(){
  return concessionMenu.map(item => ({
    itemId: item.id,
    name: item.name,
    price: item.price,
    note: item.note || '',
    section: item.section || ''
  }));
}

// Expands the seat's saved cart into one order line per unit, taking that
// unit's pick off the stored options array.
//
// This is also the migration path for carts saved by the old quantity UI:
// a stored { qty: 2, options: ['BBQ', 'Ranch'] } becomes two lines, which
// is what it always meant. Lines whose item has since left the menu come
// through as ordinary order lines -- still visible, still removable, just
// with nothing in the catalog to add another from.
function buildCartOrder(lines){
  const out = [];
  (lines || []).forEach(l => {
    const options = l.options || [];
    const qty = Math.max(1, l.qty || 0);
    for (let unit = 0; unit < qty; unit++){
      out.push({
        uid: ++cartUid,
        itemId: l.itemId || '',
        name: l.name,
        price: l.price,
        option: options[unit] || '',
        note: l.note || ''
      });
    }
  });
  return out;
}

// One wire line per order line. Coalescing identical ones back into a
// quantity would just have to be undone on the next open, and 50 lines
// (MAX_CART_LINES server-side) is a lot of concessions for one seat.
function cartLines(){
  return cartOrder.map(l => ({
    itemId: l.itemId,
    name: l.name,
    price: l.price,
    qty: 1,
    note: l.note || '',
    options: l.option ? [l.option] : []
  }));
}

// Every order line for an item that comes with a choice has to have one
// picked before the cart will save. An order reaching the host as
// "Popcorn Chicken" with no sauce named is one they can't actually place.
//
// Only items whose group actually has options count: an item whose group
// the host hasn't filled in yet can't be picked from, so it would
// otherwise block saving forever. Lines whose item has left the menu are
// exempt for the same reason -- there's no group left to pick from.
function missingChoices(){
  const byName = new Map();
  cartOrder.forEach(l => {
    if (l.option) return;
    if (!optionsForItem(l.itemId).length) return;
    const prev = byName.get(l.name) || { name: l.name, label: optionLabelForItem(l.itemId).toLowerCase(), missing: 0 };
    prev.missing++;
    byName.set(l.name, prev);
  });
  return Array.from(byName.values());
}

function orderCountFor(itemId){
  return cartOrder.filter(l => l.itemId === itemId).length;
}

function currentCartShowtime(){
  return allShowtimes.find(s => s.id === cartShowtimeId) || null;
}

// Seats either side of this one in the same row. Deliberately NOT the
// rows in front or behind: seat numbers don't line up across rows (row A
// is offset -- see padStart in seat-layout.js), so "same number, next
// row" is not the seat behind you, and guessing wrong here would be
// worse than the narrower answer.
function neighborSeatIds(seatId){
  const m = /^([A-Za-z]+)(\d+)$/.exec(seatId || '');
  if (!m) return [];
  const n = Number(m[2]);
  return [m[1] + (n - 1), m[1] + (n + 1)];
}

function hasPeanutNeighbor(showtime, seatId){
  const seats = (showtime && showtime.seats) || {};
  return neighborSeatIds(seatId).some(id => seats[id] && PEANUT_NEIGHBOR.test(seats[id].name || ''));
}

// Menu items to leave out of the catalog. Silent by design: the people
// this applies to are in on the joke, and a banner explaining the bit is
// worse than the bit.
//
// It deliberately does not touch the order list. A peanut item already
// ordered stays visible and removable there -- hiding a line someone is
// being charged for would be worse than showing it -- and only its "+"
// in the catalog goes away. Nor is any of this enforcement: the host sees
// every order in full, which is the copy that matters at the counter.
function hiddenPeanutItemIds(){
  if (!hasPeanutNeighbor(currentCartShowtime(), cartSeatId)) return new Set();
  const ordered = new Set(cartOrder.map(l => l.itemId));
  return new Set(
    concessionMenu.filter(i => PEANUT_ITEM.test(i.name || '') && !ordered.has(i.id)).map(i => i.id)
  );
}

// ---------------- CART OVERLAY ----------------
async function openCart(showtimeId, seatId){
  const obj = allShowtimes.find(s => s.id === showtimeId);
  if (!obj) return;
  const seat = (obj.seats || {})[seatId];
  if (!seat || !seat.name) return;

  cartShowtimeId = showtimeId;
  cartSeatId = seatId;
  cartLocked = !concessionsOpen(obj);
  saveState = 'idle';
  saveInFlight = false;
  savePending = false;
  if (saveTimer){ clearTimeout(saveTimer); saveTimer = null; }

  document.getElementById('cartTitle').textContent = 'Concessions';
  document.getElementById('cartSub').textContent = 'Seat ' + seatId + ' · ' + seat.name;
  document.getElementById('cartError').textContent = '';
  document.getElementById('cartStatus').textContent = '';

  const locked = document.getElementById('cartLocked');
  locked.classList.toggle('hidden', !cartLocked);
  locked.textContent =
    'Orders for this showtime closed ' + CONCESSION_CUTOFF_HOURS + ' hours before it starts. ' +
    'Message the host if you still need to change something.';

  const body = document.getElementById('cartBody');
  body.innerHTML = '<div class="cart-empty-menu">Loading menu...</div>';
  document.getElementById('cartOverlay').classList.remove('hidden');
  // Pins the showtime list behind the sheet. Without it a phone will
  // happily scroll the page underneath once the menu hits its end, which
  // is the one thing a full-screen sheet shouldn't do.
  document.body.classList.add('cart-open');

  // Refetched on every open rather than once at page load: the host adds
  // menu items from their own device, and a friend who left this page
  // sitting open all afternoon shouldn't be ordering off yesterday's menu.
  await loadConcessionMenu();

  // Bail out if the overlay got closed (or switched to another seat)
  // while that request was in flight.
  if (cartShowtimeId !== showtimeId || cartSeatId !== seatId) return;

  // Re-read rather than reusing the `seat` captured before the await --
  // a save on another seat replaces the whole showtime object in
  // allShowtimes, so the one from before the fetch can be detached.
  const current = allShowtimes.find(s => s.id === showtimeId);
  const freshSeat = current && (current.seats || {})[seatId];
  if (!freshSeat || !freshSeat.name){ closeCartOverlay(); return; }

  cartOrder = buildCartOrder(freshSeat.concessions);
  renderCart();
}

function openCartFromSuccess(){
  if (!lastClaim) return;
  closeSuccessOverlay();
  openCart(lastClaim.showtimeId, lastClaim.seatId);
}

function closeCartOverlay(){
  // Flush first: closing a second after a tap must not drop that tap.
  // runSave() reads the cart state, so it has to run before it's cleared.
  if (saveTimer){
    clearTimeout(saveTimer);
    saveTimer = null;
    runSave();
  }
  cartShowtimeId = null;
  cartSeatId = null;
  cartOrder = [];
  orderRowEls.clear();
  document.getElementById('cartOverlay').classList.add('hidden');
  document.body.classList.remove('cart-open');
}

function renderCart(){
  const body = document.getElementById('cartBody');
  body.innerHTML = '';
  menuRowEls.clear();
  sectionEls = [];

  const menuRows = buildMenuRows();
  if (menuRows.length === 0){
    const empty = document.createElement('div');
    empty.className = 'cart-empty-menu';
    empty.textContent = "The host hasn't put up a concessions menu yet. Check back later.";
    body.appendChild(empty);
  } else {
    const hidden = hiddenPeanutItemIds();
    const visible = menuRows.filter(row => !hidden.has(row.itemId));

    // Unsectioned items inline; a named section folded away behind a
    // header, rendered at the position of its FIRST item rather than
    // always at the end -- that's what lets drinks sit collapsed at the
    // top and snacks and candy sit collapsed underneath the food, in
    // whatever order the menu itself is in.
    const emitted = new Set();
    visible.forEach(row => {
      if (!row.section){
        body.appendChild(buildMenuRowEl(row));
        return;
      }
      if (emitted.has(row.section)) return;
      emitted.add(row.section);
      body.appendChild(buildCartSectionEl(row.section, visible.filter(r => r.section === row.section)));
    });
  }

  renderOrderList();
  renderCartFoot();
}

// A collapsed section. Native <details>, so the open/closed state is the
// browser's to keep and there's nothing to wire up for the keyboard.
function buildCartSectionEl(name, rows){
  const wrap = document.createElement('details');
  wrap.className = 'cart-section';

  const inOrder = rows.reduce((n, r) => n + orderCountFor(r.itemId), 0);
  // Open when the menu says this is one of the sections worth having on
  // screen from the start, or when something in it is already ordered --
  // a friend reopening their cart should see where their Skittles came
  // from without hunting for it.
  wrap.open = inOrder > 0 || openSections.indexOf(name) !== -1;

  const summary = document.createElement('summary');
  const label = document.createElement('span');
  label.textContent = name;
  summary.appendChild(label);

  const count = document.createElement('span');
  count.className = 'cart-section-count' + (inOrder ? ' has-order' : '');
  count.textContent = inOrder ? inOrder + ' in order' : rows.length + ' item' + (rows.length === 1 ? '' : 's');
  count.dataset.total = String(rows.length);
  summary.appendChild(count);
  wrap.appendChild(summary);

  const inner = document.createElement('div');
  inner.className = 'cart-section-body';
  rows.forEach(row => inner.appendChild(buildMenuRowEl(row)));
  wrap.appendChild(inner);

  sectionEls.push({ el: wrap, count, rows });
  return wrap;
}

// One catalog row: what it is, what it costs, and a "+".
function buildMenuRowEl(row){
  const el = document.createElement('div');
  el.className = 'cart-item';

  const rowEl = document.createElement('div');
  rowEl.className = 'ci-row';

  const main = document.createElement('div');
  main.className = 'ci-main';

  const nameEl = document.createElement('div');
  nameEl.className = 'ci-name';
  nameEl.textContent = row.name;
  main.appendChild(nameEl);

  const priceEl = document.createElement('div');
  priceEl.className = 'ci-price';
  priceEl.textContent = [
    row.price > 0 ? formatPrice(row.price) : 'No price set',
    // The host's own label for this item ("50c off"), not a discount the
    // app applies -- the price to its left is what gets charged.
    row.note || ''
  ].filter(Boolean).join(' · ');
  main.appendChild(priceEl);

  rowEl.appendChild(main);

  // How many of this are already down in the order below. Without it,
  // tapping "+" on a row 30 items up the list gives no sign it landed.
  const count = document.createElement('span');
  count.className = 'ci-count';
  rowEl.appendChild(count);

  const add = document.createElement('button');
  add.type = 'button';
  add.className = 'ci-add';
  add.textContent = '+';
  add.setAttribute('aria-label', 'Add ' + row.name);
  rowEl.appendChild(add);
  el.appendChild(rowEl);

  // The choice is made HERE, before the line exists, because the order
  // list below is deliberately not editable -- changing your mind is
  // remove and re-add. That also means "+" can't be pressed until there's
  // something to add: half an order of popcorn chicken with no sauce
  // named isn't a thing the host can go and buy.
  const choices = optionsForItem(row.itemId);
  let select = null;
  if (choices.length){
    select = document.createElement('select');
    select.className = 'ci-choice-select needs-choice';
    const label = optionLabelForItem(row.itemId);
    select.setAttribute('aria-label', label + ' for ' + row.name);

    const blank = document.createElement('option');
    blank.value = '';
    blank.textContent = 'Choose ' + label.toLowerCase() + '...';
    select.appendChild(blank);
    choices.forEach(name => {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      select.appendChild(opt);
    });

    select.addEventListener('change', () => {
      select.classList.toggle('needs-choice', !select.value);
      add.disabled = cartLocked || !select.value;
    });
    el.appendChild(select);
  }

  add.disabled = cartLocked || !!(select && !select.value);
  add.addEventListener('click', () => {
