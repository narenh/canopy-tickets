<script src="/copy.js"></script>
<script src="/seat-layout.js"></script>
<!-- For changing your profile photo (the profile sheet). -->
<script src="/vendor/cropperjs-1.6.3/cropper.min.js"></script>
<script src="/photo-crop.js"></script>
<script>

// Fills the [data-copy] elements in the markup above from public/copy.js.
// Everything else on this page is built in JS and asks for its lines with
// t() at the point of use.
applyCopy();

// Inline (not an emoji -- at seat-icon size, the wheelchair emoji renders
// as a tiny broken-looking glyph on several platforms, easily mistaken
// for a failed image load). Path data from svgrepo.com/svg/333986/handicap
// (public domain style icon set). Fixed blue rather than currentColor --
// a seat's background swings from gold to red to green depending on
// state, and this blue reads clearly against all of them by hue alone.
const WHEELCHAIR_ICON_SVG =
  '<svg viewBox="0 0 24 24" width="13" height="13" fill="#3399ff"><circle cx="9" cy="4" r="2"/>' +
  '<path d="M16.98 14.804A1 1 0 0 0 16 14h-4.133l-.429-3H16V9h-4.847l-.163-1.142A1 1 0 0 0 10 7H9a1.003 1.003 0 0 0-.99 1.142l.877 6.142A2.009 2.009 0 0 0 10.867 16h4.313l.839 4.196c.094.467.504.804.981.804h3v-2h-2.181l-.839-4.196z"/>' +
  '<path d="M12.51 17.5c-.739 1.476-2.25 2.5-4.01 2.5A4.505 4.505 0 0 1 4 15.5a4.503 4.503 0 0 1 2.817-4.167l-.289-2.025C3.905 10.145 2 12.604 2 15.5 2 19.084 4.916 22 8.5 22a6.497 6.497 0 0 0 5.545-3.126l-.274-1.374H12.51z"/></svg>';

let me = null;             // the signed-in person, from /api/public/me
let allMovies = [];        // every movie with something scheduled, locked or not
let mineItems = [];        // your seats: [{ showtime, seatIds, unlocked }]
let currentTab = null;     // 'mine' | 'all'
let allShowtimes = [];     // showtimes of the movies unlocked here (/api/public/showtimes)
let currentFilmTitle = null; // the film whose showtimes are open, if any
let currentShowtimeId = null;
let claimingSeatId = null;
let seatEls = {};          // seatId -> DOM element, populated by buildSeatmap
// Applied to the concessions subtotal only -- California doesn't tax
// admissions, and cinema food is taxable even where the same item bought
// in a shop wouldn't be. Served by the server so this page and the
// editor can't drift apart on it; 0 until config loads, so a cart drawn
// before then quotes the untaxed total rather than a wrong one.
let concessionTaxRate = 0;
let venmoHandle = null;    // loaded once from /api/public/config
let cashappHandle = null;  // loaded once from /api/public/config

// Bouncing to '/' on a 401 is normally a one-shot fix (session expired,
// go log in again). But if the page we land on still thinks we're
// authed while the API disagrees (e.g. right after a redeploy handed out
// a new session secret), that bounce repeats forever. Refuse to redirect
// more than once in a few seconds -- show a manual link instead of
// hammering the server or the browser's redirect-loop detector.
function handleAuthFailure(res){
  if (res.status !== 401) return false;
  const key = 'canopy_auth_redirect_at';
  const last = Number(sessionStorage.getItem(key) || 0);
  if (Date.now() - last < 4000){
    document.body.innerHTML =
      '<div style="padding:60px 20px;text-align:center;color:#9a9a9a;font-family:-apple-system,sans-serif;">' +
      t('sessionTrouble', { home: '/' }) + '</div>';
    return true;
  }
  sessionStorage.setItem(key, String(Date.now()));
  window.location.href = '/';
  return true;
}

// Signs this browser out of the profile. Its unlocked movies stay --
// they belong to the browser, not the person.
async function signOut(){
  try{ await fetch('/api/signout', { method: 'POST' }); }catch(e){}
  window.location.href = '/';
}

async function loadConfig(){
  try{
    const res = await fetch('/api/public/config');
    if (await handleAuthFailure(res)) return;
    if (!res.ok) return;
    const data = await res.json();
    venmoHandle = data.venmoHandle || null;
    cashappHandle = data.cashappHandle || null;
    concessionTaxRate = typeof data.concessionTaxRate === 'number' ? data.concessionTaxRate : 0;
  }catch(e){
    // Non-fatal -- the claim flow just skips both pay links.
  }
}

// Builds a Venmo pay link pre-filled with amount + a note identifying
// what it's for, so paying is a single tap instead of hunting the host
// down in Venmo's search.
//
// Venmo's app shows a "+" in the note literally rather than as a space,
// so spaces have to arrive as %20 -- hence encodeURIComponent rather than
// URLSearchParams, whose toString() writes "+". On a phone that isn't
// enough on its own: https://venmo.com/<handle> redirects through
// account.venmo.com, which rebuilds the query into a venmo://paycharge
// link and re-encodes the spaces as "+" on the way (seen in its
// Location header), so the note arrived full of plus signs anyway. On a
// phone this links to that venmo:// URL directly, skipping the redirect.
// Anywhere else it stays the web link, since a desktop browser has
// nothing to open venmo:// with. A phone without the app falls back to
// the web link too -- see venmoWebFallback() below.
function buildVenmoLink(amount, note){
  if (!venmoHandle) return null;
  const parts = ['txn=pay', 'note=' + encodeURIComponent(note)];
  if (typeof amount === 'number') parts.push('amount=' + encodeURIComponent(amount.toFixed(2)));
  if (isPhone()){
    return 'venmo://paycharge?recipients=' + encodeURIComponent(venmoHandle) + '&' + parts.join('&');
  }
  return 'https://venmo.com/' + encodeURIComponent(venmoHandle) + '?' + parts.join('&');
}

// The web version of a venmo://paycharge link, for when the app isn't
// installed. Same query, just moved onto venmo.com/<handle>. The website
// still turns the note's spaces into "+", but a pay page with odd
// spaces beats a phone that can't open the link at all.
function venmoWebFallback(appHref){
  const m = /^venmo:\/\/paycharge\?(.*)$/i.exec(appHref || '');
  if (!m) return null;
  let handle = '';
  const rest = m[1].split('&').filter(p => {
    if (p.startsWith('recipients=')){ handle = p.slice('recipients='.length); return false; }
    return true;
  });
  if (!handle) return null;
  return 'https://venmo.com/' + handle + '?' + rest.join('&');
}

// A venmo:// link does nothing useful without the app -- Chrome just sits
// there, Safari says the address is invalid. So after the tap, if the
// page is still in front a couple of seconds later (the app would have
// taken over by then), go to the website instead. Leaving the page
// (hidden, blurred, unloaded) cancels it, which is also what should stop
// it firing while iOS shows its "Open in Venmo?" prompt -- though that's
// the part that can only really be checked on a phone.
document.addEventListener('click', (e) => {
  const a = e.target.closest && e.target.closest('a[href^="venmo:"]');
  if (!a) return;
  const web = venmoWebFallback(a.getAttribute('href'));
  if (!web) return;
  let left = false;
  const mark = () => { left = true; };
  const onVis = () => { if (document.hidden) left = true; };
  window.addEventListener('pagehide', mark);
  window.addEventListener('blur', mark);
  document.addEventListener('visibilitychange', onVis);
  setTimeout(() => {
    window.removeEventListener('pagehide', mark);
    window.removeEventListener('blur', mark);
    document.removeEventListener('visibilitychange', onVis);
    if (!left && !document.hidden) window.location.href = web;
  }, 2000);
});

// iPadOS reports itself as a Mac, so a touch-capable "Mac" counts too.
function isPhone(){
  const ua = navigator.userAgent || '';
  return /iPhone|iPad|iPod|Android/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
}

// An app link (venmo://) opened in a new tab just leaves a blank tab
// behind once the app takes over, so only web links get one.
function opensInNewTab(href){
  return /^https?:/i.test(href);
}

// Cash App's pay links only support pre-filling an amount, not a note --
// unlike Venmo, there's no query param for that.
function buildCashAppLink(amount){
  if (!cashappHandle) return null;
  let url = 'https://cash.app/$' + encodeURIComponent(cashappHandle);
  if (typeof amount === 'number') url += '/' + amount.toFixed(2);
  return url;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function formatPrice(price){
  return (typeof price === 'number') ? ('$' + price.toFixed(2)) : '';
}

function formatDateDisplay(iso){
  try{
    const [y,m,d] = iso.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    return dt.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
  }catch(e){ return iso; }
}
// Short numeric form for the Venmo note, e.g. "2026-02-12" -> "2/12/26".
function formatDateShort(iso){
  try{
    const [y,m,d] = iso.split('-').map(Number);
    return m + '/' + d + '/' + String(y).slice(-2);
  }catch(e){ return iso; }
}
function formatTimeDisplay(t){
  try{
    const [h,m] = t.split(':').map(Number);
    const dt = new Date();
    dt.setHours(h, m, 0, 0);
    return dt.toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' });
  }catch(e){ return t; }
}

// ---------------- VIEW SWITCHING ----------------
//
// Three levels: the movie grid (#listView), one film's showtimes
// (#filmView), and a showtime's seat map (#pickerView). Exactly one is
// visible at a time.
function showView(id){
  clearSeatTip();
  ['listView', 'filmView', 'pickerView'].forEach(v =>
    document.getElementById(v).classList.toggle('hidden', v !== id));
}
function showList(){ showView('listView'); }
// Going a level deeper starts at the top: the tap that got here may have
// been far down a long grid or list.
function showPicker(){ showView('pickerView'); window.scrollTo(0, 0); }

// ---------------- BACK GESTURE ----------------
//
// Each level deeper pushes a browser history entry, so the phone's back
// swipe (and the browser's back button) goes up a level instead of
// leaving the site. The on-page arrows go through history too, so there's
// one path back, not two that can disagree. The entry also survives a
// reload, which puts you back on the film or seat map you were looking
// at -- see the init at the bottom.
function navState(){
  return (history.state && history.state.canopyView) ? history.state : { canopyView: 'grid' };
}

function goBack(){
  if (navState().canopyView !== 'grid') history.back();
  else applyNavState(navState());
}

window.addEventListener('popstate', () => {
  const state = navState();
  // Back out of a sheet onto the view it was opened over: just close the
  // sheet. Redrawing the view would also throw away its scroll position.
  if (isShowingState(state)){
    closeAllOverlays();
    return;
  }
  applyNavState(state);
  loadList();
});

function isShowingState(state){
  const visible = ['listView', 'filmView', 'pickerView'].find(id =>
    !document.getElementById(id).classList.contains('hidden'));
  if (state.canopyView === 'grid') return visible === 'listView';
  if (state.canopyView === 'film') return visible === 'filmView' && currentFilmTitle === state.film;
  return visible === 'pickerView' && currentShowtimeId === state.showtimeId;
}

// The claim, post-claim and concessions sheets each get a history entry
// too, so a back swipe closes the sheet rather than the page behind it.
// One entry covers a chain of sheets (claim -> success -> concessions
// open one straight after closing the last), which is why closing checks
// a tick later whether another sheet took over before stepping back.
function anyOverlayOpen(){
  return ['claimOverlay', 'successOverlay', 'cartOverlay', 'profileOverlay', 'existingOverlay'].some(id =>
    !document.getElementById(id).classList.contains('hidden'));
}
function overlayOpened(){
  const state = navState();
  if (!state.overlay) history.pushState({ ...state, overlay: true }, '');
}
function overlayClosed(){
  setTimeout(() => {
    if (!anyOverlayOpen() && navState().overlay) history.back();
  }, 0);
}

// Shows whichever view a history entry names. A film or showtime that
// has since gone (its last showing passed, the host deleted it) falls
// back a level rather than opening onto nothing.
function applyNavState(state){
  // A sheet left open goes with the view it was opened over.
  closeAllOverlays();
  if (state.canopyView === 'picker' && allShowtimes.some(s => s.id === state.showtimeId)){
    currentFilmTitle = state.film || null;
    showSeatPicker(state.showtimeId);
    return;
  }
  currentShowtimeId = null;
  if ((state.canopyView === 'film' || state.canopyView === 'picker') && state.film &&
      showtimesForFilm(state.film).length){
    showFilm(state.film);
    return;
  }
  currentFilmTitle = null;
  showList();
}

function closeAllOverlays(){
  if (!document.getElementById('claimOverlay').classList.contains('hidden')) closeClaimOverlay();
  if (!document.getElementById('successOverlay').classList.contains('hidden')) closeSuccessOverlay();
  if (!document.getElementById('cartOverlay').classList.contains('hidden')) closeCartOverlay();
  if (!document.getElementById('profileOverlay').classList.contains('hidden')) closeProfile();
  if (!document.getElementById('existingOverlay').classList.contains('hidden')) closeExisting();
}

// Today's date as the calendar on the wall has it, NOT as UTC has it.
//
// This used to be toISOString().slice(0,10), which is UTC -- so from 5pm
// Pacific (midnight UTC) onwards it returned TOMORROW, and every showtime
// dated today started comparing as past. Tonight's movie would drop off
// the friend list and into the collapsed Past section exactly when people
// were opening the page to use it. A showtime's `date` comes from an
// <input type="date">, which is local, so the thing it's compared against
// has to be local too.
function todayISO(){
  const d = new Date();
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return d.getFullYear() + '-' + month + '-' + day;
}

// A showtime disappears from the friend-facing list starting the day
// after it occurs -- it's still shown on its own date, just not the day
// after. Plain YYYY-MM-DD string comparison against today's own
// YYYY-MM-DD (both local) sidesteps any UTC/local timezone conversion
// bugs a real Date object could introduce.
function isPastShowtime(obj){
  return typeof obj.date === 'string' && obj.date < todayISO();
}

// ---------------- LIST VIEWS ----------------
// Movies (with which are unlocked here), the unlocked movies' showtimes,
// and your own seats, all at once.
async function loadList(){
  const grid = document.getElementById('filmGrid');
  if (!allMovies.length) grid.innerHTML = '<div class="loading-state">Loading...</div>';
  try{
    const [moviesRes, showtimesRes, mineRes] = await Promise.all([
      fetch('/api/public/movies'), fetch('/api/public/showtimes'), fetch('/api/public/mine')
    ]);
    for (const res of [moviesRes, showtimesRes, mineRes]){
      if (await handleAuthFailure(res)) return;
      if (!res.ok) throw new Error('failed to load');
    }
    allMovies = (await moviesRes.json()).movies || [];
    allShowtimes = ((await showtimesRes.json()).showtimes || []).filter(obj => !isPastShowtime(obj));
    mineItems = ((await mineRes.json()).items || []).filter(item => !isPastShowtime(item.showtime));
    if (!currentTab) setTab(savedTab() || (mineItems.length ? 'mine' : 'all'));
    renderCards();
    // The film that was open has nothing upcoming left (its last showing
    // was yesterday, or the host deleted it) -- nothing to show there.
    if (currentFilmTitle && !showtimesForFilm(currentFilmTitle).length &&
        !document.getElementById('filmView').classList.contains('hidden')){
      currentFilmTitle = null;
      showList();
    }
  }catch(e){
    grid.innerHTML = '<div class="empty-state">' + escapeHtml(t('friend.list.loadFailed')) + '</div>';
  }
}

async function loadMe(){
  try{
    const res = await fetch('/api/public/me');
    if (await handleAuthFailure(res)) return;
    if (!res.ok) return;
    me = (await res.json()).person;
    renderMe();
  }catch(e){}
}

function renderMe(){
  if (!me) return;
  document.getElementById('meName').textContent = me.firstName;
  const avatar = document.getElementById('meAvatar');
  if (me.photoUrl) avatar.src = me.photoUrl;
  document.getElementById('claimForMe').textContent = t('friend.claim.forMe', { name: me.shortName });
}

// ---------------- TABS ----------------
// Remembered per browser; first visit opens on your showtimes if you
// have any, otherwise on all movies.
function savedTab(){
  try{ return localStorage.getItem('canopy_tab'); }catch(e){ return null; }
}
function setTab(tab){
  currentTab = tab === 'mine' ? 'mine' : 'all';
  try{ localStorage.setItem('canopy_tab', currentTab); }catch(e){}
  document.getElementById('mineTab').classList.toggle('hidden', currentTab !== 'mine');
  document.getElementById('allTab').classList.toggle('hidden', currentTab !== 'all');
  document.querySelectorAll('.tabs button').forEach(b =>
    b.classList.toggle('active', b.dataset.tab === currentTab));
}

// A film is its title -- the same key posters are filed under (see
// posterUrlForTitle in server.js), so every showtime of a film shares a
// tile and a poster.
function filmKey(obj){
  return (obj.title || '').trim() || 'Untitled';
}
function showtimesForFilm(title){
  return allShowtimes.filter(obj => filmKey(obj) === title);
}

// Redraws the grid, and the open film's showtimes if there is one, from
// whatever's already in allShowtimes -- split out of loadList so saving a
// concession cart can refresh the seat lines it just changed without a
// second trip to the server for a list it already got back from the save.
function renderCards(){
  renderFilmGrid();
  renderMine();
  if (currentFilmTitle) renderFilmShowtimes();
}

// The next date each movie has, today or later -- null once it's all past.
function nextDate(movie){
  const today = todayISO();
  return (movie.dates || []).find(d => d >= today) || null;
}

function renderFilmGrid(){
  const grid = document.getElementById('filmGrid');
  const upcoming = allMovies.filter(m => nextDate(m))
    .sort((a, b) => nextDate(a).localeCompare(nextDate(b)));
  if (upcoming.length === 0){
    grid.innerHTML = '<div class="empty-state">' + escapeHtml(t('friend.list.empty')) + '</div>';
    return;
  }
  grid.innerHTML = '';
  upcoming.forEach(m => grid.appendChild(buildFilmTile(m)));
}

const LOCK_ICON_SVG =
  '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round">' +
  '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';

// A movie on the All tab. Unlocked: opens its showtimes. Locked: a
// padlock, and tapping it asks for the password right there on the
// poster (startUnlock).
function buildFilmTile(movie){
  const title = movie.title;
  const showtimes = showtimesForFilm(title);
  const tile = document.createElement('div');
  tile.className = 'film-tile';
  tile.dataset.movieId = movie.id;
  tile.setAttribute('role', 'button');
  tile.setAttribute('tabindex', '0');
  const activate = () => {
    if (movie.unlocked) openFilm(title);
    else if (!tile.classList.contains('is-unlocking')) startUnlock(movie.id);
  };
  tile.addEventListener('click', (e) => { if (!e.target.closest('.unlock-form')) activate(); });
  tile.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && !e.target.closest('.unlock-form')){ e.preventDefault(); activate(); }
  });

  const poster = document.createElement('div');
  poster.className = 'film-poster';
  const posterUrl = movie.posterUrl;
  if (posterUrl){
    poster.classList.add('has-img');
    const img = document.createElement('img');
    img.src = posterUrl;
    img.alt = '';
    poster.appendChild(img);
  } else {
    const fallback = document.createElement('div');
    fallback.className = 'film-poster-fallback';
    fallback.textContent = title;
    poster.appendChild(fallback);
  }
  if (!movie.unlocked){
    const badge = document.createElement('div');
    badge.className = 'lock-badge';
    badge.setAttribute('aria-label', 'Locked');
    badge.innerHTML = LOCK_ICON_SVG;
    poster.appendChild(badge);
  }
  tile.appendChild(poster);

  const name = document.createElement('div');
  name.className = 'film-title';
  name.textContent = title;
  tile.appendChild(name);

  const count = movie.unlocked ? showtimes.length : (movie.dates || []).filter(d => d >= todayISO()).length;
  const sub = document.createElement('div');
  sub.className = 'film-sub';
  sub.textContent = [
    t(count === 1 ? 'friend.grid.showtimesOne' : 'friend.grid.showtimesMany', { count }),
    t('friend.grid.next', { when: formatDateDisplay(nextDate(movie)) })
  ].join(' \u00b7 ');
  tile.appendChild(sub);

  return tile;
}

// ---------------- UNLOCKING A MOVIE ----------------
// The password goes in over the movie's own poster (blurred). Once right,
// the movie stays unlocked on this browser -- the server remembers it
// against this browser, not against your profile.
function startUnlock(movieId){
  setTab('all');
  document.querySelectorAll('.film-tile.is-unlocking').forEach(cancelUnlock);
  const tile = document.querySelector('.film-tile[data-movie-id="' + movieId + '"]');
  if (!tile) return;
  tile.classList.add('is-unlocking');
  const form = document.createElement('form');
  form.className = 'unlock-form';
  form.innerHTML =
    '<input type="password" autocomplete="off" placeholder="' + escapeHtml(t('friend.unlock.placeholder')) + '">' +
    '<button type="submit">' + escapeHtml(t('friend.unlock.button')) + '</button>' +
    '<button type="button" class="unlock-cancel">' + escapeHtml(t('friend.unlock.cancel')) + '</button>' +
    '<div class="unlock-error"></div>';
  form.querySelector('.unlock-cancel').addEventListener('click', () => cancelUnlock(tile));
  form.addEventListener('submit', (e) => { e.preventDefault(); submitUnlock(movieId, tile, form); });
  tile.querySelector('.film-poster').appendChild(form);
  tile.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  setTimeout(() => form.querySelector('input').focus(), 0);
}

function cancelUnlock(tile){
  tile.classList.remove('is-unlocking');
  const form = tile.querySelector('.unlock-form');
  if (form) form.remove();
}

async function submitUnlock(movieId, tile, form){
  const input = form.querySelector('input');
  const errorEl = form.querySelector('.unlock-error');
  const btn = form.querySelector('button[type=submit]');
  errorEl.textContent = '';
  btn.disabled = true;
  try{
    const res = await fetch('/api/public/movies/' + encodeURIComponent(movieId) + '/unlock', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: input.value })
    });
    if (await handleAuthFailure(res)) return;
    if (!res.ok){
      errorEl.textContent = t(res.status === 429 ? 'friend.unlock.tooMany' : 'friend.unlock.wrong');
      input.select();
      tile.classList.remove('shake');
      void tile.offsetWidth;
      tile.classList.add('shake');
      return;
    }
    const movie = allMovies.find(m => m.id === movieId);
    await loadList();
    if (movie) openFilm(movie.title);
  }catch(e){
    errorEl.textContent = t('friend.unlock.failed');
  }finally{
    btn.disabled = false;
  }
}

// ---------------- MY SHOWTIMES ----------------
function renderMine(){
  const container = document.getElementById('mineCards');
  if (!mineItems.length){
    container.innerHTML = '<div class="mine-empty">' + escapeHtml(t('friend.mine.empty')) +
      '<br><button type="button" onclick="setTab(\'all\')">' + escapeHtml(t('friend.mine.browse')) + '</button></div>';
    return;
  }
  container.innerHTML = '';
  mineItems.forEach(item => container.appendChild(buildMineCard(item)));
}

// One showtime you have seats in. Unlocked here: the full card, and your
// seats open their orders. Locked here: your seats read-only, and the way
// to change anything is to unlock the movie.
function buildMineCard(item){
  const obj = item.unlocked ? (allShowtimes.find(s => s.id === item.showtime.id) || item.showtime) : item.showtime;
  const card = document.createElement('div');
  card.className = 'card';

  const body = document.createElement('div');
  body.className = 'card-body';
  body.appendChild(buildPosterEl(obj));
  const info = document.createElement('div');
  info.className = 'card-info';
  const h3 = document.createElement('h3');
  h3.textContent = obj.title || 'Untitled';
  info.appendChild(h3);
  const when = document.createElement('div');
  when.className = 'when';
  when.textContent = showtimeWhen(obj);
  info.appendChild(when);
  if (obj.info){
    const note = document.createElement('div');
    note.className = 'showtime-info';
    note.textContent = obj.info;
    info.appendChild(note);
  }
  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = showtimeWhere(obj);
  info.appendChild(meta);
  body.appendChild(info);

  if (item.unlocked){
    body.setAttribute('role', 'button');
    body.setAttribute('tabindex', '0');
    const open = () => { currentFilmTitle = filmKey(obj); openSeatPicker(obj.id); };
    body.addEventListener('click', open);
    body.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); open(); } });
    const chevron = document.createElement('div');
    chevron.className = 'card-chevron';
    chevron.setAttribute('aria-hidden', 'true');
    body.appendChild(chevron);
  }
  card.appendChild(body);

  const seats = obj.seats || {};
  const myIds = item.seatIds.slice().sort(compareSeatIds);

  // Who's going: everyone with a seat, read-only, yours marked. (A movie
  // that isn't unlocked here only ever comes with your own seats -- see
  // /api/public/mine -- so this is just you there.)
  const goingIds = Object.keys(seats).filter(id => seats[id].name).sort(compareSeatIds);
  const going = document.createElement('div');
  going.className = 'mine-section';
  if (item.unlocked){
    const head = document.createElement('div');
    head.className = 'mine-section-head';
    head.textContent = t('friend.mine.going', { count: goingIds.length });
    going.appendChild(head);
  }
  goingIds.forEach(seatId => {
    const row = document.createElement('div');
    row.className = 'mine-seat' + (seats[seatId].mine ? ' is-mine' : '');
    // Whether you (or your guest) still owe lives here, so the order
    // rows below don't have to repeat who's who.
    row.innerHTML = seatWhoHtml(seatId, seats[seatId]) +
      (seats[seatId].mine && !seats[seatId].guest ? '<span class="you-tag">' + escapeHtml(t('friend.list.you')) + '</span>' : '') +
      (seats[seatId].mine && seatOwesAnything(obj, seats[seatId]) ? '<span class="unpaid-tag">unpaid</span>' : '');
    going.appendChild(row);
  });
  card.appendChild(going);

  // Your concessions: just your seat and your guests', each the way into
  // its order. Other people's orders are theirs to look after.
  if (item.unlocked){
    const orders = document.createElement('div');
    orders.className = 'mine-section mine-orders';
    const ordersOpen = concessionsOpen(obj);
    myIds.forEach(seatId => orders.appendChild(buildOrderBlock(obj, seatId, ordersOpen)));
    card.appendChild(orders);
  }

  if (!item.unlocked){
    const lock = document.createElement('button');
    lock.type = 'button';
    lock.className = 'locked-note';
    lock.innerHTML = LOCK_ICON_SVG.replace('#fff', '#f0dda9') + '<span>' + escapeHtml(t('friend.mine.locked')) + '</span>';
    lock.addEventListener('click', () => startUnlock(obj.movieId));
    card.appendChild(lock);
  }
  return card;
}

// One of your orders on My showtimes. Nothing in it yet: a single
// "+ Add concessions". Something in it: "Concessions (2)", the items, and
// "+ Add / Edit". A guest's reads "Alex's concessions (1)". The seat and
// person are already in Who's going above, so nothing here repeats them.
function buildOrderBlock(obj, seatId, ordersOpen){
  const seat = (obj.seats || {})[seatId] || {};
  const lines = seat.concessions || [];
  const vars = { name: (seat.name || '').split(/\s+/)[0] };
  const block = document.createElement('div');
  block.className = 'order-block';
  const open = () => openCart(obj.id, seatId);

  if (!lines.length){
    if (!ordersOpen){
      const none = document.createElement('div');
      none.className = 'order-none';
      none.textContent = t(seat.guest ? 'friend.mine.noneFor' : 'friend.mine.none', vars);
      block.appendChild(none);
      return block;
    }
    const add = document.createElement('button');
    add.type = 'button';
    add.className = 'order-add';
    add.textContent = t(seat.guest ? 'friend.mine.addFor' : 'friend.mine.add', vars);
    add.addEventListener('click', open);
    block.appendChild(add);
    return block;
  }

  // Same look as "Going (3)" above it.
  const head = document.createElement('div');
  head.className = 'mine-section-head';
  head.textContent = t(seat.guest ? 'friend.mine.headFor' : 'friend.mine.head', { ...vars, count: lines.length });
  block.appendChild(head);
  const items = document.createElement('div');
  items.className = 'order-items';
  lines.forEach(l => {
    const item = document.createElement('div');
    item.textContent = concessionLineLabel(l);
    if (l.note){
      const note = document.createElement('span');
      note.className = 'order-note';
      note.textContent = ' \u2014 ' + l.note;
      item.appendChild(note);
    }
    items.appendChild(item);
  });
  block.appendChild(items);
  const edit = document.createElement('button');
  edit.type = 'button';
  edit.className = 'order-edit';
  edit.textContent = t(ordersOpen ? 'friend.mine.edit' : 'friend.mine.view');
  edit.addEventListener('click', open);
  block.appendChild(edit);
  return block;
}

function openFilm(title){
  history.pushState({ canopyView: 'film', film: title }, '');
  showFilm(title);
  window.scrollTo(0, 0);
}

function showFilm(title){
  currentFilmTitle = title;
  document.getElementById('filmTitle').textContent = title;
  renderFilmShowtimes();
  showView('filmView');
}

function renderFilmShowtimes(){
  const container = document.getElementById('cardsContainer');
  const showtimes = showtimesForFilm(currentFilmTitle);
  container.innerHTML = '';
  showtimes.forEach(obj => container.appendChild(buildCard(obj)));
}

function showtimeSubtitle(obj){
  return [obj.theater, formatDateDisplay(obj.date), formatTimeDisplay(obj.time), obj.format, formatPrice(obj.price)]
    .filter(Boolean).join(' | ');
}
// A list card splits that same information across two rows -- date/time
// on its own prominent row, everything else on the .meta line under it.
// showtimeSubtitle() above is left alone for the picker header, which is
// a single line of its own and reads fine as one run.
function showtimeWhen(obj){
  return [formatDateDisplay(obj.date), formatTimeDisplay(obj.time)].filter(Boolean).join(' \u00b7 ');
}
function showtimeWhere(obj){
  return [obj.theater, obj.format, formatPrice(obj.price)].filter(Boolean).join(' | ');
}

// Poster art, when this title has any (see server's posterUrlForTitle),
// goes to the left of the title/info/open-seat-count column -- not the
// claimed-seat names or the button below, which stay full-width. Same
// fixed size whether or not there's actually a poster, so cards line up
// evenly; the placeholder fills that box instead of leaving a gap when
// a title has no art yet.
function buildPosterEl(obj){
  const poster = document.createElement('div');
  poster.className = 'poster-thumb';
  if (obj.posterUrl){
    const img = document.createElement('img');
    img.src = obj.posterUrl;
    img.alt = '';
    poster.appendChild(img);
  } else {
    poster.classList.add('poster-placeholder');
  }
  return poster;
}

function buildCard(obj){
  const card = document.createElement('div');
  card.className = 'card';

  // The whole header opens the seat map -- for a sold-out showtime too,
  // where it's the only way in and reads as a chart of who's sitting
  // where rather than something to pick from.
  //
  // role/tabindex rather than a <button>: the header carries an <h3>,
  // which isn't valid inside a button, and losing the heading to satisfy
  // the element would be the wrong trade.
  const body = document.createElement('div');
  body.className = 'card-body';
  body.setAttribute('role', 'button');
  body.setAttribute('tabindex', '0');
  body.setAttribute('aria-label', 'Seat map for ' + (obj.title || 'this showtime'));
  body.addEventListener('click', () => openSeatPicker(obj.id));
  body.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      openSeatPicker(obj.id);
    }
  });
  body.appendChild(buildPosterEl(obj));

  const info = document.createElement('div');
  info.className = 'card-info';

  const h3 = document.createElement('h3');
  h3.textContent = obj.title || 'Untitled';
  info.appendChild(h3);

  // Skipped entirely rather than left as an empty row when a showtime
  // somehow has neither a date nor a time -- an empty div would still
  // contribute its margin and open a gap under the title.
  const whenText = showtimeWhen(obj);
  if (whenText){
    const when = document.createElement('div');
    when.className = 'when';
    when.textContent = whenText;
    info.appendChild(when);
  }

  if (obj.info){
    const note = document.createElement('div');
    note.className = 'showtime-info';
    note.textContent = obj.info;
    info.appendChild(note);
  }

  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = showtimeWhere(obj);
  info.appendChild(meta);

  const seats = obj.seats || {};
  const ids = Object.keys(seats).sort(compareSeatIds);
  const claimed = ids.filter(id => seats[id].name);
  const availCount = ids.length - claimed.length;

  if (ids.length === 0){
    const empty = document.createElement('div');
    empty.className = 'seats-empty';
    empty.textContent = t('friend.list.noSeats');
    info.appendChild(empty);
  } else {
    const availLine = document.createElement('div');
    availLine.className = 'seats-avail-line ' + (availCount > 0 ? 'seats-avail-green' : 'seats-avail-red');
    availLine.textContent = t(availCount === 1 ? 'friend.list.seatsAvailableOne' : 'friend.list.seatsAvailableMany', { count: availCount });
    info.appendChild(availLine);
  }

  body.appendChild(info);

  const chevron = document.createElement('div');
  chevron.className = 'card-chevron';
  chevron.setAttribute('aria-hidden', 'true');
  body.appendChild(chevron);

  card.appendChild(body);

  if (ids.length > 0){
    if (claimed.length > 0){
      const claimedList = document.createElement('div');
      claimedList.className = 'claimed-list';
      const ordersOpen = concessionsOpen(obj);
      claimed.forEach(id => claimedList.appendChild(buildClaimedSeatLine(obj, id, ordersOpen)));
      card.appendChild(claimedList);
    }

    const pickBtn = document.createElement('button');
    pickBtn.className = 'claim-btn';
    if (availCount > 0){
      pickBtn.textContent = 'Reserve';
      pickBtn.onclick = () => openSeatPicker(obj.id);
    } else {
      pickBtn.textContent = 'Sold Out';
      pickBtn.disabled = true;
    }
    card.appendChild(pickBtn);
  }

  return card;
}

// Is there anything left on this seat for its owner to send over -- the
// ticket, the food, or what's been added to the food since they last
// paid? The host's own seat never owes: they're the one being paid.
function seatOwesAnything(obj, seat){
  if (!seat || seat.host) return false;
  const price = typeof obj.price === 'number' ? obj.price : 0;
  if (!seat.paid && price > 0) return true;
  // Counted whether or not it's settleable yet: this tag answers "has
  // this person paid me", and an unpaid cart is an unpaid cart even
  // while its total is still a draft.
  return !seat.concessionsPaid && (seat.concessions || []).length > 0;
}

// Seat, photo, name, and for a guest who brought them -- "you" if that
// was you.
function seatWhoHtml(seatId, seat){
  // No photo (a guest, or a seat reserved before profiles): their
  // initial in a grey circle, so every row's name lines up.
  const initial = (seat.name || '?').trim().charAt(0).toUpperCase();
  const photo = seat.photoUrl
    ? '<img class="avatar" src="' + escapeHtml(seat.photoUrl) + '" alt="">'
    : '<span class="avatar avatar-blank" aria-hidden="true">' + escapeHtml(initial) + '</span>';
  const via = seat.guest && seat.via
    ? '<span class="via">' + escapeHtml(t('friend.list.via', { name: seat.mine ? t('friend.list.you') : seat.via })) + '</span>'
    : '';
  return '<span class="seat-id">' + escapeHtml(seatId) + '</span>' + photo + '<b>' + escapeHtml(seat.name || '') + '</b>' + via;
}

// One claimed seat on a list card. Yours (and your guests') are the way
// into that seat's concession cart; anyone else's is just who's sitting
// there -- their order is theirs (see the CONCESSIONS block below).
function buildClaimedSeatLine(obj, seatId, ordersOpen){
  const seat = (obj.seats || {})[seatId] || {};
  const lines = seat.concessions || [];

  if (!seat.mine){
    const row = document.createElement('div');
    row.className = 'seat-line is-other';
    row.innerHTML = '<div class="seat-line-main"><div class="seat-line-who">' + seatWhoHtml(seatId, seat) + '</div></div>';
    return row;
  }

  const row = document.createElement('button');
  row.type = 'button';
  row.className = 'seat-line is-mine';
  row.addEventListener('click', () => openCart(obj.id, seatId));

  const main = document.createElement('div');
  main.className = 'seat-line-main';

  const who = document.createElement('div');
  who.className = 'seat-line-who';
  // Paid seats show just the name -- only ones still owing get a tag, so
  // this list reads as "who still owes" rather than a payment log. The
  // food counts towards that as well as the ticket: a seat that's settled
  // its ticket and then ordered $25 of popcorn has not settled up.
  // Seat first, then who's in it: the seat is what you're scanning for
  // when you're looking down a row, and it's the shorter of the two so
  // the names line up.
  who.innerHTML = seatWhoHtml(seatId, seat) +
    (seatOwesAnything(obj, seat) ? '<span class="unpaid-tag">unpaid</span>' : '');
  main.appendChild(who);

  // A count, not the contents. Spelling out four people's orders in full
  // turns the showtime list into a wall of sauces; whoever cares about
  // the detail is one tap from it, and the host has the itemised copy.
  const summary = document.createElement('div');
  summary.className = 'concession-summary' + (lines.length ? ' has-items' : '');
  summary.textContent = lines.length
    ? t(lines.length === 1 ? 'friend.list.concessionsOne' : 'friend.list.concessionsMany', { count: lines.length })
    : t('friend.list.noConcessions');
  main.appendChild(summary);

  row.appendChild(main);

  const cta = document.createElement('div');
  cta.className = 'concession-cta';
  cta.textContent = ordersOpen ? (lines.length ? 'Edit' : '+ Add') : 'View';
  row.appendChild(cta);

  return row;
}

// ---- Tap-to-read seat tooltips ----
//
// Desktop reads a seat by hovering it. A phone can't, and a sold-out map
// is nothing but taken seats, so without this there is literally no way
// to find out who's sitting where from the map. One tip at a time, and a
// tap anywhere else puts it away.
let activeTipSeat = null;
let tipMeasureCtx = null;

function clearSeatTip(){
  if (!activeTipSeat) return;
  activeTipSeat.classList.remove('show-tip');
  activeTipSeat.style.removeProperty('--tip-shift');
  activeTipSeat = null;
}

function toggleSeatTip(seatEl){
  if (activeTipSeat === seatEl){ clearSeatTip(); return; }
  clearSeatTip();
  seatEl.classList.add('show-tip');
  activeTipSeat = seatEl;
  nudgeSeatTip(seatEl);
}

// The tooltip is a ::before, so it can't be measured directly. Measuring
// its text on a canvas and adding the padding gets within a pixel, which
// is all this needs: without it a tooltip on the first or last seat in a
// row hangs off the side of the scroller and gets clipped -- and the
// seats at the ends of a row are exactly the ones a phone is most likely
// to be scrolled to.
function nudgeSeatTip(seatEl){
  const map = document.getElementById('seatmap');
  if (!map) return;
  if (!tipMeasureCtx){
    const canvas = document.createElement('canvas');
    tipMeasureCtx = canvas.getContext && canvas.getContext('2d');
  }
  if (!tipMeasureCtx) return;   // no canvas: centered and maybe clipped beats no tooltip

  tipMeasureCtx.font = '400 12px ' + getComputedStyle(seatEl).fontFamily;
  // 8px padding + 1px border on each side, per the ::before rule.
  const half = (tipMeasureCtx.measureText(seatEl.dataset.tooltip || '').width + 18) / 2;

  const seatBox = seatEl.getBoundingClientRect();
  const mapBox = map.getBoundingClientRect();
  const center = seatBox.left + seatBox.width / 2;
  const edge = 4;
  let shift = 0;
  if (center - half < mapBox.left + edge) shift = (mapBox.left + edge) - (center - half);
  else if (center + half > mapBox.right - edge) shift = (mapBox.right - edge) - (center + half);
  if (shift) seatEl.style.setProperty('--tip-shift', Math.round(shift) + 'px');
}

// Anywhere that isn't the seat itself -- the seat's own handler stops the
// event before it gets here.
document.getElementById('pickerView').addEventListener('click', clearSeatTip);

// Screen arc + "SCREEN" label, built fresh into #seatmap alongside the
// rows (not as a separate element above it) so it's part of the same
// horizontally-scrolling flex column -- it scrolls in lock-step with the
// seats instead of sitting fixed while they scroll underneath it.
function buildScreenWrap(){
  const screenWrap = document.createElement('div');
  screenWrap.className = 'screen-wrap';
  screenWrap.innerHTML =
    '<svg class="screen-curve" viewBox="0 0 900 26" preserveAspectRatio="none">' +
    '<path d="M10,20 Q450,-10 890,20" stroke="#eee" stroke-width="2" fill="none"/></svg>' +
    '<div class="screen-label">SCREEN</div>';
  return screenWrap;
}

function buildSeatmap(obj){
  const seats = obj.seats || {};
  const seatmap = document.getElementById('seatmap');
  clearSeatTip();          // the element it pointed at is about to be discarded
  seatmap.innerHTML = '';
  seatEls = {};

  const rowDefs = getSeatLayout(obj.screen);

  const screenWrap = buildScreenWrap();
  seatmap.appendChild(screenWrap);

  rowDefs.forEach(row => {
    const rowEl = document.createElement('div');
    rowEl.className = 'row' + (row.gapAfter ? ' row-gap-after' : '');
    // Blank, non-interactive slots before the first real seat -- see
    // seat-layout.js's `padStart` comment. Rows render flush-left, so
    // this is what actually sets this row's horizontal offset from
    // every other row -- not dependent on any browser's cross-axis
    // centering support.
    for (let p = 0; p < (row.padStart || 0); p++){
      const filler = document.createElement('div');
      filler.className = 'seat-filler';
      rowEl.appendChild(filler);
    }
    for (let i = row.count; i >= 1; i--){
      // A number this row skips -- see seat-layout.js's `skip` comment.
      if ((row.skip || []).includes(i)){
        const filler = document.createElement('div');
        filler.className = 'seat-filler';
        rowEl.appendChild(filler);
        continue;
      }
      const seatId = row.letter + i;
      const type = row.special[i] || 'seat';
      const seatEl = document.createElement('div');
      seatEl.className = 'seat' + (type !== 'seat' ? ' ' + type : '');
      if (type === 'wc' || type === 'comp') {
        seatEl.innerHTML = WHEELCHAIR_ICON_SVG;
      } else {
        seatEl.textContent = seatId;
      }
      seatEl.setAttribute('aria-label', seatId);
      seatEl.dataset.tooltip = t('friend.seatMap.tipNotOurs', { seat: seatId });

      const entry = seats[seatId];
      if (entry && entry.name){
        seatEl.classList.add('taken');
        seatEl.dataset.tooltip = t('friend.seatMap.tipTaken', { seat: seatId, name: entry.name });
        // The tooltip above is hover-only, and a phone has no hover -- so
        // on a sold-out map there was nothing a tap could do and no way
        // to find out whose seat was whose. A taken seat can't be
        // claimed, but it can say who's in it.
        seatEl.setAttribute('role', 'button');
        seatEl.tabIndex = 0;
        seatEl.addEventListener('click', (e) => {
          // Or the outside-tap handler below would close it again in the
          // same gesture that opened it.
          e.stopPropagation();
          toggleSeatTip(seatEl);
        });
        seatEl.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggleSeatTip(seatEl); }
        });
      } else if (entry){
        seatEl.classList.add('pickable');
        seatEl.dataset.tooltip = t('friend.seatMap.tipAvailable', { seat: seatId });
        seatEl.addEventListener('click', () => openClaimOverlay(seatId));
      }
      rowEl.appendChild(seatEl);
      seatEls[seatId] = seatEl;
      // Blank slots between this seat and the next one -- see
      // seat-layout.js's `blankAfter` comment.
      for (let p = 0; p < ((row.blankAfter || {})[i] || 0); p++){
        const filler = document.createElement('div');
        filler.className = 'seat-filler';
        rowEl.appendChild(filler);
      }
    }
    seatmap.appendChild(rowEl);
  });

  // Match the screen's width to the widest row so its peak/label center
  // on the actual seat block instead of a fixed guess.
  const rowWidths = Array.from(seatmap.querySelectorAll('.row')).map(r => r.offsetWidth);
  if (rowWidths.length) screenWrap.style.width = Math.max(...rowWidths) + 'px';
}

// "For me" by default -- unless you already have your own seat in this
// showtime, when the next one is most likely for someone you're bringing.

function claimFor(){
  const checked = document.querySelector('input[name="claimFor"]:checked');
  return checked ? checked.value : 'me';
}
function setClaimFor(value){
  document.querySelectorAll('input[name="claimFor"]').forEach(r => { r.checked = r.value === value; });
  document.getElementById('claimGuestName').classList.toggle('hidden', value !== 'guest');
}
document.querySelectorAll('input[name="claimFor"]').forEach(r => r.addEventListener('change', () => {
  setClaimFor(claimFor());

}));

// ---------------- SUCCESS / PAY OVERLAY ----------------
// The card after a seat is claimed asks one thing at a time: settle up,
// then put it in the calendar, then order something. Each has its own way
// out, and skipping one moves to the next rather than dismissing the lot.
//
// A step that can't do anything is never offered -- no payment handles
// set, no usable date to build an event from, no menu to order off.
let successSteps = [];
let successStepTotal = 0;  // fixed at open, so "2 of 3" doesn't renumber as steps are consumed
let successShowtime = null;
let successSeatId = null;

function openSuccessOverlay(showtime, seatId){
  successShowtime = showtime;
  successSeatId = seatId;

  const showtimeName = showtime.title || t('friend.success.unnamedShowtime');
  document.getElementById('successSub').textContent = typeof showtime.price === 'number'
    ? t('friend.success.subtitle', { seat: seatId, title: showtimeName, price: formatPrice(showtime.price) })
    : t('friend.success.subtitleNoPrice', { seat: seatId, title: showtimeName });

  const seat = (showtime.seats || {})[seatId];
  // Nobody for the host to pay, so don't offer to send them money.
  const isHost = !!(seat && seat.host);
  const canPay = !isHost && !!(buildVenmoLink(showtime.price, '') || buildCashAppLink(showtime.price));

  successSteps = [];
  if (canPay) successSteps.push('pay');
  if (showtimeStart(showtime)) successSteps.push('calendar');
  if (concessionMenu.length) successSteps.push('concessions');
  successStepTotal = successSteps.length;

  renderSuccessStep();
  document.getElementById('successOverlay').classList.remove('hidden');
  overlayOpened();
}

function successButton(label, className, onClick){
  const btn = document.createElement('button');
  btn.type = 'button';
  if (className) btn.className = className;
  btn.textContent = label;
  btn.addEventListener('click', onClick);
  return btn;
}

function renderSuccessStep(){
  const actions = document.getElementById('successActions');
  const stepEl = document.getElementById('successStep');
  actions.innerHTML = '';
  stepEl.textContent = '';

  const step = successSteps[0];
  if (!step){
    // Nothing this showtime can offer -- one way out rather than an
    // empty card.
    actions.appendChild(successButton('Done', '', closeSuccessOverlay));
    return;
  }

  // Only worth saying when there's more than one, and it's what tells
  // someone that "Skip" moves on rather than closing the card.
  if (successStepTotal > 1){
    stepEl.textContent = t('friend.success.step', { n: successStepTotal - successSteps.length + 1, total: successStepTotal });
  }

  if (step === 'pay'){
    const price = successShowtime.price;
    const note = (successShowtime.title || 'Movie') + ' (' + formatDateShort(successShowtime.date) + ', ' + successSeatId + ')';
    const venmo = buildVenmoLink(price, note);
    const cash = buildCashAppLink(price);
    // Both open in a new tab, so advancing straight away leaves the next
    // step waiting when they come back rather than the one they just did.
    if (venmo) actions.appendChild(successLink(
      typeof price === 'number' ? t('friend.success.payVenmo', { amount: formatPrice(price) }) : t('friend.success.payVenmoNoPrice'),
      'venmo-btn', venmo, true));
    if (cash) actions.appendChild(successLink(
      typeof price === 'number' ? t('friend.success.payCashApp', { amount: formatPrice(price) }) : t('friend.success.payCashAppNoPrice'),
      'cashapp-btn', cash, true));
    // The links above hand off to another app and nothing comes back, so
    // without this there's no moment at which the payment can be recorded
    // -- and the moment someone has just made it is the one moment they
    // remember to. Skip leaves the seat owing, which is also true.
    actions.appendChild(successButton(t('friend.success.alreadyPaid'), '', () => {
      markSeatPaid(successShowtime.id, successSeatId, { ticket: true });
      advanceSuccessStep();
    }));
    actions.appendChild(successButton('Skip', '', advanceSuccessStep));
    return;
  }

  if (step === 'calendar'){
    // Not under /api/public: Chrome on iOS doesn't send the login cookie
    // with a calendar download -- see /calendar/:id.ics in server.js.
    const href = '/calendar/' + encodeURIComponent(successShowtime.id) +
      '.ics?seat=' + encodeURIComponent(successSeatId);
    // No target: iOS shows the Add to Calendar sheet over the page, and a
    // blank tab is what you get if you fight it.
    actions.appendChild(successLink(t('friend.success.addCalendar'), 'cal-btn', href, false));
    actions.appendChild(successButton('Skip', '', advanceSuccessStep));
    return;
  }

  // concessions
  actions.appendChild(successButton(t('friend.success.addConcessions'), '', openCartFromSuccess));
  actions.appendChild(successButton('Later', '', advanceSuccessStep));
}

function successLink(label, className, href, newTab){
  const a = document.createElement('a');
  a.className = className;
  a.href = href;
  a.textContent = label;
  if (newTab && opensInNewTab(href)){
    a.target = '_blank';
    a.rel = 'noopener';
  }
  a.addEventListener('click', () => {
    // Doing the thing counts as finishing the step.
    setTimeout(advanceSuccessStep, 0);
  });
  return a;
}

function advanceSuccessStep(){
  successSteps.shift();
  if (!successSteps.length){
    closeSuccessOverlay();
    return;
  }
  renderSuccessStep();
}

function closeSuccessOverlay(){
  document.getElementById('successOverlay').classList.add('hidden');
  overlayClosed();
}

async function submitClaim(){
  if (!claimingSeatId || !currentShowtimeId) return;
  const errorEl = document.getElementById('claimError');
  const guestName = claimFor() === 'guest' ? document.getElementById('claimGuestName').value.trim() : '';
  if (claimFor() === 'guest' && !guestName){
    errorEl.textContent = t('friend.claim.noName');
    return;
  }
  try{
    const res = await fetch('/api/public/showtimes/' + currentShowtimeId + '/claim', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ seatId: claimingSeatId, guestName })
    });
    if (await handleAuthFailure(res)) return;
    if (res.status === 409){
      errorEl.textContent = t('friend.claim.taken');
      return;
    }
    if (!res.ok){
      errorEl.textContent = t('friend.claim.failed');
      return;
    }
    const data = await res.json();
    const claimedSeatId = claimingSeatId;
    lastClaim = { showtimeId: currentShowtimeId, seatId: claimedSeatId };
    closeClaimOverlay();
    // Refresh the in-memory copy for this showtime and redraw the map so
    // the newly-claimed seat shows red immediately.
    const idx = allShowtimes.findIndex(s => s.id === currentShowtimeId);
    if (idx !== -1) allShowtimes[idx] = data.showtime;
    buildSeatmap(data.showtime);
    openSuccessOverlay(data.showtime, claimedSeatId);
    // My showtimes picks up the new seat in the background.
    loadList();
  }catch(e){
    errorEl.textContent = t('friend.claim.unreachable');
  }
}

function closeProfile(){
