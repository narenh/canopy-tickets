<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Upcoming Showtimes</title>
<!-- OG_META -->
<style>
  :root{
    --gold:#c9a24b;
    --gold-dark:#8a712f;
    --red:#e2333d;
    --green:#2ecc71;
    --info-blue:#4da6ff;
    --venmo:#008CFF;
    --cashapp:#00D64F;
    --bg:#0b0b0d;
    --muted:#9a9a9a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:#fff;
    font-family:-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    padding-bottom:40px;
  }
  .hidden{display:none !important;}
  /* Set while the concessions sheet is open -- see closeCartOverlay. */
  body.cart-open{overflow:hidden;}

  /* Everything here is laid out mobile-first (full-bleed, no width cap),
     which on a desktop window stretches every card, header and form row
     across the whole screen. Cap the content column and center it so a
     wide window just gets margins instead of 2000px-wide cards. The
     full-screen overlays are deliberately not in here -- they're
     position:fixed against the viewport and cap their own cards.

     880, not a rounder 800: the widest seat map (IMAX, 34 seats at
     22px + 2px gap, plus .seatmap's 16px side padding) needs ~846px,
     and anything narrower puts each row's last seat behind a
     horizontal scroll on desktop. Narrow this and check the IMAX
     picker before assuming it's only a prose-width knob. */
  #listView, #filmView, #pickerView{
    max-width:880px;
    margin:0 auto;
  }

  /* ---------- LIST VIEW ---------- */
  .list-header{
    padding:24px 20px 10px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .site-logo{
    display:block;
    max-height:40px;
    max-width:100%;
    width:auto;
    height:auto;
    margin:0 0 10px;
  }
  .list-header{align-items:center;}
  .list-header h1{
    font-size:24px;
    margin:0;
  }
  /* A logo already says the name. */
  .site-logo ~ h1{display:none;}
  .list-head-brand .site-logo{margin:0;}
  .avatar{
    display:block;
    border-radius:50%;
    object-fit:cover;
    background:#2a2a2a;
  }
  .me-btn{
    display:flex;
    align-items:center;
    gap:8px;
    background:none;
    border:none;
    color:#ddd;
    font:inherit;
    font-size:14px;
    padding:2px;
    cursor:pointer;
  }
  .me-btn .avatar{width:36px;height:36px;border:2px solid var(--gold);}
  .me-wrap{position:relative;}
  .me-menu{
    position:absolute;
    right:0;
    top:calc(100% + 8px);
    z-index:60;
    min-width:210px;
    background:#1c1c1f;
    border:1px solid #2e2e32;
    border-radius:12px;
    box-shadow:0 12px 30px rgba(0,0,0,.5);
    padding:6px;
    display:flex;
    flex-direction:column;
  }
  .me-menu button{
    background:none;
    border:none;
    color:#eee;
    font:inherit;
    font-size:15px;
    text-align:left;
    padding:11px 12px;
    border-radius:8px;
    cursor:pointer;
  }
  .me-menu button:hover, .me-menu button:focus-visible{background:#2a2a2e;outline:none;}
  .me-menu .me-menu-signout{color:#e2857a;border-top:1px solid #2a2a2e;border-radius:0 0 8px 8px;margin-top:4px;padding-top:13px;}
  .tabs{
    display:flex;
    gap:4px;
    padding:0 10px;
    border-bottom:1px solid #2a2a2a;
  }
  .tabs button{
    background:none;
    border:none;
    border-bottom:2px solid transparent;
    color:var(--muted);
    font:inherit;
    font-size:15px;
    font-weight:600;
    padding:12px 10px;
    margin-bottom:-1px;
    cursor:pointer;
  }
  .tabs button.active{color:#fff;border-bottom-color:var(--gold);}
  .tab-intro{
    margin:14px 20px 0;
    color:var(--muted);
    font-size:14px;
  }
  .mine-empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px;}
  .mine-empty button{
    margin-top:14px;
    background:var(--gold);
    color:#241c07;
    border:none;
    border-radius:20px;
    padding:10px 18px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }
  /* A movie this browser hasn't unlocked: its seats are shown, but the
     only thing to do is unlock it. */
  .locked-note{
    display:flex;
    align-items:center;
    gap:8px;
    width:100%;
    margin-top:10px;
    background:#1b1710;
    border:1px solid #4a3d1c;
    border-radius:10px;
    color:#f0dda9;
    font:inherit;
    font-size:13px;
    padding:9px 12px;
    text-align:left;
    cursor:pointer;
  }
  .mine-seat{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:#ddd;
    padding:4px 0;
  }
  .mine-seat .seat-id{color:var(--muted);font-weight:700;min-width:30px;}
  .mine-seat b{color:#eee;font-weight:600;}
  .mine-seat.is-mine b{color:var(--gold);font-weight:700;}
  .mine-seat .you-tag{
    font-size:10.5px;
    font-weight:700;
    color:#241c07;
    background:var(--gold);
    border-radius:8px;
    padding:1px 6px;
  }
  .mine-section{margin-top:12px;}
  .mine-seat .unpaid-tag{color:#e2857a;font-size:11px;}
  .mine-orders{border-top:1px solid #26262a;margin-top:10px;padding-top:2px;}
  .order-block{padding:10px 0 2px;}
  .order-block + .order-block{border-top:1px solid #222225;margin-top:6px;}
  .order-add, .order-edit{
    background:none;
    border:none;
    padding:0;
    color:var(--gold);
    font:inherit;
    font-weight:700;
    cursor:pointer;
    text-align:left;
  }
  .order-add{font-size:14.5px;padding:2px 0;}
  .order-edit{font-size:13.5px;margin-top:6px;}
  .order-items{color:#e6e6e6;font-weight:500;font-size:14px;line-height:1.55;}
  .order-note{color:var(--muted);}
  .order-none{color:var(--muted);font-size:13.5px;}
  .mine-section-head{
    color:var(--muted);
    font-size:11px;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    margin-bottom:4px;
  }
  .cards{
    /* 10, not 20, at the sides. Paired with the card's own 10 below it
       this puts a card's contents at 20px -- the same left edge as the
       page title above them, which they never shared before -- while the
       card itself sits closer to the screen edge and the rows inside it
       get the width back. */
    padding:14px 10px 20px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .card{
    background:#151517;
    border:1px solid #2a2a2a;
    border-radius:14px;
    padding:14px 10px;
  }
  /* Poster + title/info/seat-count column, side by side; the claimed-
     seat names and the Reserve button below stay full-width (not part
     of this row). */
  .card-body{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:10px;
    cursor:pointer;
    /* Pulled out to the card's edges and padded back, so the pressed and
       focused states cover the full width of the header rather than a
       box floating inside it. */
    margin-left:-10px;
    margin-right:-10px;
    padding:4px 10px;
    border-radius:10px;
  }
  .card-body:hover{background:#1a1a1d;}
  .card-body:focus-visible{outline:2px solid var(--gold);outline-offset:-2px;}
  /* Says the header goes somewhere. Muted, because the Reserve button
     below it is the call to action and this shouldn't compete. */
  .card-chevron{
    flex:0 0 auto;
    width:8px;
    height:8px;
    margin-left:2px;
    border-right:2px solid var(--muted);
    border-top:2px solid var(--muted);
    transform:rotate(45deg);
  }
  .card-info{flex:1;min-width:0;}
  /* Same box whether or not this title has a poster yet, so every card's
     title/info column starts at the same x regardless. */
  .poster-thumb{
    flex:0 0 auto;
    width:60px;
    height:90px;
    border-radius:8px;
    overflow:hidden;
    background:#000;
  }
  .poster-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .poster-thumb.poster-placeholder{background:#0f0f10;border:1px solid #2a2a2a;}
  .card h3{
    margin:0 0 4px;
    font-size:18px;
  }
  /* Date + time get their own row directly under the title -- it's what
     you actually scan a list of showtimes for, so it shouldn't be buried
     mid-way through a pipe-separated run of theater/format/price.
     Bigger and bolder than .meta, but deliberately the same secondary
     #ccc: size and weight carry the emphasis, not brightness, so it
     stays clearly below the white title in the hierarchy. */
  .card .when{
    color:#ccc;
    font-size:15px;
    font-weight:700;
    line-height:1.3;
    margin-bottom:5px;
  }
  .card .meta{
    color:#ccc;
    font-size:13px;
    line-height:1.4;
    /* No min-height here anymore. It used to reserve 2 lines so a short
       info column couldn't come out shorter than the poster's fixed
       90px; the .when row above now supplies that height on its own, and
       reserving it twice just left a blank gap under a one-line meta. */
    margin-bottom:6px;
  }
  .seats-avail-line{
    font-size:14px;
    font-weight:700;
    margin-bottom:8px;
  }
  .seats-avail-green{color:var(--green);}
  /* The host's note about this one showing ("Japanese Spoken"). Bright
     and bold so it isn't missed -- it's usually the thing that would
     make someone pick a different time. */
  .card .showtime-info{
    color:var(--info-blue);
    font-size:14px;
    font-weight:700;
    margin-bottom:4px;
  }
  .seats-avail-red{color:var(--red);}
  .seats-empty{
    color:var(--muted);
    font-size:13px;
    margin-bottom:8px;
  }
  .seat-line{
    font-size:13px;
    color:#ddd;
    margin-bottom:3px;
  }
  .seat-line b{color:var(--gold);}
  /* Same size and weight as the name beside it -- only the colour sets
     it back, so the two read as one label rather than a name with a
     footnote. The margin is the breathing room between them. */
  .seat-line .seat-id{
    color:var(--muted);
    font-weight:700;
    margin-right:9px;
  }
  .seat-line .unpaid-tag{color:#e2857a;font-size:11px;margin-left:6px;}
  .claimed-list{margin-bottom:10px;}
  .claim-btn{
    width:100%;
    background:var(--gold);
    color:#241c07;
    border:none;
    border-radius:20px;
    padding:10px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
  }
  .claim-btn:disabled{
    background:#2a2a2a;
    color:var(--muted);
    cursor:not-allowed;
  }
  /* ---------- MOVIE GRID (landing) ---------- */
  /* One tile per film rather than one card per showtime: with several
     films each showing several times, the flat list was a long scroll
     before you found the movie you came for. minmax(140px) gives two
     columns on a phone and five at the 880px cap. */
  .film-grid{
    padding:14px 10px 20px;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));
    gap:14px 12px;
  }
  .film-grid .empty-state, .film-grid .loading-state{grid-column:1 / -1;}
  .film-tile{
    display:block;
    width:100%;
    background:none;
    border:none;
    padding:0;
    color:inherit;
    font:inherit;
    text-align:left;
    cursor:pointer;
  }
  .film-tile:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:10px;}
  /* Locked: a padlock on the poster. Tapping it blurs the poster and puts
     the password field over it. */
  .film-poster{position:relative;}
  .lock-badge{
    position:absolute;
    top:8px;
    right:8px;
    width:30px;
    height:30px;
    border-radius:50%;
    background:rgba(0,0,0,.65);
    border:1px solid rgba(255,255,255,.25);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .film-tile.is-unlocking .film-poster img,
  .film-tile.is-unlocking .film-poster .film-poster-fallback{filter:blur(10px) brightness(.55);transform:scale(1.08);}
  .film-tile.is-unlocking .lock-badge{display:none;}
  .unlock-form{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:8px;
    padding:10px;
  }
  .unlock-form input{
    width:100%;
    background:rgba(0,0,0,.55);
    color:#fff;
    border:1px solid rgba(255,255,255,.3);
    border-radius:10px;
    padding:10px;
    font-size:16px;
  }
  .unlock-form button{
    background:var(--gold);
    color:#241c07;
    border:none;
    border-radius:10px;
    padding:9px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
  }
  .unlock-form .unlock-cancel{background:none;color:#ddd;font-weight:600;font-size:13px;padding:2px;}
  .unlock-error{color:#ffb3ad;font-size:12px;text-align:center;min-height:15px;text-shadow:0 1px 2px #000;}
  .film-tile.shake{animation:shake .35s;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-6px);}
    75%{transform:translateX(6px);}
  }
  .film-poster{
    aspect-ratio:2 / 3;
    border-radius:10px;
    overflow:hidden;
    background:#0f0f10;
    border:1px solid #2a2a2a;
    margin-bottom:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:10px;
  }
  .film-poster.has-img{padding:0;border-color:transparent;background:#000;}
  .film-poster img{width:100%;height:100%;object-fit:cover;display:block;}
  /* No art yet: the title stands in for it, so the tile isn't a blank box. */
  .film-poster-fallback{
    color:var(--muted);
    font-size:15px;
    font-weight:700;
    text-align:center;
    line-height:1.25;
  }
  .film-tile:hover .film-poster{border-color:#3a3a3a;}
  .film-title{
    font-size:15px;
    font-weight:700;
    line-height:1.25;
    margin-bottom:3px;
  }
  .film-sub{
    color:#ccc;
    font-size:12.5px;
    line-height:1.35;
  }
  /* Inside one film's view the header already names it, so the card's
     own title is dropped. The poster stays -- it's what makes a card read
     as a showing of this film at a glance. */
  #filmView .card h3{display:none;}
  .film-intro{
    margin:0;
    padding:0 20px;
    color:var(--muted);
    font-size:14px;
  }

  .empty-state, .loading-state{
    padding:40px 20px;
    text-align:center;
    color:var(--muted);
    font-size:14px;
  }

  /* ---------- SEAT PICKER VIEW ---------- */
  .header{
    padding:20px 20px 14px;
  }
  .top-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .back-btn{
    font-size:22px;
    color:#fff;
    cursor:pointer;
    opacity:.85;
    padding:4px 8px 4px 0;
  }
  .picker-title{
    font-size:22px;
    font-weight:800;
    line-height:1.15;
    flex:1;
  }
  .picker-subtitle{
    margin-top:8px;
    color:#e8e8e8;
    font-size:14px;
  }
  /* screen-wrap is now a flex item inside .seatmap itself (built in JS,
     one per render) so it scrolls horizontally in lock-step with the
     seat rows instead of staying fixed while they scroll underneath it.
     Its width gets set explicitly in JS to match the widest row, so the
     arc's peak and the word "SCREEN" line up with the actual center of
     the seat block rather than a fixed 900px guess. */
  .screen-wrap{padding:0 0 10px;text-align:center;flex:0 0 auto;}
  .screen-curve{display:block;width:100%;height:26px;}
  .screen-label{color:#ccc;font-size:11px;letter-spacing:3px;margin-top:2px;}
  .seatmap{
    display:flex;
    flex-direction:column;
    /* Flush-left, not centered -- `align-items:safe center` (the
       previous approach) silently falls back to flex-start on browsers
       that don't support the `safe` keyword (confirmed: Mobile Safari),
       so different rows ended up genuinely centered in some browsers
       and flush-left in others, with row A's alignment fix computed
       for the wrong one. Flush-left is unambiguous everywhere -- row
       A's own padStart (see seat-layout.js) is what actually aligns it
       now, not a browser's cross-axis alignment support. */
    align-items:flex-start;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    padding:6px 16px 10px;
  }
  .row{
    display:flex;
    justify-content:flex-start;
    gap:2px;
    margin:2px 0;
    width:max-content;
  }
  /* Stadium-style rooms with a few flat rows up front (e.g. Dolby's A-C)
     get extra breathing room here before the raised rows start -- no
     divider line, just space. */
  .row.row-gap-after{
    margin-bottom:24px;
  }
  .seat{
    position:relative;
    width:22px;
    height:20px;
    border-radius:4px;
    background:#2a2a2a;
    border:1px solid #3a3a3a;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:7px;
    color:#666;
    font-weight:700;
    user-select:none;
    flex:0 0 auto;
  }
  /* Deliberately not var(--gold)/var(--red) here -- those still cover
     buttons/text elsewhere on this page. Pickable is the one seat state
     you'd actually tap, so it gets its own brighter/more saturated
     gold to read as the obvious call to action; taken is done/inert
     (nothing to click), so a darker, less alarming red keeps it from
     visually competing with pickable for attention. */
  .seat.pickable{background:#e8b93f;border-color:#a9791b;color:#2e2308;cursor:pointer;}
  .seat.taken{background:#7a2a30;border-color:#551c20;color:#e8d4d4;cursor:not-allowed;}
  /* A wheelchair space is just the icon -- no seat box at all, so it
     doesn't read as a seat you'd claim the way a companion seat is. A
     companion seat keeps the normal seat box (same shape/coloring as
     any other seat, state colors included) and just swaps its number
     for the icon. Comes after the state rules above so it wins the tie
     (same specificity, later wins) on wc's own state classes. */
  .seat.wc{background:none;border:none;}
  /* Blank spacer -- see seat-layout.js's `padStart`. Same box size as a
     real seat (so it takes up exactly one column) but otherwise nothing:
     no border, no background, not part of the tab/hover/click behavior. */
  .seat-filler{width:22px;height:20px;flex:0 0 auto;}
  /* Custom tooltip (seat number + assignment), bigger and more legible
     than the browser's native title-attribute tooltip.
     
     .show-tip is the phone half of this: a touch screen has no hover, so
     on a sold-out map -- where every seat is taken and the only thing the
     map has left to say is whose seat is whose -- there was no way at all
     to read one. Tapping a seat sets the class; see selectSeatTip. The
     --tip-shift it reads is how far the tooltip has to slide back to stay
     inside the scroller when the seat is near an edge. */
  .seat:hover::before,
  .seat.show-tip::before{
    content:attr(data-tooltip);
    position:absolute;
    bottom:130%;
    left:50%;
    transform:translateX(calc(-50% + var(--tip-shift, 0px)));
    background:#000;
    color:#fff;
    padding:4px 8px;
    border-radius:6px;
    font-size:12px;
    font-weight:400;
    white-space:nowrap;
    z-index:20;
    pointer-events:none;
    border:1px solid #444;
  }
  /* The tapped seat sits above its neighbours so its tooltip isn't
     painted over by the seats to either side. */
  .seat.show-tip{z-index:21;}
  /* Taken seats are tappable now, so stop telling the pointer they
     aren't. There is nothing to claim, but there is something to read. */
  .seat.taken{cursor:pointer;}
  .toolbar-note{
    color:var(--muted);
    font-size:11.5px;
    padding:0 20px 10px;
  }
  .legend{
    margin-top:12px;
    padding:14px 20px;
    border-top:1px solid #2a2a2a;
    display:flex;
    flex-wrap:wrap;
    gap:18px;
    font-size:13px;
    color:#ddd;
  }
  .legend-item{display:flex;align-items:center;gap:8px;}
  .legend-swatch{width:18px;height:18px;border-radius:4px;display:inline-block;}
  .sw-pickable{background:#e8b93f;border:1px solid #a9791b;}
  .sw-taken{background:#7a2a30;}
  .sw-unavail{background:#2a2a2a;border:1px solid #3a3a3a;}

  /* ---------- CLAIM OVERLAY ---------- */
  .claim-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:50;
  }
  .claim-card{
    width:100%;
    max-width:320px;
    background:#151517;
    border:1px solid #2a2a2a;
    border-radius:14px;
    padding:20px;
  }
  .claim-title{
    font-size:17px;
    font-weight:700;
    margin-bottom:6px;
  }
  .claim-sub{
    color:var(--muted);
    font-size:12px;
    margin-bottom:14px;
  }
  /* 16px: iOS Safari zooms the whole page in when a text field smaller
     than that takes focus, and never zooms back out. */
  .claim-card input[type="text"]{
    width:100%;
    background:#0f0f10;
    color:#fff;
    border:1px solid #3a3a3a;
    border-radius:10px;
    padding:10px 12px;
    font-size:16px;
    margin-bottom:14px;
  }
  .claim-actions{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .claim-for{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
  .claim-for-opt{display:flex;align-items:center;gap:10px;font-size:15px;cursor:pointer;}
  .claim-for-opt input{width:18px;height:18px;margin:0;accent-color:var(--gold);}
  .name-row{display:flex;gap:8px;}
  .name-row input{min-width:0;}
  .profile-top{display:flex;align-items:center;gap:14px;margin-bottom:14px;}
  .profile-photo{position:relative;flex:0 0 auto;cursor:pointer;}
  .profile-photo .avatar{width:72px;height:72px;border:2px solid var(--gold);}
  .profile-photo input{position:absolute;inset:0;opacity:0;cursor:pointer;}
  /* Same badge as the sign-up page's photo picker. */
  .profile-photo .photo-badge{
    position:absolute;
    right:-2px;
    bottom:-2px;
    width:28px;
    height:28px;
    border-radius:50%;
    background:var(--gold);
    border:3px solid #151517;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
  }
  .profile-photo .photo-badge svg{width:12px;height:12px;display:block;}
  /* Lined up on the text baseline: centred, the @ (which hangs below
     the line) sat visibly lower than the name. */
  .profile-locked{
    color:#f0dda9;
    font-size:13px;
    line-height:1.4;
    background:#1f1a0e;
    border:1px solid #4a3c1a;
    border-radius:10px;
    padding:10px 12px;
    margin-bottom:12px;
  }
  /* Read-only: no pencil, no picker, fields look like text. */
  .profile-readonly .photo-badge, .profile-readonly .profile-photo input{display:none;}
  .profile-readonly .profile-photo{cursor:default;}
  .profile-readonly input[type="text"]{color:#bbb;}
  .venmo-field{
    display:flex;
    align-items:baseline;
    background:#0f0f10;
    border:1px solid #3a3a3a;
    border-radius:10px;
    padding:0 12px;
    margin-bottom:14px;
    cursor:text;
  }
  .venmo-field:focus-within{border-color:#5a5a5a;}
  .venmo-at{color:var(--muted);font-size:16px;flex:0 0 auto;}
  .claim-card .venmo-field input[type="text"]{
    border:none;
    background:none;
    padding:10px 0 10px 2px;
    margin:0;
    outline:none;
    flex:1;
    min-width:0;
  }
  .profile-email{margin:0;overflow-wrap:anywhere;}
  .existing-card{max-height:85vh;display:flex;flex-direction:column;}
  #existingPick{display:flex;flex-direction:column;flex:1;min-height:0;}
  .existing-list{overflow-y:auto;margin-bottom:12px;flex:1;min-height:0;}
  .existing-name{font-weight:700;color:var(--gold);font-size:14px;margin:10px 0 4px;}
  .existing-seat{display:flex;align-items:center;gap:10px;font-size:13px;color:#ddd;padding:5px 0;cursor:pointer;}
  .existing-seat input{width:18px;height:18px;margin:0;accent-color:var(--gold);flex:0 0 auto;}
  /* 16px so iOS doesn't zoom in on focus. */
  .existing-pw-input{
    width:100%;
    background:#0f0f10;
    color:#fff;
    border:1px solid #3a3a3a;
    border-radius:10px;
    padding:12px 14px;
    font-size:16px;
    margin:4px 0 8px;
  }
  .claim-actions button, .claim-actions a{
    width:100%;
    padding:10px;
    border-radius:20px;
    font-size:14px;
    cursor:pointer;
    border:1px solid #3a3a3a;
    background:#1e1e1e;
    color:#fff;
    text-align:center;
    text-decoration:none;
    display:block;
    box-sizing:border-box;
  }
  .claim-actions .claim-submit-btn, .claim-actions .venmo-btn{
    background:var(--venmo);
    color:#fff;
    border:none;
    font-weight:700;
  }
  /* The first thing on this card and the one that stops being possible
     once it's dismissed, so it gets a solid fill rather than the plain
     dark of the secondary buttons. Gold, not a blue of its own: it's the
     page's own accent, and it keeps the two blue-ish fills below it
     reading as the pay buttons rather than as a set of three. */
  .claim-actions .cal-btn{
    background:var(--gold);
    color:#241c07;
    border:none;
    font-weight:700;
  }
  .claim-actions .cashapp-btn{
    background:var(--cashapp);
    color:#04240f;
    border:none;
    font-weight:700;
  }
  /* The cart's Save button sits right above the pay buttons and shares
     their shape -- without this it keeps its bright "press me" blue in
     the nothing-to-save state, one button away from two that really are
     pressable. */
  .claim-actions button:disabled{
    background:#1e1e1e;
    color:var(--muted);
    border:1px solid #3a3a3a;
    font-weight:400;
    cursor:default;
  }
  .success-sub{
    color:#e8e8e8;
    font-size:14px;
    margin-bottom:10px;
  }
  .success-step{
    color:var(--muted);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.08em;
    min-height:14px;
    margin-bottom:10px;
  }
  .claim-error{
    color:#e2857a;
    font-size:12px;
    min-height:16px;
    margin-bottom:6px;
  }

  /* ---------- CONCESSIONS (list card) ---------- */
  /* A reserved seat's line is the entry point to its cart, so the whole
     line is the tap target rather than a separate small button hanging
     off the end of it -- there's one of these per claimed seat and a row
     of 12 tiny buttons would be both uglier and harder to hit on a
     phone. It's a <button> (not a div with onclick) so keyboard and
     screen-reader users get it for free. */
  button.seat-line{
    display:flex;
    align-items:center;
    gap:8px;
    width:100%;
    text-align:left;
    background:#101012;
    border:1px solid #232326;
    border-radius:10px;
    padding:8px 10px;
    margin-bottom:6px;
    color:#ddd;
    font-family:inherit;
    font-size:13px;
    cursor:pointer;
  }
  button.seat-line:hover{border-color:#3a3a3a;}
  /* Someone else's seat: who's sitting there, nothing to tap. */
  .seat-line.is-other{padding:5px 11px;margin-bottom:4px;}
  /* Gold names mean yours, as on My showtimes. */
  .seat-line.is-other b{color:#eee;font-weight:600;}
  /* Your own seat stands out in a list of everyone's. */
  button.seat-line.is-mine{border-color:#5a4a22;background:#17140d;}
  .seat-line .avatar, .mine-seat .avatar{width:22px;height:22px;flex:0 0 auto;}
  .avatar-blank{
    display:flex;
    align-items:center;
    justify-content:center;
    background:#3a3a3e;
    color:#ccc;
    font-size:11px;
    font-weight:700;
  }
  .seat-line-who{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .seat-line-who .via, .mine-seat .via{color:var(--muted);font-size:11.5px;}
  .seat-line-main{flex:1;min-width:0;}
  .seat-line-who{margin-bottom:2px;}
  .concession-summary{
    color:var(--muted);
    font-size:11.5px;
    line-height:1.35;
    /* Long orders wrap instead of stretching the card -- the full cart
       is one tap away, this line is only ever a glance. */
    overflow-wrap:anywhere;
  }
  .concession-summary.has-items{color:#cbbf9a;}
  .concession-cta{
    flex:0 0 auto;
    color:var(--gold);
    font-size:11px;
    font-weight:700;
    white-space:nowrap;
  }

  /* ---------- CART OVERLAY ---------- */
  /* Wider and taller than the claim/success cards: this one is a list of
     every menu item, not a single field. The head and foot stay put and
     only the item list scrolls, so the running total and the Save button
     never scroll out of reach mid-order. */
  /* A phone gets the whole screen rather than a card floating on a
     dimmed page: at this size the margins were costing rows of menu, and
     a sheet that fills the display makes the menu the only thing on
     screen that scrolls. */
  @media (max-width: 600px){
    #cartOverlay{padding:0;}
    #cartOverlay .cart-card{
      width:100%;
      max-width:none;
      height:100%;
      border-radius:0;
      border:none;
    }
  }
  .cart-card{
    max-width:420px;
    /* height, not max-height: the menu below is sized flex-basis 0, so it
       contributes no natural height of its own and the card would
       otherwise shrink-wrap the order panel and footer, leaving the menu
       pinned at its minimum even on a tall screen. Fixing the sheet's
       height lets the menu take everything the order panel doesn't. */
    height:min(88vh, 760px);
    display:flex;
    flex-direction:column;
    padding:0;
  }
  .cart-head{
    position:relative;
    padding:16px 20px 6px;
    flex:0 0 auto;
  }
  .cart-close-x{
    position:absolute;
    top:8px;
    right:10px;
    width:34px;
    height:34px;
    border-radius:50%;
    border:none;
    background:none;
    color:var(--muted);
    font-size:26px;
    line-height:1;
    padding:0;
    cursor:pointer;
  }
  .cart-close-x:hover{color:#fff;}
  /* Leaves room for the X so a long movie title can't run under it. */
  .cart-head .claim-title{padding-right:34px;}
  .cart-subrow{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:10px;
  }
  .cart-subrow .claim-sub{margin-bottom:0;}
  .cart-body{
    /* basis 0, not auto: with `auto` the menu's natural height (40-odd
       rows) dominated the shrink weighting, so the order panel below
       absorbed almost all of it and collapsed to two rows. At basis 0 the
       menu takes the space that's left over instead, and min-height is
       the floor a long order can't push it through. */
    flex:1 1 0;
    min-height:132px;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    /* Tighter at the sides than the head and foot: every row now sits
       inside a section, which brings its own border and padding, so the
       old 20px stacked into a deep gutter. At 10px the section labels
       still line up with the title above them.
       No padding at the TOP, because a sticky header's `top: 0` is inset
       by the scroller's padding -- 4px here was 4px of band above the
       pinned header with item rows sliding visibly through it. The first
       section's own margin supplies the spacing instead. */
    padding:0 10px 4px;
  }
  .cart-foot{
    flex:0 0 auto;
    padding:12px 20px 18px;
    border-top:1px solid #2a2a2a;
  }
  .cart-item{
    padding:9px 0;
    border-bottom:1px solid #202023;
  }
  .cart-item:last-child{border-bottom:none;}
  /* The item and its stepper sit on one row; the note field (when there
     is one) drops to a full-width line underneath, which is the only way
     it's usable at phone width. */
  .ci-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .ci-main{flex:1;min-width:0;}
  .ci-name{font-size:14px;color:#fff;overflow-wrap:anywhere;}
  .ci-price{font-size:12px;color:var(--muted);margin-top:1px;}
  .ci-off-menu{color:#e2857a;}
  /* One tap, one line. No quantity control: a quantity can only carry
     one idea of what the order is, and two popcorn chickens may well
     want two different sauces. */
  .ci-add{
    flex:0 0 auto;
    width:30px;
    height:30px;
    border-radius:50%;
    border:none;
    background:var(--gold);
    color:#241c07;
    font-size:18px;
    font-weight:700;
    line-height:1;
    padding:0;
    cursor:pointer;
  }
  .ci-add:disabled{opacity:.35;cursor:not-allowed;}
  .ci-count{
    flex:0 0 auto;
    font-size:12px;
    font-weight:700;
    color:var(--gold);
    min-width:16px;
    text-align:right;
  }
  /* A button and a list of buttons rather than a <select>, because iOS
     Safari zooms the whole page in when a form control with text under
     16px takes focus and never zooms back out -- and 16px here would
     out-shout the item name above it. Buttons don't trigger that. */
  .ci-choice{margin-top:7px;}
  .ci-choice-btn{
    width:100%;
    display:flex;
    align-items:center;
    gap:8px;
    background:#0f0f10;
    color:#fff;
    border:1px solid #2f2f2f;
    border-radius:8px;
    padding:7px 8px;
    font-size:12.5px;
    font-family:inherit;
    text-align:left;
    cursor:pointer;
  }
  .ci-choice-btn span{flex:1;min-width:0;overflow-wrap:anywhere;}
  .ci-choice-btn::after{
    content:'';
    flex:0 0 auto;
    width:6px;
    height:6px;
    border-right:1.5px solid var(--muted);
    border-bottom:1.5px solid var(--muted);
    transform:rotate(45deg);
    margin-top:-3px;
  }
  .ci-choice-btn[aria-expanded="true"]::after{transform:rotate(-135deg);margin-top:3px;}
  /* Amber, not red: nothing is wrong yet, there's just a pick to make
     before the "+" will do anything. */
  .ci-choice-btn.needs-choice{
    border-color:var(--gold-dark);
    color:var(--gold);
  }
  .ci-choice-btn.needs-choice::after{border-color:var(--gold);}
  .ci-choice-btn:disabled{opacity:.5;cursor:not-allowed;}
  .ci-choice-list{
    margin-top:4px;
    border:1px solid #2f2f2f;
    border-radius:8px;
    overflow:hidden;
  }
  .ci-choice-opt{
    display:block;
    width:100%;
    background:#141416;
    color:#fff;
    border:none;
    border-bottom:1px solid #202023;
    padding:9px 10px;
    font-size:12.5px;
    font-family:inherit;
    text-align:left;
    cursor:pointer;
  }
  .ci-choice-opt:last-child{border-bottom:none;}

  /* ---------- ORDER LIST ---------- */
  .cart-order{
    /* Shrink, don't grow: this is the item that gives up room when the
       card runs short, which is why its min-height is 0 and the menu's
       isn't. */
    flex:0 1 auto;
    min-height:0;
    display:flex;
    flex-direction:column;
    max-height:min(168px, 24vh);
    /* Belt and braces with the inner list's own scroll: whatever the
       list does, nothing from this panel paints over the totals. */
    overflow:hidden;
    padding:0 20px;
    border-top:1px solid #2a2a2a;
  }
  .cart-order-toggle{
    flex:0 0 auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    width:100%;
    cursor:pointer;
    background:none;
    border:none;
    font-family:inherit;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--muted);
    padding:6px 0 5px;
    text-align:left;
  }
  .cart-order-toggle::before{
    content:'\25b8';
    display:inline-block;
    margin-right:5px;
    transition:transform .15s;
  }
  .cart-order:not(.is-collapsed) .cart-order-toggle::before{transform:rotate(90deg);}
  .cart-order-toggle span:first-of-type{flex:1;}
  .cart-order.is-collapsed .cart-order-list{display:none;}
  .cart-order-count{
    flex:0 0 auto;
    text-transform:none;
    letter-spacing:0;
    font-size:11.5px;
    color:var(--gold);
  }
  /* Capped in px as well as vh so the footer's height is predictable on a
     short phone, where vh alone still left the menu with a few rows. Past
     the cap this list scrolls inside itself; collapsing it gives the whole
     card back to the menu. */
  .cart-order-list{
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding-bottom:6px;
  }
  .cart-pay-row{display:flex;gap:8px;}
  .cart-pay-links{flex:2 1 0;min-width:0;display:flex;gap:8px;}
  .cart-pay-links a{flex:1 1 0;min-width:0;font-size:13px;}
  /* Beats both `.claim-actions button`'s full width and the stacked
     layout's margin-top below. */
  .cart-pay-row .mark-paid-btn{flex:1 1 0;min-width:0;width:auto;margin-top:0;font-size:13px;}
  .order-row{
    display:flex;
    align-items:baseline;
    gap:8px;
    padding:4px 0;
    font-size:13px;
  }
  .order-main{flex:1;min-width:0;overflow-wrap:anywhere;}
  .order-name{color:#fff;}
  .order-option{color:var(--gold);}
  .order-option.is-missing{color:#e2857a;}
  .order-line-note{color:var(--muted);font-size:11.5px;}
  .order-price{flex:0 0 auto;color:var(--muted);font-size:12px;}
  .order-remove{
    flex:0 0 auto;
    width:22px;
    height:22px;
    border-radius:50%;
    border:1px solid #3a3a3a;
    background:#1e1e1e;
    color:var(--muted);
    font-size:14px;
    line-height:1;
    padding:0;
    cursor:pointer;
  }
  .order-remove:disabled{opacity:.35;cursor:not-allowed;}
  /* Amber rather than red: nothing is broken, there's just a pick still
     owed before this will save. */
  .cart-hint{
    background:#241c07;
    border:1px solid var(--gold-dark);
    color:#f0dda9;
    border-radius:8px;
    padding:7px 10px;
    font-size:11.5px;
    margin-bottom:10px;
    overflow-wrap:anywhere;
  }
  .cart-totals{
    font-size:13px;
    color:#ddd;
    margin-bottom:12px;
  }
  .cart-total-row{
    display:flex;
    justify-content:space-between;
    gap:12px;
    padding:2px 0;
  }
  .cart-total-row.is-owed{
    font-size:15px;
    font-weight:700;
    color:#fff;
    border-top:1px solid #2a2a2a;
    margin-top:6px;
    padding-top:7px;
  }
  .cart-total-row .paid-note{color:var(--green);}
  /* "paid" is a claim, not a fact -- nothing tells this app a Venmo
     payment landed -- so whoever made the claim has to be able to take it
     back. Small and quiet: it's there for a mis-tap, not a decision. */
  .cart-total-row .paid-undo{
    background:none;
    border:none;
    color:var(--muted);
    font-family:inherit;
    font-size:11px;
    text-decoration:underline;
    padding:0 0 0 8px;
    cursor:pointer;
  }
  .cart-total-row .paid-undo:hover{color:#fff;}
  .cart-total-row.is-settled{
    font-size:14px;
    font-weight:700;
    color:var(--green);
    border-top:1px solid #2a2a2a;
    margin-top:6px;
    padding-top:7px;
  }
  /* Full width under the pay links, and outlined rather than filled: it
     sits below two payment buttons and shouldn't compete with them for
     the tap. It's what you press after paying, not instead of. */
  .mark-paid-btn{
    width:100%;
    background:none;
    color:var(--green);
    border:1px solid #2f5b3a;
    border-radius:12px;
    padding:10px;
    font-family:inherit;
    font-size:13px;
    font-weight:700;
    margin-top:8px;
    cursor:pointer;
  }
  .mark-paid-btn:hover{background:#15251a;}
  .mark-paid-btn:disabled{opacity:.5;cursor:not-allowed;}
  .food-pending{
    color:var(--muted);
    font-size:11.5px;
    line-height:1.4;
    margin-top:8px;
  }
  /* A section used to be a hairline rule and some bold white text, which
     read as just another item row -- the headers were easy to scroll
     straight past. Now each one is a card of its own: its own border,
     its own darker ground, and clear air above and below. */
  /* Square, not rounded. A rounded card whose header is a separately
     rounded box never quite nests -- the two radii (12 and 11) left a
     hairline halo in every corner -- and the header's rule and the rows'
     rules were inset differently, so none of the lines agreed. Square
     corners and one inset make every hairline span the same width. */
  .cart-section{
    margin:12px 0;
    border:1px solid #26262a;
    background:#101012;
  }
  .cart-section summary{
    /* Sticks to the top of the scrolling menu while its own section is
       open, so "which list am I in" is answerable without scrolling back
       up -- the point where a 25-row section is most confusing is in the
       middle of it. */
    position:sticky;
    top:0;
    z-index:2;
    /* Paints its own colour upward past the pin point. The scroller clips
       it at the top edge, so this costs nothing visually but guarantees
       no strip of item row can show above the header -- browsers don't
       agree on exactly where `top: 0` lands, and on iOS the gap was wider
       than the padding alone accounts for. */
    box-shadow:0 -14px 0 0 #1a1a1e;
    display:flex;
    align-items:center;
    gap:9px;
    padding:11px 12px;
    background:#1a1a1e;
    font-size:11.5px;
    font-weight:800;
    letter-spacing:.09em;
    text-transform:uppercase;
    /* Gold, not white: nothing else in this list is gold except the "+"
       buttons, so a header can't be mistaken for an item's name. */
    color:var(--gold);
    cursor:pointer;
    list-style:none;
    user-select:none;
  }
  .cart-section summary::-webkit-details-marker{display:none;}
  .cart-section[open] summary{
    border-bottom:1px solid #26262a;
  }
  /* A real chevron rather than a 5px triangle, and in the accent colour
     so it reads as a control. */
  .cart-section summary::before{
    content:'';
    flex:0 0 auto;
    width:7px;
    height:7px;
    border-right:2px solid var(--gold);
    border-bottom:2px solid var(--gold);
    transform:rotate(-45deg);
    margin-left:2px;
    margin-right:1px;
    transition:transform .15s;
  }
  .cart-section[open] summary::before{transform:rotate(45deg);margin-top:-3px;}
  /* The label sits between the chevron and the count, so it gets the slack. */
  .cart-section summary span:first-of-type{flex:1;}
  /* Plain text, not a chip: it's a footnote on the header, and a bordered
     pill on every section was more furniture than the number deserves.
     Colour alone carries the "something in here is ordered" state. */
  .cart-section-count{
    flex:0 0 auto;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.02em;
    text-transform:none;
    color:var(--muted);
  }
  .cart-section-count.has-order{color:var(--gold);}
  /* No padding on the wrapper: the rows carry their own, so each row's
     rule runs the full width of the section the way the header's does,
     instead of stopping 10px short at both ends. */
  .cart-section-body{padding:0;}
  /* Indented so a row inside a section reads as belonging to the header
     above it rather than as another top-level item. */
  .cart-section-body .cart-item{padding:9px 12px;}
  .cart-section-body .cart-item:last-child{border-bottom:none;}
  .cart-empty-menu{
    color:var(--muted);
    font-size:13px;
    padding:18px 0;
    text-align:center;
  }
  .cart-locked{
    background:#241c07;
    border:1px solid var(--gold-dark);
    color:#f0dda9;
    border-radius:8px;
    padding:8px 10px;
    font-size:12px;
    margin-bottom:10px;
  }
  /* Unlike the claim overlay's error line, this one doesn't reserve a
     blank row: the cart head already carries a title, a subtitle and
     (sometimes) the closed-orders banner, and two more empty reserved
     lines under them push the first item off a short screen. Errors here
     are rare enough that the shift when one appears is the better trade. */
  .cart-head .claim-error{min-height:0;}
  /* No reserved height any more -- it shares the seat's line, so an empty
     status costs nothing instead of holding a gap open above the menu. */
  .cart-status{

  }

</style>
</head>
<body>
