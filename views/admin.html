<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Showtime Seat Blocks</title>
<!-- OG_META -->
<style>
  :root{
    --gold:#c9a24b;
    --gold-dark:#8a712f;
    --red:#e2333d;
    --green:#2ecc71;
    --green-dark:#1f9d57;
    --info-blue:#4da6ff;
    --outside-bg:#5c5228;
    --outside-dark:#453d1e;
    --outside-text:#cfc48f;
    --bg:#0b0b0d;
    --muted:#9a9a9a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:#fff;
    font-family:-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    padding-bottom:40px;
  }
  .hidden{display:none !important;}

  /* Everything here is laid out mobile-first (full-bleed, no width cap),
     which on a desktop window stretches every card, header and form row
     across the whole screen. Cap the content column and center it so a
     wide window just gets margins instead of 2000px-wide cards. The
     full-screen overlays are deliberately not in here -- they're
     position:fixed against the viewport and cap their own cards.

     880, not a rounder 800: the widest seat map (IMAX, 34 seats at
     22px + 2px gap, plus .seatmap's 16px side padding) needs ~846px,
     and anything narrower puts each row's last seat behind a
     horizontal scroll on desktop. Narrow this and check the IMAX
     picker before assuming it's only a prose-width knob. */
  .view{
    max-width:880px;
    margin:0 auto;
  }

  /* ---------- TOP BAR ---------- */
  .topbar-head{
    padding:24px 20px 6px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .topbar h1{
    font-size:26px;
    margin:0;
  }
  .tabs{
    display:flex;
    gap:4px;
    padding:6px 16px 0;
    border-bottom:1px solid #2a2a2a;
  }
  .tabs a{
    color:var(--muted);
    text-decoration:none;
    font-size:14px;
    font-weight:600;
    padding:10px 12px;
    border-bottom:2px solid transparent;
    margin-bottom:-1px;
  }
  .tabs a.active{color:#fff;border-bottom-color:var(--gold);}
  .site-logo{
    display:block;
    max-height:40px;
    max-width:100%;
    width:auto;
    height:auto;
    margin:0 0 10px;
  }
  .logout-link{
    color:var(--muted);
    font-size:12px;
    cursor:pointer;
    text-decoration:underline;
    white-space:nowrap;
    margin-top:4px;
  }
  .new-btn-wrap{
    padding:14px 20px 6px;
  }
  .new-btn{
    width:100%;
    background:var(--gold);
    color:#241c07;
    border:none;
    border-radius:12px;
    padding:14px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
  }
  .add-movie{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    align-items:center;
  }
  .add-movie input{
    flex:1 1 200px;
    min-width:0;
    background:#0f0f10;
    color:#fff;
    border:1px solid #3a3a3a;
    border-radius:10px;
    padding:11px 12px;
    font-size:16px;
  }
  .add-movie .add-movie-go{background:var(--gold);color:#241c07;border:none;font-weight:700;}
  .add-movie .og-status{flex-basis:100%;margin-top:0;}

  /* ---------- MOVIE GRID ---------- */
  /* Same tile as the friend page's grid (views/public.html), so a movie
     looks the same on both sides. */
  .movie-grid{
    padding:14px 20px 20px;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));
    gap:16px 12px;
  }
  .movie-grid .empty-state, .movie-grid .loading-state{grid-column:1 / -1;}
  .movie-tile{
    display:block;
    width:100%;
    background:none;
    border:none;
    border-radius:10px;
    padding:0;
    color:inherit;
    font:inherit;
    text-align:left;
    cursor:pointer;
  }
  .movie-tile:hover{background:none;}
  .movie-tile:focus-visible{outline:2px solid var(--gold);outline-offset:3px;}
  .tile-poster{
    aspect-ratio:2 / 3;
    border-radius:10px;
    overflow:hidden;
    background:#0f0f10;
    border:1px solid #2a2a2a;
    margin-bottom:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:10px;
  }
  .tile-poster.has-img{padding:0;border-color:transparent;background:#000;}
  .tile-poster img{width:100%;height:100%;object-fit:cover;display:block;}
  .tile-poster-fallback{color:var(--muted);font-size:15px;font-weight:700;text-align:center;line-height:1.25;}
  .movie-tile:hover .tile-poster{border-color:#3a3a3a;}
  .tile-title{font-size:15px;font-weight:700;line-height:1.25;margin-bottom:3px;}
  .tile-sub{color:#ccc;font-size:12.5px;line-height:1.35;}

  /* ---------- ONE MOVIE ---------- */
  .movie-sub{
    margin-top:6px;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:6px;
    color:#ccc;
    font-size:14px;
  }
  .link-btn{
    position:relative;
    color:var(--gold);
    cursor:pointer;
  }
  .link-btn input{position:absolute;inset:0;width:100%;opacity:0;cursor:pointer;}
  .movie-sub-status{color:var(--muted);font-size:12px;}
  .movie-password{
    margin-top:12px;
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .movie-password label{color:#ccc;font-size:14px;}
  .movie-password input{
    flex:1 1 160px;
    min-width:0;
    max-width:260px;
    background:#0f0f10;
    color:#fff;
    border:1px solid #3a3a3a;
    border-radius:10px;
    padding:8px 10px;
    font-size:16px;
  }
  .movie-password input:placeholder-shown{border-color:#7a2a2f;}
  .movie-password-note{color:var(--muted);font-size:11.5px;margin-top:6px;}
  .tile-warn{color:#e2857a;font-size:12px;margin-top:2px;}
  .people-list{padding:14px 20px 20px;display:flex;flex-direction:column;gap:10px;}
  .person-row{
    display:flex;
    align-items:flex-start;
    gap:12px;
    background:#151517;
    border:1px solid #2a2a2a;
    border-radius:14px;
    padding:12px;
  }
  .person-photo{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#2a2a2a;flex:0 0 auto;}
  .person-main{flex:1;min-width:0;}
  .person-name{font-weight:700;font-size:15px;}
  .host-tag{
    display:inline-block;
    margin-left:8px;
    vertical-align:2px;
    font-size:11px;
    font-weight:700;
    color:#241c07;
    background:var(--gold);
    border-radius:8px;
    padding:1px 7px;
  }
  .people-host-note{
    color:#f0dda9;
    font-size:13px;
    line-height:1.4;
    background:#1f1a0e;
    border:1px solid #4a3c1a;
    border-radius:10px;
    padding:10px 12px;
  }
  .person-meta{color:var(--muted);font-size:12.5px;margin-top:2px;overflow-wrap:anywhere;}
  .person-edit{margin-top:10px;}
  .person-edit-row{display:flex;gap:8px;margin-bottom:8px;}
  .person-edit-row input{
    flex:1;
    min-width:0;
    background:#0f0f10;
    color:#fff;
    border:1px solid #3a3a3a;
    border-radius:10px;
    padding:8px 10px;
    font-size:16px;
  }
  .person-edit-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .pe-open{flex:0 0 auto;}
  /* Only takes room when it has something to say (a rename's result). */
  #movieTitleStatus{min-height:0;margin-top:4px;}
  #movieTitleStatus:empty{display:none;}
  .danger-zone{padding:10px 20px 0;}

  .past-section{
    margin:6px 20px 6px;
  }
  .past-section summary{
    cursor:pointer;
    color:var(--muted);
    font-size:14px;
    font-weight:600;
    padding:10px 0;
    list-style:none;
  }
  .past-section summary::-webkit-details-marker{display:none;}
  .past-section summary::before{
    content:'▸';
    display:inline-block;
    margin-right:6px;
    transition:transform .15s;
  }
  .past-section[open] summary::before{transform:rotate(90deg);}
  .past-section .cards{padding:6px 0 0;}
  .past-section .movie-grid{padding:6px 0 0;}
  .og-section{
    margin:14px 20px 6px;
    padding:14px 16px;
    background:#151517;
    border:1px solid #2a2a2a;
    border-radius:14px;
  }
  .og-section h3{
    margin:0 0 4px;
    font-size:15px;
  }
  .og-section p{
    margin:0 0 12px;
    color:var(--muted);
    font-size:12px;
  }
  .og-preview{
    display:block;
    max-width:100%;
    max-height:160px;
    border-radius:8px;
    margin-bottom:12px;
    border:1px solid #2a2a2a;
  }
  .og-controls{
    display:flex;
    gap:10px;
    align-items:center;
    flex-wrap:wrap;
  }
  .og-controls input[type="file"]{
    flex:1;
    min-width:0;
    color:#ccc;
    font-size:12px;
  }
  .og-controls input[type="text"]{
    flex:1;
    min-width:0;
    background:#0f0f10;
    color:#fff;
    border:1px solid #3a3a3a;
    border-radius:10px;
    padding:8px 10px;
    font-size:13px;
  }
  .og-status{
    font-size:12px;
    color:var(--muted);
    margin-top:8px;
    min-height:16px;
  }
  .cards{
    padding:14px 20px 20px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .card{
    background:#151517;
    border:1px solid #2a2a2a;
    border-radius:14px;
    padding:14px 16px;
  }
  /* Poster + title/info/seat-count column, side by side; the claimed-
     seat names and Open/Delete buttons below stay full-width (not part
     of this row). */
  .card.is-link{cursor:pointer;}
  .card.is-link:hover{border-color:#3a3a3a;}
  .card.is-link:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .card-body{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .card-body + .claimed-list{margin-top:10px;}
  .card-chevron{
    flex:0 0 auto;
    width:8px;
    height:8px;
    border-right:2px solid var(--muted);
    border-top:2px solid var(--muted);
    transform:rotate(45deg);
    margin-right:4px;
  }
  .card-info{flex:1;min-width:0;}
  /* Same box whether or not this title has a poster yet, so every
     card's title/info column starts at the same x regardless. */
  .poster-thumb{
    flex:0 0 auto;
    width:60px;
    height:90px;
    border-radius:8px;
    overflow:hidden;
    background:#000;
  }
  .poster-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .poster-thumb.poster-placeholder{background:#0f0f10;border:1px solid #2a2a2a;}
  .card h3{
    margin:0 0 4px;
    font-size:18px;
  }
  /* Date + time get their own row directly under the title -- it's what
     you actually scan a list of showtimes for, so it shouldn't be buried
     mid-way through a pipe-separated run of theater/format/price.
     Bigger and bolder than .meta, but deliberately the same secondary
     #ccc: size and weight carry the emphasis, not brightness, so it
     stays clearly below the white title in the hierarchy. */
  .card .when{
    color:#ccc;
    font-size:15px;
    font-weight:700;
    line-height:1.3;
    margin-bottom:5px;
  }
  .card .meta{
    color:#ccc;
    font-size:13px;
    line-height:1.4;
    /* No min-height here anymore. It used to reserve 2 lines so a short
       info column couldn't come out shorter than the poster's fixed
       90px; the .when row above now supplies that height on its own, and
       reserving it twice just left a blank gap under a one-line meta. */
    margin-bottom:6px;
  }
  .card .seats-avail-line{
    font-size:14px;
    font-weight:700;
    margin-bottom:6px;
  }
  .card .seats-avail-green{color:var(--green);}
  .card .seats-avail-red{color:var(--red);}
  .card .seats-empty{color:var(--muted);font-size:13px;}
  .card .seat-line{
    font-size:13px;
    color:#ddd;
    margin-bottom:3px;
  }
  .card .seat-line b{color:var(--gold);}
  .card .seat-line .seat-id{color:var(--muted);font-size:11px;}
  .card .seat-line .paid-tag{color:var(--green);font-size:11px;margin-left:6px;}
  .card .seat-line .unpaid-tag{color:#e2857a;font-size:11px;margin-left:6px;}
  .card-actions{
    display:flex;
    gap:10px;
  }
  .card-actions button{
    flex:1;
  }
  .empty-state, .loading-state{
    padding:40px 20px;
    text-align:center;
    color:var(--muted);
    font-size:14px;
  }

  /* ---------- EDITOR VIEW ---------- */
  .header{
    padding:20px 20px 14px;
  }
  .top-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .back-btn{
    font-size:22px;
    color:#fff;
    cursor:pointer;
    opacity:.85;
    padding:4px 8px 4px 0;
  }
  .title{
    font-size:26px;
    font-weight:800;
    line-height:1.15;
    outline:none;
    flex:1;
    background:transparent;
    border:none;
    color:#fff;
    font-family:inherit;
    padding:0;
    min-width:0;
  }
  .title:hover, .title:focus{background:rgba(255,255,255,0.06);}
  .editor-title{
    font-size:24px;
    font-weight:800;
    line-height:1.15;
    flex:1;
    min-width:0;
  }
  .subtitle{
    margin-top:10px;
    color:#e8e8e8;
    font-size:15px;
    line-height:1.5;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:6px;
  }
  .subtitle input.theater{width:9.5em;}
  .sep{color:#777;}
  .subtitle input, .subtitle select{
    background:transparent;
    color:#e8e8e8;
    border:none;
    border-bottom:1px solid #555;
    font-size:15px;
    font-family:inherit;
    padding:2px 2px;
  }
  .subtitle select{
    -webkit-appearance:none;
    appearance:none;
    padding-right:16px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0 L5 6 L10 0 Z' fill='%23aaa'/></svg>");
    background-repeat:no-repeat;
    background-position:right center;
  }
  .subtitle select option{background:#111;color:#fff;}
  .subtitle input::-webkit-calendar-picker-indicator{filter:invert(1);}
  .price-field{display:inline-flex;align-items:center;gap:2px;}
  #price{width:64px;}
  .info-row{margin-top:10px;}
  #showInfo{
    width:100%;
    max-width:360px;
    background:transparent;
    color:#e8e8e8;
    border:none;
    border-bottom:1px solid #555;
    font-size:15px;
    font-family:inherit;
    padding:2px 2px;
  }
  #showInfo::placeholder{color:#666;}
  .card .showtime-info{
    color:var(--info-blue);
    font-size:14px;
    font-weight:700;
    margin-bottom:4px;
  }
  .price-quick{
    margin-top:8px;
    display:flex;
    gap:8px;
    align-items:center;
  }
  .price-quick span{color:var(--muted);font-size:11px;}
  .quick-price-btn{
    padding:4px 10px;
    font-size:12px;
    border-radius:14px;
  }
  .edit-hint{
    color:var(--muted);
    font-size:11px;
    margin-top:6px;
  }
  /* screen-wrap is now a flex item inside .seatmap itself (built in JS,
     one per render) so it scrolls horizontally in lock-step with the
     seat rows instead of staying fixed while they scroll underneath it.
     Its width gets set explicitly in JS to match the widest row, so the
     arc's peak and the word "SCREEN" line up with the actual center of
     the seat block rather than a fixed 900px guess. */
  .screen-wrap{padding:0 0 10px;text-align:center;flex:0 0 auto;}
  .screen-curve{display:block;width:100%;height:26px;}
  .screen-label{color:#ccc;font-size:11px;letter-spacing:3px;margin-top:2px;}
  .seatmap{
    display:flex;
    flex-direction:column;
    /* Flush-left, not centered -- `align-items:safe center` (the
       previous approach) silently falls back to flex-start on browsers
       that don't support the `safe` keyword (confirmed: Mobile Safari),
       so different rows ended up genuinely centered in some browsers
       and flush-left in others, with row A's alignment fix computed
       for the wrong one. Flush-left is unambiguous everywhere -- row
       A's own padStart (see seat-layout.js) is what actually aligns it
       now, not a browser's cross-axis alignment support. */
    align-items:flex-start;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    padding:6px 16px 10px;
  }
  .row{
    display:flex;
    justify-content:flex-start;
    gap:2px;
    margin:2px 0;
    width:max-content;
  }
  /* Stadium-style rooms with a few flat rows up front (e.g. Dolby's A-C)
     get extra breathing room here before the raised rows start -- no
     divider line, just space. */
  .row.row-gap-after{
    margin-bottom:24px;
  }
  .seat{
    position:relative;
    width:22px;
    height:20px;
    border-radius:4px;
    background:var(--outside-bg);
    border:1px solid var(--outside-dark);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:7px;
    color:var(--outside-text);
    font-weight:700;
    cursor:pointer;
    user-select:none;
    flex:0 0 auto;
  }
  .seat.in-block{background:var(--green);border-color:var(--green-dark);color:#06331a;}
  .seat.claimed{background:var(--red);border-color:#8f1319;color:#fff;}
  /* A wheelchair space is just the icon -- no seat box at all, so it
     doesn't read as a seat you'd claim the way a companion seat is. A
     companion seat keeps the normal seat box (same shape/coloring as
     any other seat, state colors included) and just swaps its number
     for the icon. Comes after the state rules above so it wins the tie
     (same specificity, later wins) on wc's own state classes. */
  .seat.wc{background:none;border:none;}
  /* Blank spacer -- see seat-layout.js's `padStart`. Same box size as a
     real seat (so it takes up exactly one column) but otherwise nothing:
     no border, no background, not part of the tap/hover behavior. */
  .seat-filler{width:22px;height:20px;flex:0 0 auto;}
  .seat.claimed.paid::after{
    content:'';
    position:absolute;
    top:-2px;
    right:-2px;
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--green);
    border:1px solid #0b0b0d;
  }
  /* Custom hover tooltip (seat number + assignment), bigger and more
     legible than the browser's native title-attribute tooltip. */
  .seat:hover::before{
    content:attr(data-tooltip);
    position:absolute;
    bottom:130%;
    left:50%;
    transform:translateX(-50%);
    background:#000;
    color:#fff;
    padding:4px 8px;
    border-radius:6px;
    font-size:12px;
    font-weight:400;
    white-space:nowrap;
    z-index:20;
    pointer-events:none;
    border:1px solid #444;
  }
  .legend{
    margin-top:20px;
    padding:14px 20px;
    border-top:1px solid #2a2a2a;
    display:flex;
    flex-wrap:wrap;
    gap:18px;
    font-size:13px;
    color:#ddd;
  }
  .legend-item{display:flex;align-items:center;gap:8px;}
  .legend-swatch{width:18px;height:18px;border-radius:4px;display:inline-block;position:relative;}
  .sw-avail{background:var(--outside-bg);border:1px solid var(--outside-dark);}
  .sw-inblock{background:var(--green);border:1px solid var(--green-dark);}
  .sw-claimed{background:var(--red);}
  .sw-paid-dot{
    position:absolute;top:-2px;right:-2px;width:6px;height:6px;border-radius:50%;
    background:var(--green);border:1px solid #0b0b0d;
  }
  .summary{padding:16px 20px 4px;font-size:14px;color:#fff;}
  .summary b{color:var(--gold);}
  .summary-line{margin-top:4px;}
  button{
    background:#1e1e1e;
    color:#fff;
    border:1px solid #3a3a3a;
    border-radius:20px;
    padding:8px 16px;
    font-size:13px;
    cursor:pointer;
  }
  button:hover{background:#2a2a2a;}
  .toolbar-note{
    color:var(--muted);
    font-size:11.5px;
    padding:0 20px 10px;
  }
  .editor-actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    padding:16px 20px 8px;
  }
  .delete-btn{
    background:#2a1616;
    border:1px solid #5a2323;
    color:#e2857a;
  }
  .delete-btn:hover{background:#3a1c1c;}
  /* Says whether the editor's changes have reached the server. Fixed at
     the bottom so it's on screen wherever the seat map is scrolled to.
     A failed save turns it red and makes it the retry button. */
  .save-pill{
    position:fixed;
    left:50%;
    bottom:calc(16px + env(safe-area-inset-bottom));
    transform:translateX(-50%);
    z-index:40;
    background:#1b1b1e;
    border:1px solid #333;
    color:#ccc;
    font-size:12.5px;
    border-radius:20px;
    padding:7px 14px;
    box-shadow:0 4px 16px rgba(0,0,0,.4);
    cursor:default;
  }
  .save-pill:hover{background:#1b1b1e;}
  .save-pill.is-saved{color:var(--green);}
  .save-pill.is-error{background:#3a1416;border-color:#7a2a2f;color:#ffb3ad;cursor:pointer;}

  /* ---------- SEAT EDITOR OVERLAY ---------- */
  .seat-editor-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:50;
  }
  .seat-editor-card{
    width:100%;
    max-width:320px;
    background:#151517;
    border:1px solid #2a2a2a;
    border-radius:14px;
    padding:20px;
  }
  .seat-editor-title{
    font-size:17px;
    font-weight:700;
    margin-bottom:14px;
  }
  .se-field{
    display:block;
    margin-bottom:14px;
  }
  .se-field span{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin-bottom:6px;
  }
  .se-field input[type="text"]{
    width:100%;
    background:#0f0f10;
    color:#fff;
    border:1px solid #3a3a3a;
    border-radius:10px;
    padding:10px 12px;
    font-size:15px;
  }
  .se-checkbox{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:16px;
    font-size:14px;
  }
  .se-checkbox input{width:16px;height:16px;}
  .seat-editor-actions{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .seat-editor-actions button{
    width:100%;
    padding:10px;
  }
  .se-save-btn{
    background:var(--gold);
    color:#241c07;
    border:none;
    font-weight:700;
  }
  .se-danger-btn{
    background:#2a1616;
    border:1px solid #5a2323;
    color:#e2857a;
  }

  /* ---------- CONCESSIONS ---------- */
  /* One editable row per menu item: name, price, remove. Wraps to two
     lines on a phone rather than squeezing a $-field down to nothing. */
  /* Two lines per item: name/price/remove on top, note and the option
     group underneath. Five controls on one line is unreadable at phone
     width, and the second line is the less-used half. */
  .menu-row{
    margin-bottom:12px;
    padding-bottom:12px;
    border-bottom:1px solid #202023;
  }
  .menu-row:last-child{border-bottom:none;}
  .menu-row-top, .menu-row-bottom{
    display:flex;
    gap:8px;
    align-items:center;
    flex-wrap:wrap;
  }
  .menu-row-bottom{margin-top:7px;}
  .menu-row input.menu-note{
    flex:1 1 160px;
    min-width:0;
    background:#0f0f10;
    color:#ccc;
    border:1px solid #2f2f2f;
    border-radius:10px;
    padding:6px 10px;
    font-size:12px;
  }
  .menu-row select.menu-group{
    flex:0 0 auto;
    background:#0f0f10;
    color:#ccc;
    border:1px solid #2f2f2f;
    border-radius:10px;
    padding:6px 8px;
    font-size:12px;
    font-family:inherit;
    max-width:48%;
  }
  .menu-row input.menu-section-input{
    flex:0 1 96px;
    min-width:70px;
    background:#0f0f10;
    color:#ccc;
    border:1px solid #2f2f2f;
    border-radius:10px;
    padding:6px 10px;
    font-size:12px;
  }
  /* Same treatment as the reservation page's cart, so a section reads
     the same way on both sides: its own card, a gold uppercase label
     nothing else in the list uses, and the count as a badge. */
  /* Square for the same reason as the cart's sections -- see the comment
     on .cart-section in views/public.html. */
  .menu-section{
    border:1px solid #26262a;
    background:#101012;
    margin:12px 0;
  }
  .menu-section summary{
    display:flex;
    align-items:center;
    gap:9px;
    cursor:pointer;
    background:#1a1a1e;
    color:var(--gold);
    font-size:11.5px;
    font-weight:800;
    letter-spacing:.09em;
    text-transform:uppercase;
    padding:10px 12px;
    list-style:none;
    user-select:none;
  }
  .menu-section summary::-webkit-details-marker{display:none;}
  .menu-section[open] summary{
    border-bottom:1px solid #26262a;
  }
  .menu-section summary::before{
    content:'';
    flex:0 0 auto;
    width:7px;
    height:7px;
    border-right:2px solid var(--gold);
    border-bottom:2px solid var(--gold);
    transform:rotate(-45deg);
    margin-left:2px;
    transition:transform .15s;
  }
  .menu-section[open] summary::before{transform:rotate(45deg);margin-top:-3px;}
  .menu-section summary span:first-of-type{flex:1;}
  /* Plain text, matching the cart -- a bordered chip on every section
     was more furniture than the number deserves. */
  .menu-section-count{
    flex:0 0 auto;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.02em;
    text-transform:none;
    color:var(--muted);
  }
  /* Padding rather than margins, so each row's rule runs the full width
     of the section the way the header's does instead of stopping short
     at both ends. */
  .menu-section > .menu-row{margin:0;padding:12px;}
  .menu-section .menu-row:last-child{border-bottom:none;}
  .group-row{
    margin-bottom:12px;
    padding-bottom:12px;
    border-bottom:1px solid #202023;
  }
  .group-row:last-child{border-bottom:none;}
  .group-row-top{
    display:flex;
    gap:8px;
    align-items:center;
    margin-bottom:7px;
  }
  .group-row input.group-label{
    flex:1 1 140px;
    min-width:0;
    background:#0f0f10;
    color:#fff;
    border:1px solid #3a3a3a;
    border-radius:10px;
    padding:8px 10px;
    font-size:13px;
  }
  .group-used{
    flex:0 0 auto;
    font-size:11px;
    color:var(--muted);
    white-space:nowrap;
  }
  .option-box{
    width:100%;
    background:#0f0f10;
    color:#fff;
    border:1px solid #2f2f2f;
    border-radius:10px;
    padding:8px 10px;
    font-size:12.5px;
    font-family:inherit;
    line-height:1.5;
    min-height:88px;
    resize:vertical;
  }
  .menu-subhead{
    margin:16px 0 4px;
    font-size:13px;
    color:#fff;
    font-weight:700;
  }
  .menu-subnote{
    color:var(--muted);
    font-size:12px;
    margin:0 0 8px;
  }
  .menu-row input.menu-name{
    flex:1 1 160px;
    min-width:0;
    background:#0f0f10;
    color:#fff;
    border:1px solid #3a3a3a;
    border-radius:10px;
    padding:8px 10px;
    font-size:13px;
  }
  .menu-price-wrap{
    display:flex;
    align-items:center;
    gap:4px;
    color:var(--muted);
    font-size:13px;
  }
  .menu-row input.menu-price{
    width:84px;
    background:#0f0f10;
    color:#fff;
    border:1px solid #3a3a3a;
    border-radius:10px;
    padding:8px 10px;
    font-size:13px;
  }
  .menu-remove-btn{
    padding:6px 12px;
    font-size:12px;
    background:#2a1616;
    border:1px solid #5a2323;
    color:#e2857a;
  }
  .menu-empty{
    color:var(--muted);
    font-size:12px;
    margin-bottom:10px;
  }
  /* Concession orders, on the list card and in the editor. */
  .card .concession-line{
    color:var(--muted);
    font-size:11.5px;
    margin:-1px 0 5px 0;
    overflow-wrap:anywhere;
  }
  .orders{
    padding:6px 20px 4px;
    font-size:13px;
    color:#ddd;
  }
  .orders h4{
    margin:12px 0 6px;
    font-size:13px;
    color:#fff;
  }
  .orders-empty{color:var(--muted);font-size:12.5px;}
  .orders-close{
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
    padding:8px 20px 4px;
  }
  .orders-close button{
    flex:0 0 auto;
    background:none;
    color:#e2857a;
    border:1px solid #5a2b2b;
    border-radius:10px;
    padding:8px 14px;
    font-family:inherit;
    font-size:12.5px;
    font-weight:700;
    cursor:pointer;
  }
  .orders-close button:hover{background:#2a1618;}
  .orders-close button:disabled{opacity:.5;cursor:not-allowed;}
  /* Reopening is the recoverable direction, so it doesn't get the
     warning colour the closing one does. */
  .orders-close.is-closed button{color:var(--green);border-color:#2f5b3a;}
  .orders-close.is-closed button:hover{background:#15251a;}
  .orders-close-note{color:var(--muted);font-size:11.5px;line-height:1.4;}
  .order-line{
    margin-bottom:5px;
    line-height:1.4;
  }
  .order-line b{color:var(--gold);}
  .order-line .order-items{color:var(--muted);overflow-wrap:anywhere;}
  /* The roll-up the host actually reads at the counter: one line per
     item, summed across every seat, so it's a shopping list rather than
     a per-person receipt they'd have to add up themselves. */
  .order-rollup{
    margin-top:10px;
    padding:10px 12px;
    background:#151517;
    border:1px solid #2a2a2a;
    border-radius:12px;
  }
  .rollup-line{
    display:flex;
    justify-content:space-between;
    gap:12px;
    padding:2px 0;
  }
  /* Reads as an aside to the item list above it, not another priced
     line -- there's no dollar figure on the right, just the picks. */
  .rollup-line.is-options{
    color:var(--muted);
    font-size:12px;
    border-top:1px solid #202023;
    margin-top:5px;
    padding-top:6px;
  }
  .rollup-line.is-options span:last-child{text-align:right;overflow-wrap:anywhere;}
  .rollup-line.is-total{
    border-top:1px solid #2a2a2a;
    margin-top:6px;
    padding-top:7px;
    font-weight:700;
    color:#fff;
  }
  .se-order{
    background:#0f0f10;
    border:1px solid #2a2a2a;
    border-radius:10px;
    padding:10px 12px;
    margin-bottom:14px;
    font-size:12.5px;
    color:#ddd;
  }
  .se-order .se-order-head{
    color:var(--muted);
    font-size:11px;
    margin-bottom:5px;
  }
  .se-order .se-order-line{margin-bottom:3px;overflow-wrap:anywhere;}
  .se-order .se-order-total{color:var(--gold);margin-top:5px;font-weight:700;}
</style>
</head>
<body>

  <!-- ===================== TOP BAR (Movies / Food & Drink / Settings) ===================== -->
  <!-- Only on the three top-level screens. A movie and a showtime are
       drill-downs with a back arrow instead. -->
  <div class="topbar view" id="topbar">
    <div class="topbar-head">
      <div>
        <!-- LOGO_IMG -->
        <h1>Ticket Manager</h1>
      </div>
      <div class="logout-link" onclick="logout()">Log out</div>
    </div>
    <nav class="tabs">
      <a href="#/movies" data-tab="movies">Movies</a>
      <a href="#/menu" data-tab="menu">Food &amp; Drink</a>
      <a href="#/people" data-tab="people">People</a>
      <a href="#/settings" data-tab="settings">Settings</a>
    </nav>
  </div>

  <!-- ===================== MOVIES ===================== -->
  <div id="moviesView" class="view hidden">
    <div class="new-btn-wrap">
      <button class="new-btn" id="addMovieBtn" onclick="showAddMovie()">+ Add movie</button>
      <form class="add-movie hidden" id="addMovieForm" onsubmit="event.preventDefault(); addMovie();">
        <input type="text" id="addMovieTitle" placeholder="Movie title" autocomplete="off" maxlength="200">
        <button type="submit" class="add-movie-go">Add</button>
        <button type="button" onclick="hideAddMovie()">Cancel</button>
        <div class="og-status" id="addMovieStatus"></div>
      </form>
    </div>
    <div class="movie-grid" id="movieGrid"><div class="loading-state">Loading...</div></div>
    <details class="past-section hidden" id="pastMovies">
      <summary>Past movies (<span id="pastMovieCount">0</span>)</summary>
      <div class="movie-grid" id="pastMovieGrid"></div>
    </details>
  </div>

  <!-- ===================== ONE MOVIE ===================== -->
  <div id="movieView" class="view hidden">
    <div class="header">
      <div class="top-row">
        <div class="back-btn" onclick="goUp()">&#8592;</div>
        <!-- Renames on Enter or when you leave the field. Showtimes take
             their title from the movie, so this renames all of them. -->
        <input class="title" id="movieTitle" maxlength="200" autocomplete="off">
      </div>
      <!-- The poster shows on each showtime card below; this is where it's
           changed. Uploads as soon as a file is picked. -->
      <div class="movie-sub">
        <span id="movieShowtimeCount"></span>
        <span class="sep">&middot;</span>
        <label class="link-btn">
          <span id="moviePosterLabel">Add poster</span>
          <input type="file" id="moviePosterInput" accept="image/png,image/jpeg,image/webp,image/gif" onchange="uploadMoviePoster()">
        </label>
        <span class="movie-sub-status" id="moviePosterStatus"></span>
      </div>
      <div class="og-status" id="movieTitleStatus"></div>
      <!-- What friends type to unlock this movie, once per phone. Saves as
           you type. Shown in plain text on purpose: it's for handing out. -->
      <div class="movie-password">
        <label for="moviePassword">Password</label>
        <input type="text" id="moviePassword" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="200">
        <span class="movie-sub-status" id="moviePasswordStatus"></span>
      </div>
      <div class="movie-password-note" data-copy="admin.movies.passwordNote"></div>
    </div>
    <div class="new-btn-wrap">
      <button class="new-btn" onclick="addShowtime()">+ Add showtime</button>
    </div>
    <div class="cards" id="movieShowtimes"></div>
    <details class="past-section hidden" id="pastShowtimes">
      <summary>Past showtimes (<span id="pastShowtimeCount">0</span>)</summary>
      <div class="cards" id="pastShowtimeCards"></div>
    </details>
    <div class="danger-zone hidden" id="deleteMovieWrap">
      <button type="button" class="delete-btn" onclick="deleteMovie()">Delete movie</button>
    </div>
  </div>

  <!-- ===================== ONE SHOWTIME ===================== -->
  <!-- No Save button: every change saves as it's made. The pill at the
       bottom says whether that's happened. -->
  <div id="editorView" class="view hidden">
    <div class="header">
      <div class="top-row">
        <div class="back-btn" onclick="goUp()">&#8592;</div>
        <div class="editor-title" id="editorTitle"></div>
      </div>
      <div class="subtitle">
        <input type="text" class="theater" id="theaterField" placeholder="Theater" autocomplete="off">
        <span class="sep">|</span>
        <input type="date" id="showDate">
        <span class="sep">|</span>
        <input type="time" id="showTime">
        <span class="sep">|</span>
        <!-- Options follow the selected screen's `formats` (seat-layout.js)
             -- see syncFormatOptions(). -->
        <select id="format"></select>
        <span class="sep">|</span>
        <!-- Options populated at load time from SEAT_LAYOUTS (seat-layout.js),
             grouped by theater -- see populateScreenOptions(). -->
        <select id="screen"></select>
        <span class="sep">|</span>
        <span class="price-field">$<input type="number" id="price" step="0.01" min="0" placeholder="17.49" inputmode="decimal"></span>
      </div>
      <div class="price-quick">
        <span>Quick price:</span>
        <button type="button" class="quick-price-btn" onclick="setPrice(17.49)">$17.49</button>
        <button type="button" class="quick-price-btn" onclick="setPrice(28.99)">$28.99</button>
      </div>
      <!-- Optional note shown to friends on this showtime's card. The
           datalist offers every note already used, so "Japanese Spoken"
           is typed once. -->
      <div class="info-row">
        <input type="text" id="showInfo" list="infoSuggestions" maxlength="120" autocomplete="off"
               placeholder="Showtime info (optional)">
        <datalist id="infoSuggestions"></datalist>
      </div>
    </div>

    <div class="seatmap" id="seatmap"></div>

    <div class="summary" id="summary">Your seats: <b>none</b></div>

    <!-- What friends have ordered for this showtime, per seat plus a
         summed shopping list. -->
    <div class="orders" id="orders"></div>

    <!-- Finalizing is the switch that stops friends changing their
         orders. Sits under the roll-up because that's the list you're
         reading when you decide you're done and about to go buy it. -->
    <div class="orders-close hidden" id="ordersCloseBar">
      <button type="button" id="ordersCloseBtn" onclick="toggleOrdersClosed()">Finalize Order</button>
      <span class="orders-close-note" id="ordersCloseNote"></span>
    </div>

    <div class="toolbar-note" data-copy="admin.seatGrid.help"></div>

    <div class="legend">
      <div class="legend-item"><span class="legend-swatch sw-avail"></span> <span data-copy="admin.seatGrid.legendNotOurs"></span></div>
      <div class="legend-item"><span class="legend-swatch sw-inblock"></span> <span data-copy="admin.seatGrid.legendAvailable"></span></div>
      <div class="legend-item"><span class="legend-swatch sw-claimed"></span> <span data-copy="admin.seatGrid.legendClaimed"></span></div>
      <div class="legend-item"><span class="legend-swatch sw-claimed"><span class="sw-paid-dot"></span></span> <span data-copy="admin.seatGrid.legendPaid" data-copy-html></span></div>
    </div>

    <div class="editor-actions">
      <button type="button" onclick="duplicateShowtime()">Duplicate showtime</button>
      <button type="button" class="delete-btn" onclick="deleteShowtime()">Delete showtime</button>
    </div>
  </div>

  <!-- ===================== MENU ===================== -->
  <div id="menuView" class="view hidden">
    <div class="og-section">
      <h3>Concessions Menu</h3>
      <p data-copy="admin.menuEditor.blurb"></p>
      <div id="menuRows"></div>
      <!-- Every section name already in use, so filing an item under one
           is a pick rather than a retype (sections match on exact text). -->
      <datalist id="sectionSuggestions"></datalist>
      <div class="og-controls">
        <button type="button" onclick="addMenuRow()">+ Add item</button>
      </div>

      <div class="menu-subhead">Option groups</div>
      <p class="menu-subnote" data-copy="admin.menuEditor.groupsBlurb"></p>
      <div id="groupRows"></div>
      <div class="og-controls">
        <button type="button" onclick="addOptionGroup()">+ Add group</button>
      </div>

      <div class="og-controls" style="margin-top:10px;">
        <button type="button" onclick="saveConcessionMenu()">Save menu</button>
        <button type="button" id="menuResetBtn" class="hidden" onclick="resetConcessionMenu()">Restore AMC menu</button>
      </div>
      <div class="og-status" id="menuStatus"></div>
    </div>
  </div>

  <!-- ===================== PEOPLE ===================== -->
  <!-- Everyone who's set up a profile. Fix a name, or delete a profile
       made with a typo'd email (their seats stay, under the same names). -->
  <div id="peopleView" class="view hidden">
    <div class="people-list" id="peopleList"><div class="loading-state">Loading...</div></div>
  </div>

  <!-- ===================== SETTINGS ===================== -->
  <div id="settingsView" class="view hidden">
    <div class="og-section">
      <h3>Payment Handles</h3>
      <p data-copy="admin.payBlurb"></p>
      <div class="og-controls">
        <input type="text" id="venmoInput" placeholder="Venmo username (no @)">
      </div>
      <div class="og-controls" style="margin-top:8px;">
        <input type="text" id="cashappInput" placeholder="Cash App $cashtag (no $)">
      </div>
      <div class="og-controls" style="margin-top:10px;">
        <button type="button" onclick="savePaymentHandles()">Save</button>
      </div>
      <div class="og-status" id="paymentHandlesStatus"></div>
    </div>
    <div class="og-section">
      <h3>Link Preview Image</h3>
      <p data-copy="admin.ogBlurb"></p>
      <img id="ogPreview" class="og-preview hidden" alt="Current link preview image">
      <div class="og-controls">
        <input type="file" id="ogFileInput" accept="image/png,image/jpeg,image/webp,image/gif">
        <button type="button" onclick="uploadOgImage()">Upload</button>
      </div>
      <div class="og-status" id="ogStatus"></div>
    </div>
    <div class="og-section">
      <h3>Site Logo</h3>
      <p data-copy="admin.logoBlurb"></p>
      <img id="logoPreview" class="og-preview hidden" alt="Current site logo">
      <div class="og-controls">
        <input type="file" id="logoFileInput" accept="image/png">
        <button type="button" onclick="uploadLogo()">Upload</button>
      </div>
      <div class="og-status" id="logoStatus"></div>
    </div>
  </div>

  <!-- Whether the showtime editor's changes have reached the server. -->
  <button type="button" class="save-pill hidden" id="savePill" onclick="retrySave()"></button>

  <!-- ===================== SEAT EDITOR OVERLAY ===================== -->
  <div class="seat-editor-overlay hidden" id="seatEditorOverlay">
    <div class="seat-editor-card">
      <div class="seat-editor-title" id="seatEditorTitle">Seat</div>
      <!-- Read-only on purpose: the friend who reserved this seat owns
           their order and can change it themselves from the reservation
           page right up to the cutoff. This is here so you can see what
           they asked for while you're assigning/marking the seat. -->
      <div class="se-order hidden" id="seatEditorOrder"></div>
      <label class="se-field">
        <span data-copy="admin.seatEditor.nameLabel"></span>
        <input type="text" id="seatEditorName" placeholder="e.g. Jordan">
      </label>
      <label class="se-checkbox">
        <input type="checkbox" id="seatEditorPaid">
        <span>Ticket paid</span>
      </label>
      <!-- Separate from the ticket because the two are paid at different
           times: the ticket the moment the seat is claimed, the food only
           once the order goes in and its total stops moving. -->
      <label class="se-checkbox" id="seatEditorConcessionsPaidWrap">
        <input type="checkbox" id="seatEditorConcessionsPaid">
        <span id="seatEditorConcessionsPaidLabel">Concessions paid</span>
      </label>
      <div class="seat-editor-actions">
        <button type="button" class="se-save-btn" onclick="applySeatEdit()">Save</button>
        <button type="button" id="seatEditorClearBtn" onclick="clearNameFromEditor()">Clear</button>
        <button type="button" class="se-danger-btn" onclick="releaseSeatFromEditor()">Release</button>
        <button type="button" onclick="closeSeatEditor()">Cancel</button>
      </div>
    </div>
  </div>

<script src="/copy.js"></script>
<script src="/seat-layout.js"></script>
<script>

// Fills the [data-copy] elements in the markup above from public/copy.js.
// Everything built in JS asks for its lines with t() at the point of use.
applyCopy();

// Inline (not an emoji -- at seat-icon size, the wheelchair emoji renders
// as a tiny broken-looking glyph on several platforms, easily mistaken
// for a failed image load). Path data from svgrepo.com/svg/333986/handicap
// (public domain style icon set). Fixed blue rather than currentColor --
// a seat's background swings from gold to red to green depending on
// state, and this blue reads clearly against all of them by hue alone.

// Today's date as the calendar on the wall has it, NOT as UTC has it.
//
// This used to be toISOString().slice(0,10), which is UTC -- so from 5pm
// Pacific (midnight UTC) onwards it returned TOMORROW, and every showtime
// dated today started comparing as past. Tonight's movie would drop off
// the friend list and into the collapsed Past section exactly when people
// were opening the page to use it. A showtime's `date` comes from an
// <input type="date">, which is local, so the thing it's compared against
// has to be local too.
function todayISO(){
  const d = new Date();
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return d.getFullYear() + '-' + month + '-' + day;
}

// Normalizes a raw seat entry -- handles the legacy string format
// ('selected' / 'occupied') from before per-seat names/paid tracking
// existed, alongside the current object format. Returns null for
// "available" (i.e. no entry at all). Mirrors lib/seats.js -- keep the
// two in sync.
//
// The `concessions` and `concessionsPaid` passthroughs matter more than
// they look: this editor saves the WHOLE seats object, so anything this
// function drops is dropped from disk on the next save. Friends' orders
// and their record of having settled up both live on the seat, so losing
// them here would quietly delete every order -- and re-bill everyone who
// had already paid -- the moment the host touched a showtime.
function normalizeSeatEntry(raw){
  if (!raw) return null;
  if (typeof raw === 'string'){
    if (raw === 'selected') return { status: 'assigned', name: '', paid: true, concessionsPaid: false, concessions: [] };
    if (raw === 'occupied') return { status: 'occupied' };
    return null;
  }
  if (typeof raw === 'object'){
    if (raw.status === 'assigned'){
      const name = raw.name || '';
      return {
        status: 'assigned',
        name,
        // The host's own seat (People -> This is me) arrives with
        // host: true. They buy every ticket and every tray, so it's
        // settled by definition -- see lib/seats.js.
        paid: !!raw.paid || !!raw.host,
        host: !!raw.host,
        // Tracked apart from the ticket because the two are paid at
        // different times -- the ticket when the seat is claimed, the
        // food once the order goes in. Mirrors lib/seats.js.
        concessionsPaid: name ? !!raw.concessionsPaid : false,
        // A seat with nobody's name on it has nobody to order for it.
        concessions: name && Array.isArray(raw.concessions) ? raw.concessions : []
      };
    }
    if (raw.status === 'occupied') return { status: 'occupied' };
  }
  return null;
}

function concessionsTotal(lines){
  const total = (lines || []).reduce((sum, l) => sum + (l.price || 0) * (l.qty || 0), 0);
  return Math.round(total * 100) / 100;
}

function concessionTax(subtotal){
  if (!(subtotal > 0) || !(concessionTaxRate > 0)) return 0;
  return Math.round(subtotal * concessionTaxRate * 100) / 100;
}

// What a cart costs to settle, tax in -- what concessionsPaid is
// measured against. Mirrors concessionsGrandTotal in lib/seats.js.
function concessionsGrandTotal(lines){
  const sub = concessionsTotal(lines);
  return Math.round((sub + concessionTax(sub)) * 100) / 100;
}

// What this seat still owes the host, ticket and food together. The
// host's own seat owes nothing by definition.
function seatOutstanding(s, price){
  if (!s || !s.name || s.host) return 0;
  const ticket = s.paid ? 0 : (typeof price === 'number' ? price : 0);
  const food = s.concessionsPaid ? 0 : concessionsGrandTotal(s.concessions);
  return Math.round((ticket + food) * 100) / 100;
}

function formatTaxRate(rate){
  return (rate * 100).toFixed(3).replace(/0+$/, '').replace(/\.$/, '') + '%';
}

// "Chicken Tenders x2 (BBQ, Ranch)" -- one cart line in words. The
// the picks are part of the item's identity at the counter, not a
// footnote, so they ride along everywhere the line is named.
function concessionLineLabel(l){
  const options = (l.options || []).filter(Boolean);
  return l.name + (l.qty > 1 ? ' \u00d7' + l.qty : '') + (options.length ? ' (' + options.join(', ') + ')' : '');
}

// The compact form used on list cards and in the seat editor, where the
// per-item prices would just be noise.
function concessionSummary(lines){
  if (!lines || !lines.length) return '';
  return lines.map(concessionLineLabel).join(', ');
}

function normalizeSeats(rawSeats){
  const out = {};
  Object.keys(rawSeats || {}).forEach(id => {
    const n = normalizeSeatEntry(rawSeats[id]);
    if (n) out[id] = n;
  });
  return out;
}

// Bouncing to '/admin' on a 401 is normally a one-shot fix (session expired,
// go log in again). But if the page we land on still thinks we're
// authed while the API disagrees (e.g. right after a redeploy handed out
// a new session secret), that bounce repeats forever. Refuse to redirect
// more than once in a few seconds -- show a manual link instead of
// hammering the server or the browser's redirect-loop detector.
function handleAuthFailure(res){
  if (res.status !== 401) return false;
  const key = 'canopy_auth_redirect_at';
  const last = Number(sessionStorage.getItem(key) || 0);
  if (Date.now() - last < 4000){
    document.body.innerHTML =
      '<div style="padding:60px 20px;text-align:center;color:#9a9a9a;font-family:-apple-system,sans-serif;">' +
      t('sessionTrouble', { home: '/admin' }) + '</div>';
    return true;
  }
  sessionStorage.setItem(key, String(Date.now()));
  window.location.href = '/admin';
  return true;
}

// ---------------- ROUTING ----------------
//
// The screen is named in the URL hash -- #/movies, #/movie/<id>,
// #/showtime/<id>, #/menu, #/settings -- so the browser's back button and
// a phone's back swipe go up a level, and a reload stays put.
const VIEWS = ['moviesView', 'movieView', 'editorView', 'menuView', 'peopleView', 'settingsView'];

function parseRoute(){
  const parts = (location.hash || '').replace(/^#\/?/, '').split('/');
  const name = parts[0] || 'movies';
  return { name, id: parts[1] ? decodeURIComponent(parts[1]) : null };
}

function navigate(hash){
  if (location.hash === hash) route();
  else location.hash = hash;
}

// The parent of whatever's on screen: a showtime's movie, a movie's grid.
let parentHash = '#/movies';

// Back arrow. Steps back through history when the parent is what we came
// from (so the history doesn't fill with loops), and goes straight there
// when the page was opened on a deep link.
let cameFrom = null;
function goUp(){
  if (cameFrom === parentHash) history.back();
  else location.replace(parentHash);
}

let currentHash = location.hash;
window.addEventListener('hashchange', () => {
  cameFrom = currentHash;
  currentHash = location.hash;
  route();
});

async function route(){
  // Anything typed but not yet sent goes before the screen changes.
  flushPendingPatch();
  closeSeatEditor();
  const r = parseRoute();
  let view = 'moviesView';
  if (r.name === 'movie' && r.id) view = 'movieView';
  else if (r.name === 'showtime' && r.id) view = 'editorView';
  else if (r.name === 'menu') view = 'menuView';
  else if (r.name === 'settings') view = 'settingsView';
  else if (r.name === 'people') view = 'peopleView';

  if (view !== 'editorView'){
    currentId = null;
    renderSavePill();
  }
  VIEWS.forEach(v => document.getElementById(v).classList.toggle('hidden', v !== view));
  const topLevel = ['moviesView', 'menuView', 'peopleView', 'settingsView'].includes(view);
  document.getElementById('topbar').classList.toggle('hidden', !topLevel);
  const tab = ['menu', 'people', 'settings'].includes(r.name) ? r.name : 'movies';
  document.querySelectorAll('.tabs a').forEach(a => a.classList.toggle('active', a.dataset.tab === tab));
  window.scrollTo(0, 0);

  if (view === 'moviesView'){ parentHash = '#/movies'; await loadMovies(); }
  else if (view === 'movieView'){ parentHash = '#/movies'; await openMovie(r.id); }
  else if (view === 'editorView'){ await openShowtime(r.id); }
  else if (view === 'peopleView'){ parentHash = '#/movies'; await loadPeople(); }
  else parentHash = '#/movies';
}

// A showtime is "past" starting the day after it occurs -- it stays in
// the main upcoming list through its own date, then moves to the
// collapsed Past section the next calendar day. Plain YYYY-MM-DD string
// comparison against today's own YYYY-MM-DD (both local) sidesteps any
// UTC/local timezone conversion bugs a real Date object could introduce.
function isPastShowtime(obj){
  return typeof obj.date === 'string' && obj.date < todayISO();
}

function fillDatalist(id, values){
  const seen = new Set(values.filter(Boolean));
  document.getElementById(id).innerHTML = Array.from(seen).sort()
    .map(t => '<option value="' + escapeHtml(t) + '">')
    .join('');
}

// ---------------- MOVIES ----------------
async function loadMovies(){
  const grid = document.getElementById('movieGrid');
  const pastWrap = document.getElementById('pastMovies');
  try{
    const res = await fetch('/api/movies');
    if (await handleAuthFailure(res)) return;
    if (!res.ok) throw new Error('failed to load');
    const movies = (await res.json()).movies || [];
    const today = todayISO();
    // A movie is upcoming while any of its showings is today or later --
    // and so is one with no showtimes yet, which is a movie just added.
    const upcoming = [], past = [];
    movies.forEach(m => {
      m.next = m.dates.find(d => d >= today) || null;
      m.last = m.dates.length ? m.dates[m.dates.length - 1] : null;
      (m.next || !m.dates.length ? upcoming : past).push(m);
    });
    // New movies (nothing scheduled) first, then by next showing.
    upcoming.sort((a, b) => (a.next || '').localeCompare(b.next || ''));
    past.sort((a, b) => (b.last || '').localeCompare(a.last || ''));

    grid.innerHTML = '';
    if (!upcoming.length){
      grid.innerHTML = '<div class="empty-state">' + escapeHtml(t(movies.length ? 'admin.movies.noneUpcoming' : 'admin.movies.none')) + '</div>';
    }
    upcoming.forEach(m => grid.appendChild(buildMovieTile(m, false)));

    const pastGrid = document.getElementById('pastMovieGrid');
    pastGrid.innerHTML = '';
    past.forEach(m => pastGrid.appendChild(buildMovieTile(m, true)));
    document.getElementById('pastMovieCount').textContent = past.length;
    pastWrap.classList.toggle('hidden', !past.length);
  }catch(e){
    grid.innerHTML = '<div class="empty-state">' + escapeHtml(t('admin.movies.loadFailed')) + '</div>';
  }
}

function buildMovieTile(m, isPast){
  const tile = document.createElement('button');
  tile.type = 'button';
  tile.className = 'movie-tile';
  tile.addEventListener('click', () => navigate('#/movie/' + encodeURIComponent(m.id)));

  const poster = document.createElement('div');
  poster.className = 'tile-poster';
  if (m.posterUrl){
    poster.classList.add('has-img');
    const img = document.createElement('img');
    img.src = m.posterUrl;
    img.alt = '';
    poster.appendChild(img);
  } else {
    const fb = document.createElement('div');
    fb.className = 'tile-poster-fallback';
    fb.textContent = m.title;
    poster.appendChild(fb);
  }
  tile.appendChild(poster);

  const name = document.createElement('div');
  name.className = 'tile-title';
  name.textContent = m.title;
  tile.appendChild(name);

  const sub = document.createElement('div');
  sub.className = 'tile-sub';
  if (!m.showtimeCount){
    sub.textContent = t('admin.movies.noShowtimes');
  } else {
    const count = t(m.showtimeCount === 1 ? 'admin.movies.showtimesOne' : 'admin.movies.showtimesMany', { count: m.showtimeCount });
    const when = isPast
      ? t('admin.movies.last', { when: formatDateDisplay(m.last) })
      : t('admin.movies.next', { when: formatDateDisplay(m.next) });
    sub.textContent = count + ' · ' + when;
  }
  tile.appendChild(sub);
  // Nobody can unlock a movie without one.
  if (!m.password && !isPast){
    const warn = document.createElement('div');
    warn.className = 'tile-warn';
    warn.textContent = t('admin.movies.noPassword');
    tile.appendChild(warn);
  }
  return tile;
}
