// Adding a title that already exists just opens that movie.
async function addMovie(){
  const title = document.getElementById('addMovieTitle').value.trim();
  const statusEl = document.getElementById('addMovieStatus');
  if (!title){ statusEl.textContent = t('admin.movies.typeTitle'); return; }
  statusEl.textContent = t('admin.status.saving');
  try{
    const res = await fetch('/api/movies', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title })
    });
    if (await handleAuthFailure(res)) return;
    if (!res.ok){ statusEl.textContent = t('admin.status.saveFailed'); return; }
    const data = await res.json();
    hideAddMovie();
    navigate('#/movie/' + encodeURIComponent(data.movie.id));
  }catch(e){
    statusEl.textContent = t('admin.status.saveFailed');
  }
}

// ---------------- ONE MOVIE ----------------
let currentMovie = null;

async function openMovie(id){
  const list = document.getElementById('movieShowtimes');
  list.innerHTML = '<div class="loading-state">Loading...</div>';
  try{
    const res = await fetch('/api/movies/' + encodeURIComponent(id));
    if (await handleAuthFailure(res)) return;
    if (res.status === 404){ location.replace('#/movies'); return; }
    if (!res.ok) throw new Error('failed to load');
    currentMovie = (await res.json()).movie;
  }catch(e){
    list.innerHTML = '<div class="empty-state">' + escapeHtml(t('admin.movies.openFailed')) + '</div>';
    return;
  }
  renderMovie();
}

function renderMovie(){
  const m = currentMovie;
  document.getElementById('movieTitle').value = m.title;
  document.getElementById('movieTitleStatus').textContent = '';
  document.getElementById('moviePosterStatus').textContent = '';
  document.getElementById('moviePosterLabel').textContent = m.posterUrl ? 'Change poster' : 'Add poster';
  document.getElementById('moviePassword').value = m.password || '';
  document.getElementById('moviePassword').placeholder = t('admin.movies.passwordNone');
  document.getElementById('moviePasswordStatus').textContent = '';

  const showtimes = m.showtimes || [];
  document.getElementById('movieShowtimeCount').textContent = showtimes.length
    ? t(showtimes.length === 1 ? 'admin.movies.showtimesOne' : 'admin.movies.showtimesMany', { count: showtimes.length })
    : t('admin.movies.noShowtimes');

  const upcoming = showtimes.filter(s => !isPastShowtime(s))
    .sort((a, b) => (a.date + 'T' + a.time).localeCompare(b.date + 'T' + b.time));
  // Most recent first: the further back, the less it matters.
  const past = showtimes.filter(isPastShowtime)
    .sort((a, b) => (b.date + 'T' + b.time).localeCompare(a.date + 'T' + a.time));

  const list = document.getElementById('movieShowtimes');
  list.innerHTML = '';
  if (!upcoming.length){
    list.innerHTML = '<div class="empty-state">' + escapeHtml(t('admin.movies.noUpcomingShowtimes')) + '</div>';
  }
  upcoming.forEach(s => list.appendChild(buildCard(s)));

  const pastList = document.getElementById('pastShowtimeCards');
  pastList.innerHTML = '';
  past.forEach(s => pastList.appendChild(buildCard(s)));
  document.getElementById('pastShowtimeCount').textContent = past.length;
  document.getElementById('pastShowtimes').classList.toggle('hidden', !past.length);

  // Only an empty movie can be deleted; the server refuses otherwise too.
  document.getElementById('deleteMovieWrap').classList.toggle('hidden', showtimes.length > 0);
}

// Renames on Enter or leaving the field. Every showtime takes its title
// from the movie, so this is the one place a title changes.
async function renameMovie(){
  if (!currentMovie) return;
  const input = document.getElementById('movieTitle');
  const statusEl = document.getElementById('movieTitleStatus');
  const title = input.value.trim();
  if (title === currentMovie.title) return;
  if (!title){ input.value = currentMovie.title; return; }
  statusEl.textContent = t('admin.status.saving');
  try{
    const res = await fetch('/api/movies/' + encodeURIComponent(currentMovie.id), {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title })
    });
    if (await handleAuthFailure(res)) return;
    if (res.status === 409){
      statusEl.textContent = t('admin.movies.titleTaken');
      input.value = currentMovie.title;
      return;
    }
    if (!res.ok){ statusEl.textContent = t('admin.status.saveFailed'); return; }
    currentMovie.title = (await res.json()).movie.title;
    input.value = currentMovie.title;
    statusEl.textContent = t('admin.status.saved');
    setTimeout(() => { if (statusEl.textContent === t('admin.status.saved')) statusEl.textContent = ''; }, 1500);
  }catch(e){
    statusEl.textContent = t('admin.status.saveFailed');
  }
}
document.getElementById('movieTitle').addEventListener('change', renameMovie);
document.getElementById('movieTitle').addEventListener('keydown', (e) => {
  if (e.key === 'Enter'){ e.preventDefault(); e.target.blur(); }
});

// The movie's password saves as you type, like a showtime's fields.
// Changing it doesn't re-lock phones that already unlocked the movie.
let passwordTimer = null;
async function saveMoviePassword(){
  clearTimeout(passwordTimer);
  if (!currentMovie) return;
  const input = document.getElementById('moviePassword');
  const statusEl = document.getElementById('moviePasswordStatus');
  const password = input.value.trim();
  if (password === (currentMovie.password || '')){
    if (statusEl.textContent === t('admin.status.saving')) statusEl.textContent = '';
    return;
  }
  statusEl.textContent = t('admin.status.saving');
  try{
    const res = await fetch('/api/movies/' + encodeURIComponent(currentMovie.id), {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password })
    });
    if (await handleAuthFailure(res)) return;
    if (!res.ok){ statusEl.textContent = t('admin.status.saveFailed'); return; }
    currentMovie.password = (await res.json()).movie.password;
    statusEl.textContent = t('admin.status.saved');
    setTimeout(() => { if (statusEl.textContent === t('admin.status.saved')) statusEl.textContent = ''; }, 1500);
  }catch(e){
    statusEl.textContent = t('admin.status.saveFailed');
  }
}
document.getElementById('moviePassword').addEventListener('input', () => {
  clearTimeout(passwordTimer);
  document.getElementById('moviePasswordStatus').textContent = t('admin.status.saving');
  passwordTimer = setTimeout(saveMoviePassword, 700);
});
document.getElementById('moviePassword').addEventListener('blur', saveMoviePassword);

// ---------------- PEOPLE ----------------
let hostPersonId = null;   // the admin's own profile ("This is me")

async function setHostPerson(personId){
  try{
    const res = await fetch('/api/people-host', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ personId })
    });
    if (await handleAuthFailure(res)) return;
    if (!res.ok) throw new Error('failed');
  }catch(e){
    alert(t('admin.status.saveFailed'));
  }
  loadPeople();
}

async function loadPeople(){
  const list = document.getElementById('peopleList');
  try{
    const res = await fetch('/api/people');
    if (await handleAuthFailure(res)) return;
    if (!res.ok) throw new Error('failed');
    const data = await res.json();
    const people = data.people || [];
    hostPersonId = data.hostPersonId || null;
    list.innerHTML = '';
    if (!people.length){
      list.innerHTML = '<div class="empty-state">' + escapeHtml(t('admin.people.none')) + '</div>';
      return;
    }
    // Until the admin has said which profile is theirs, their own seats
    // are billed like anyone's -- say so up top.
    if (!hostPersonId || !people.some(p => p.id === hostPersonId)){
      const note = document.createElement('div');
      note.className = 'people-host-note';
      note.textContent = t('admin.people.pickHost');
      list.appendChild(note);
    }
    people.forEach(p => list.appendChild(buildPersonRow(p)));
  }catch(e){
    list.innerHTML = '<div class="empty-state">' + escapeHtml(t('admin.people.loadFailed')) + '</div>';
  }
}

// One person: photo, full name (and what friends see), email, how many
// seats. Edit opens the name fields in place.
function buildPersonRow(p){
  const row = document.createElement('div');
  row.className = 'person-row';
  const photo = p.photoUrl ? '<img class="person-photo" src="' + escapeHtml(p.photoUrl) + '" alt="">' : '<div class="person-photo"></div>';
  row.innerHTML = photo +
    '<div class="person-main"><div class="person-name"></div><div class="person-meta"></div>' +
    '<div class="person-edit hidden"><div class="person-edit-row">' +
    '<input type="text" class="pe-first" maxlength="60" placeholder="First name">' +
    '<input type="text" class="pe-last" maxlength="60" placeholder="Last name"></div>' +
    '<div class="person-edit-actions"><button type="button" class="pe-save">Save</button>' +
    '<button type="button" class="pe-cancel">Cancel</button>' +
    '<button type="button" class="pe-host"></button>' +
    '<button type="button" class="delete-btn pe-delete">Delete</button></div>' +
    '<div class="og-status pe-status"></div></div></div>' +
    '<button type="button" class="pe-open">Edit</button>';
  const isHost = p.id === hostPersonId;
  row.querySelector('.person-name').textContent = p.firstName + ' ' + p.lastName;
  if (isHost){
    const tag = document.createElement('span');
    tag.className = 'host-tag';
    tag.textContent = t('admin.people.youTag');
    row.querySelector('.person-name').appendChild(tag);
  }
  const hostBtn = row.querySelector('.pe-host');
  hostBtn.textContent = t(isHost ? 'admin.people.notMe' : 'admin.people.thisIsMe');
  hostBtn.addEventListener('click', () => setHostPerson(isHost ? null : p.id));
  row.querySelector('.person-meta').textContent = [
    t('admin.people.shownAs', { name: p.shortName }),
    p.email,
    p.venmo ? 'Venmo @' + p.venmo : '',
    t(p.seatCount === 1 ? 'admin.people.seatsOne' : 'admin.people.seatsMany', { count: p.seatCount })
  ].filter(Boolean).join(' · ');
  const edit = row.querySelector('.person-edit');
  row.querySelector('.pe-first').value = p.firstName;
  row.querySelector('.pe-last').value = p.lastName;
  row.querySelector('.pe-open').addEventListener('click', () => edit.classList.toggle('hidden'));
  row.querySelector('.pe-cancel').addEventListener('click', () => edit.classList.add('hidden'));
  row.querySelector('.pe-save').addEventListener('click', async () => {
    const statusEl = row.querySelector('.pe-status');
    statusEl.textContent = t('admin.status.saving');
    try{
      const res = await fetch('/api/people/' + encodeURIComponent(p.id), {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ firstName: row.querySelector('.pe-first').value, lastName: row.querySelector('.pe-last').value })
      });
      if (await handleAuthFailure(res)) return;
      if (!res.ok){ statusEl.textContent = t('admin.status.saveFailed'); return; }
      loadPeople();
    }catch(e){
      statusEl.textContent = t('admin.status.saveFailed');
    }
  });
  row.querySelector('.pe-delete').addEventListener('click', async () => {
    if (!confirm(t('admin.people.deleteConfirm', { name: p.firstName + ' ' + p.lastName, email: p.email }))) return;
    try{
      const res = await fetch('/api/people/' + encodeURIComponent(p.id), { method: 'DELETE' });
      if (await handleAuthFailure(res)) return;
      if (!res.ok) throw new Error('failed');
      loadPeople();
    }catch(e){
      alert(t('admin.deleteFailed'));
    }
  });
  return row;
}

// Uploads as soon as a file is picked -- there's nothing else to confirm.
async function uploadMoviePoster(){
  const input = document.getElementById('moviePosterInput');
  const statusEl = document.getElementById('moviePosterStatus');
  if (!currentMovie || !input.files || !input.files[0]) return;
  statusEl.textContent = t('admin.status.uploading');
  const formData = new FormData();
  formData.append('image', input.files[0]);
  try{
    const res = await fetch('/api/movies/' + encodeURIComponent(currentMovie.id) + '/poster', { method: 'POST', body: formData });
    if (await handleAuthFailure(res)) return;
    if (!res.ok){
      const data = await res.json().catch(() => ({}));
      statusEl.textContent = data.error || t('admin.status.uploadFailed');
      return;
    }
    const movie = (await res.json()).movie;
    currentMovie.posterUrl = movie.posterUrl;
    (currentMovie.showtimes || []).forEach(s => { s.posterUrl = movie.posterUrl; });
    input.value = '';
    renderMovie();
    statusEl.textContent = t('admin.status.uploaded');
    setTimeout(() => { if (statusEl.textContent === t('admin.status.uploaded')) statusEl.textContent = ''; }, 1500);
  }catch(e){
    statusEl.textContent = t('admin.status.uploadFailed');
  }
}

async function deleteMovie(){
  if (!currentMovie) return;
  if (!confirm(t('admin.movies.deleteConfirm', { title: currentMovie.title }))) return;
  try{
    const res = await fetch('/api/movies/' + encodeURIComponent(currentMovie.id), { method: 'DELETE' });
    if (await handleAuthFailure(res)) return;
    if (!res.ok) throw new Error('failed');
    currentMovie = null;
    location.replace('#/movies');
  }catch(e){
    alert(t('admin.deleteFailed'));
  }
}

// A new showtime starts as a copy of the movie's latest one (same
// theater, screen, format, price and time -- usually all that's the same
// between showings), dated today; or the defaults, for a movie's first.
async function addShowtime(){
  if (!currentMovie) return;
  const latest = (currentMovie.showtimes || []).slice()
    .sort((a, b) => (b.date + 'T' + b.time).localeCompare(a.date + 'T' + a.time))[0];
  const screen = latest && latest.screen ? latest.screen : DEFAULT_SCREEN;
  const layout = SEAT_LAYOUTS[screen] || SEAT_LAYOUTS[DEFAULT_SCREEN];
  const body = latest
    ? { theater: latest.theater || '', screen, format: latest.format || '', price: latest.price, time: latest.time || '19:00', date: todayISO() }
    : { theater: layout.theater || 'AMC Metreon 16', screen, format: (layout.formats || [])[0] || '', price: 17.49, time: '19:00', date: todayISO() };
  try{
    const res = await fetch('/api/movies/' + encodeURIComponent(currentMovie.id) + '/showtimes', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (await handleAuthFailure(res)) return;
    if (!res.ok) throw new Error('failed');
    const showtime = (await res.json()).showtime;
    navigate('#/showtime/' + encodeURIComponent(showtime.id));
  }catch(e){
    alert(t('admin.status.saveFailed'));
  }
}

function formatPrice(price){
  return (typeof price === 'number') ? ('$' + price.toFixed(2)) : '';
}

// The movie's poster on each showtime card, as on the friend page. Same
// fixed size whether or not there's a poster, so cards line up.
function buildPosterEl(obj){
  const poster = document.createElement('div');
  poster.className = 'poster-thumb';
  if (obj.posterUrl){
    const img = document.createElement('img');
    img.src = obj.posterUrl;
    img.alt = '';
    poster.appendChild(img);
  } else {
    poster.classList.add('poster-placeholder');
  }
  return poster;
}

// One showtime on its movie's page. The whole card opens it. No title:
// the page header already says which movie this is.
function buildCard(obj){
  const card = document.createElement('div');
  card.className = 'card is-link';
  card.setAttribute('role', 'button');
  card.setAttribute('tabindex', '0');
  const open = () => navigate('#/showtime/' + encodeURIComponent(obj.id));
  card.addEventListener('click', open);
  card.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); open(); }
  });

  const seats = normalizeSeats(obj.seats);
  const blockIds = Object.keys(seats).filter(k => seats[k].status === 'assigned').sort(compareSeatIds);
  const dateDisplay = obj.date ? formatDateDisplay(obj.date) : '';
  const timeDisplay = obj.time ? formatTimeDisplay(obj.time) : '';

  const body = document.createElement('div');
  body.className = 'card-body';
  body.appendChild(buildPosterEl(obj));

  const info = document.createElement('div');
  info.className = 'card-info';

  // Skipped entirely rather than left as an empty row when a showtime
  // somehow has neither a date nor a time.
  const whenText = [dateDisplay, timeDisplay].filter(Boolean).join(' · ');
  if (whenText){
    const when = document.createElement('div');
    when.className = 'when';
    when.textContent = whenText;
    info.appendChild(when);
  }

  if (obj.info){
    const note = document.createElement('div');
    note.className = 'showtime-info';
    note.textContent = obj.info;
    info.appendChild(note);
  }

  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = [obj.theater, obj.format, formatPrice(obj.price)].filter(Boolean).join(' | ');
  info.appendChild(meta);

  const namedIds = blockIds.filter(id => seats[id].name);
  const availLine = document.createElement('div');
  if (blockIds.length === 0){
    availLine.className = 'seats-empty';
    availLine.textContent = t('admin.seatSummary.empty');
  } else {
    const availCount = blockIds.length - namedIds.length;
    availLine.className = 'seats-avail-line ' + (availCount > 0 ? 'seats-avail-green' : 'seats-avail-red');
    availLine.textContent = availCount + ' seat' + (availCount === 1 ? '' : 's') + ' available';
  }
  info.appendChild(availLine);

  body.appendChild(info);
  const chevron = document.createElement('div');
  chevron.className = 'card-chevron';
  chevron.setAttribute('aria-hidden', 'true');
  body.appendChild(chevron);
  card.appendChild(body);

  if (namedIds.length > 0){
    const namedLines = namedIds.map(id => {
      const s = seats[id];
      // What's outstanding, ticket and food together -- a seat that paid
      // for its ticket and then ordered $25 of popcorn hasn't settled up,
      // and this list is the one place the host scans for who to chase.
      const outstanding = seatOutstanding(s, obj.price);
      const paidTag = outstanding > 0
        ? '<span class="unpaid-tag">owes ' + escapeHtml(formatPrice(outstanding)) + '</span>'
        : '<span class="paid-tag">&#10003; paid</span>';
      const order = (s.concessions || []).length
        ? '<div class="concession-line">&#127871; ' + escapeHtml(concessionSummary(s.concessions)) +
          ' &mdash; ' + escapeHtml(formatPrice(concessionsTotal(s.concessions))) + '</div>'
        : '';
      return '<div class="seat-line"><b>' + escapeHtml(s.name) + '</b> <span class="seat-id">(' + escapeHtml(id) + ')</span>' + paidTag + '</div>' + order;
    }).join('');
    const namedList = document.createElement('div');
    namedList.className = 'claimed-list';
    namedList.innerHTML = namedLines;
    card.appendChild(namedList);
  }
  return card;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function formatDateDisplay(iso){
  try{
    const [y,m,d] = iso.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    return dt.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
  }catch(e){ return iso; }
}
function formatTimeDisplay(t){
  try{
    const [h,m] = t.split(':').map(Number);
    const dt = new Date();
    dt.setHours(h, m, 0, 0);
    return dt.toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' });
  }catch(e){ return t; }
}

// ---------------- ONE SHOWTIME ----------------
async function openShowtime(id){
  document.getElementById('seatmap').innerHTML = '';
  let obj;
  try{
    const res = await fetch('/api/showtimes/' + encodeURIComponent(id));
    if (await handleAuthFailure(res)) return;
    if (res.status === 404){ alert(t('admin.notFound')); location.replace('#/movies'); return; }
    if (!res.ok) throw new Error('failed');
    obj = (await res.json()).showtime;
  }catch(e){
    alert(t('admin.openFailed'));
    return;
  }
  // The route may have moved on while this was loading.
  if (parseRoute().id !== id) return;
  currentId = id;
  parentHash = '#/movie/' + encodeURIComponent(obj.movieId);
  ordersClosed = !!obj.ordersClosed;
  document.getElementById('editorTitle').textContent = obj.title || '';
  document.getElementById('theaterField').value = obj.theater || '';
  document.getElementById('showDate').value = obj.date || '';
  document.getElementById('showTime').value = obj.time || '';
  document.getElementById('screen').value = obj.screen || DEFAULT_SCREEN;
  syncFormatOptions(obj.format);
  document.getElementById('price').value = (typeof obj.price === 'number') ? obj.price.toFixed(2) : '';
  document.getElementById('showInfo').value = obj.info || '';
  seatStates = normalizeSeats(obj.seats);
  saveFailed = null;
  renderSavePill();
  // Build after the view is showing -- buildSeatGrid measures row widths,
  // which read 0 inside a display:none ancestor.
  buildSeatGrid();
}

function setPrice(v){
  document.getElementById('price').value = v.toFixed(2);
  queuePatch({ price: v }, true);
}

// ---------------- SEAT GRID ----------------
// Screen arc + "SCREEN" label, built fresh into #seatmap alongside the
// rows (not as a separate element above it) so it's part of the same
// horizontally-scrolling flex column -- it scrolls in lock-step with the
// seats instead of sitting fixed while they scroll underneath it.
function buildScreenWrap(){
  const screenWrap = document.createElement('div');
  screenWrap.className = 'screen-wrap';
  screenWrap.innerHTML =
    '<svg class="screen-curve" viewBox="0 0 900 26" preserveAspectRatio="none">' +
    '<path d="M10,20 Q450,-10 890,20" stroke="#eee" stroke-width="2" fill="none"/></svg>' +
    '<div class="screen-label">SCREEN</div>';
  return screenWrap;
}

function buildSeatGrid(){
  const seatmap = document.getElementById('seatmap');
  seatmap.innerHTML = '';
  seatEls = {};

  const rowDefs = getSeatLayout(document.getElementById('screen').value);

  const screenWrap = buildScreenWrap();
  seatmap.appendChild(screenWrap);

  rowDefs.forEach(row => {
    const rowEl = document.createElement('div');
    rowEl.className = 'row' + (row.gapAfter ? ' row-gap-after' : '');
    // Blank, non-interactive slots before the first real seat -- see
    // seat-layout.js's `padStart` comment. Rows render flush-left, so
    // this is what actually sets this row's horizontal offset from
    // every other row -- not dependent on any browser's cross-axis
    // centering support.
    for (let p = 0; p < (row.padStart || 0); p++){
      const filler = document.createElement('div');
      filler.className = 'seat-filler';
      rowEl.appendChild(filler);
    }
    for (let i = row.count; i >= 1; i--){
      // A number this row skips -- see seat-layout.js's `skip` comment.
      if ((row.skip || []).includes(i)){
        const filler = document.createElement('div');
        filler.className = 'seat-filler';
        rowEl.appendChild(filler);
        continue;
      }
      const seatId = row.letter + i;
      const type = row.special[i] || 'seat';
      const seatEl = document.createElement('div');
      seatEl.className = 'seat' + (type !== 'seat' ? ' ' + type : '');
      seatEl.dataset.id = seatId;
      // baseText only covers the plain-seat-number case -- 'wc' and
      // 'comp' both render as the SVG icon instead (see renderSeat),
      // which textContent can't hold.
      seatEl.dataset.baseText = seatId;
      if (type === 'wc' || type === 'comp') {
        seatEl.innerHTML = WHEELCHAIR_ICON_SVG;
      } else {
        seatEl.textContent = seatEl.dataset.baseText;
      }
      seatEl.setAttribute('aria-label', seatId);
      seatEl.addEventListener('click', () => seatTap(seatId));
      rowEl.appendChild(seatEl);
      seatEls[seatId] = seatEl;
      // Blank slots between this seat and the next one -- see
      // seat-layout.js's `blankAfter` comment.
      for (let p = 0; p < ((row.blankAfter || {})[i] || 0); p++){
        const filler = document.createElement('div');
        filler.className = 'seat-filler';
        rowEl.appendChild(filler);
      }
    }
    seatmap.appendChild(rowEl);
  });

  // Match the screen's width to the widest row so its peak/label center
  // on the actual seat block instead of a fixed guess.
  const rowWidths = Array.from(seatmap.querySelectorAll('.row')).map(r => r.offsetWidth);
  if (rowWidths.length) screenWrap.style.width = Math.max(...rowWidths) + 'px';

  // Render every seat (not just ones with a stored state) so the hover
  // tooltip and default styling are set for the "not in your block" ones too.
  Object.keys(seatEls).forEach(id => renderSeat(id));
  updateSummary();
}

function renderSeat(id){
  const el = seatEls[id];
  if (!el) return;
  const s = seatStates[id];
  el.classList.remove('in-block', 'claimed', 'paid');
  if (el.classList.contains('wc') || el.classList.contains('comp')) {
    el.innerHTML = WHEELCHAIR_ICON_SVG;
  } else {
    el.textContent = el.dataset.baseText;
  }
  // Anything that isn't 'assigned' -- including no entry at all, or a
  // legacy 'occupied' entry from before that state was retired -- just
  // renders as "not in your block."
  if (!s || s.status !== 'assigned'){
    el.dataset.tooltip = t('admin.seatGrid.tipNotOurs', { seat: id });
    return;
  }
  if (s.name){
    el.classList.add('claimed');
    if (s.paid) el.classList.add('paid');
    el.dataset.tooltip = t('admin.seatGrid.tipClaimed', { seat: id, name: s.name, state: s.paid ? 'paid' : 'unpaid' });
  } else {
    el.classList.add('in-block');
    el.dataset.tooltip = t('admin.seatGrid.tipAvailable', { seat: id });
  }
}

// Single tap: not in your block -> grabbed for your block (available,
// unpaid). Tapping a block seat (available or claimed) opens the editor.
function seatTap(id){
  const cur = seatStates[id];
  if (!cur || cur.status !== 'assigned'){
    seatStates[id] = { status: 'assigned', name: '', paid: false, concessionsPaid: false, concessions: [] };
    renderSeat(id);
    updateSummary();
    writeSeat(id);
    return;
  }
  openSeatEditor(id);
}

function openSeatEditor(id){
  editingSeatId = id;
  const cur = seatStates[id];
  const hasName = !!(cur && cur.name);
  document.getElementById('seatEditorTitle').textContent = t('admin.seatEditor.title', { seat: id });
  renderSeatEditorOrder(cur);
  document.getElementById('seatEditorName').value = hasName ? cur.name : '';
  document.getElementById('seatEditorPaid').checked = !!(cur && cur.paid);
  renderSeatEditorConcessionsPaid(cur);
  document.getElementById('seatEditorClearBtn').classList.toggle('hidden', !hasName);
  document.getElementById('seatEditorOverlay').classList.remove('hidden');
  setTimeout(() => document.getElementById('seatEditorName').focus(), 0);
}

// The concessions box only means something once there's a cart to settle,
// and on the host's own seat it never means anything -- they're the one
// being paid. Hidden rather than disabled in both cases: a dead checkbox
// invites a click that does nothing.
function renderSeatEditorConcessionsPaid(seat){
  const wrap = document.getElementById('seatEditorConcessionsPaidWrap');
  const box = document.getElementById('seatEditorConcessionsPaid');
  const label = document.getElementById('seatEditorConcessionsPaidLabel');
  const lines = seat && seat.status === 'assigned' && seat.name ? (seat.concessions || []) : [];
  const cost = concessionsGrandTotal(lines);
  const isHost = !!(seat && seat.host);

  wrap.classList.toggle('hidden', cost <= 0 || isHost);
  box.checked = cost > 0 && !!seat.concessionsPaid;
  label.textContent = t('admin.seatEditor.concessionsPaid', { amount: formatPrice(cost) });
}

// The friend's own order for this seat, shown while you're editing the
// seat. Read-only -- they own it and can change it from the reservation
// page until the cutoff; this is just so "who ordered the large Icee"
// is answerable without leaving the editor.
function renderSeatEditorOrder(seat){
  const el = document.getElementById('seatEditorOrder');
  const lines = seat && seat.status === 'assigned' && seat.name ? (seat.concessions || []) : [];
  if (!lines.length){
    el.classList.add('hidden');
    el.innerHTML = '';
    return;
  }
  const rows = lines.map(l => {
    const note = l.note ? ' <span class="seat-id">(' + escapeHtml(l.note) + ')</span>' : '';
    return '<div class="se-order-line">' + escapeHtml(concessionLineLabel(l)) + note + '</div>';
  }).join('');
  el.innerHTML = '<div class="se-order-head">' + escapeHtml(t('admin.seatEditor.orderHead')) + '</div>' + rows +
    '<div class="se-order-total">' + escapeHtml(formatPrice(concessionsTotal(lines))) + '</div>';
  el.classList.remove('hidden');
}

function closeSeatEditor(){
  editingSeatId = null;
  document.getElementById('seatEditorOverlay').classList.add('hidden');
}

function applySeatEdit(){
  if (!editingSeatId) return;
  const name = document.getElementById('seatEditorName').value.trim();
  const paid = document.getElementById('seatEditorPaid').checked;
  const prior = seatStates[editingSeatId];
  // Fixing a typo in a name or ticking "paid" must not throw away what
  // that person ordered -- carry the cart through. Blanking the name is
  // the one case that clears it (see clearNameFromEditor), and
  // normalizeSeatEntry enforces that regardless of what's passed here.
  const priorCart = prior && prior.status === 'assigned' ? (prior.concessions || []) : [];
  const foodBox = document.getElementById('seatEditorConcessionsPaid');
  const concessionsPaid = !!(name && foodBox.checked);
  seatStates[editingSeatId] = {
    status: 'assigned',
    name,
    paid,
    concessionsPaid,
    concessions: name ? priorCart : []
  };
  renderSeat(editingSeatId);
  updateSummary();
  writeSeat(editingSeatId);
  closeSeatEditor();
}

// Un-assigns just the friend's name, keeping the seat in your block
// (green, available) so someone else can grab it.
// The order goes with the name -- it belonged to the person whose name
// is being removed (the server does the same; see setSeat).
function clearNameFromEditor(){
  if (!editingSeatId) return;
  seatStates[editingSeatId] = { status: 'assigned', name: '', paid: false, concessionsPaid: false, concessions: [] };
  renderSeat(editingSeatId);
  updateSummary();
  writeSeat(editingSeatId);
  closeSeatEditor();
}

// Drops the seat out of your block entirely (e.g. you refunded the
// ticket via AMC) -- back to "not in your block."
// Saves straight away like everything else, so a seat with someone's
// name on it asks first.
function releaseSeatFromEditor(){
  if (!editingSeatId) return;
  const cur = seatStates[editingSeatId];
  if (cur && cur.name && !confirm(t('admin.seatEditor.releaseConfirm', { seat: editingSeatId, name: cur.name }))) return;
  delete seatStates[editingSeatId];
  renderSeat(editingSeatId);
  updateSummary();
  writeSeat(editingSeatId);
  closeSeatEditor();
}

function updateSummary(){
  const blockIds = Object.keys(seatStates).filter(id => seatStates[id].status === 'assigned').sort(compareSeatIds);
  const summary = document.getElementById('summary');
  renderOrders();
  if (blockIds.length === 0){
    summary.innerHTML = t('admin.seatSummary.none');
    return;
  }
  const lines = blockIds.map(id => {
    const s = seatStates[id];
    const label = s.name ? escapeHtml(s.name) : escapeHtml(t('admin.seatSummary.available'));
    const outstanding = seatOutstanding(s, currentShowtimePrice());
    const paidTag = s.name
      ? (outstanding > 0 ? t('admin.seatSummary.owes', { amount: formatPrice(outstanding) }) : t('admin.seatSummary.paid'))
      : '';
    return '<div class="summary-line">' + escapeHtml(id) + ': <b>' + label + '</b>' + paidTag + '</div>';
  });
  summary.innerHTML = escapeHtml(t('admin.seatSummary.heading', { count: blockIds.length })) + lines.join('');
}

// Per-seat orders plus the summed shopping list, rebuilt whenever the
// seat summary is. Reads seatStates (not the server's copy) so it stays
// correct against edits that haven't been saved yet.
// Whether friends can still change their orders for the showtime being
// edited. Held here rather than read off the DOM so the button and the
// note can't disagree about it.
let ordersClosed = false;

function renderOrdersCloseBar(){
  const bar = document.getElementById('ordersCloseBar');
  // Nothing to close on a showtime that doesn't exist yet -- there's no
  // id to write to, and nobody can have ordered against it.
  bar.classList.toggle('hidden', !currentId);
  if (!currentId) return;

  bar.classList.toggle('is-closed', ordersClosed);
  document.getElementById('ordersCloseBtn').textContent = t(ordersClosed ? 'admin.orders.reopen' : 'admin.orders.finalize');
  document.getElementById('ordersCloseNote').textContent = t(ordersClosed ? 'admin.orders.noteClosed' : 'admin.orders.noteOpen');
}

// Not part of the save queue (see SAVING AS YOU GO): it asks first, and
// it's the host saying "I'm at the counter now", so it has to take
// effect -- or visibly fail -- right then, not behind other writes.
async function toggleOrdersClosed(){
  if (!currentId) return;
  const next = !ordersClosed;
  if (next && !confirm(t('admin.orders.finalizeConfirm'))) return;

  const btn = document.getElementById('ordersCloseBtn');
  btn.disabled = true;
  try{
    const res = await fetch('/api/showtimes/' + currentId + '/orders-closed', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ closed: next })
    });
    if (await handleAuthFailure(res)) return;
    if (!res.ok){ alert(t('admin.orders.finalizeFailed')); return; }
    ordersClosed = next;
    renderOrdersCloseBar();
  }catch(e){
    alert(t('admin.orders.finalizeFailed'));
  }finally{
    btn.disabled = false;
  }
}

// The price in the editor form, which is what the seat summary above is
// describing -- the seats there are the ones being edited, not the ones
// last saved.
function currentShowtimePrice(){
  const v = parseFloat(document.getElementById('price').value);
  return isFinite(v) && v > 0 ? v : 0;
}

function renderOrders(){
  renderOrdersCloseBar();
  const el = document.getElementById('orders');
  const ordered = Object.keys(seatStates)
    .filter(id => seatStates[id].status === 'assigned' && seatStates[id].name && (seatStates[id].concessions || []).length)
    .sort(compareSeatIds);

  if (ordered.length === 0){
    el.innerHTML = '<h4>' + escapeHtml(t('admin.orders.heading')) + '</h4><div class="orders-empty">' +
      escapeHtml(t('admin.orders.empty')) + '</div>';
    return;
  }

  const perSeat = ordered.map(id => {
    const seat = seatStates[id];
    const lines = seat.concessions || [];
    const detail = lines.map(l => {
      const note = l.note ? ' \u2014 ' + escapeHtml(l.note) : '';
      return escapeHtml(concessionLineLabel(l)) + note;
    }).join(', ');
    // Tax included, because this is the figure that person was quoted and
    // so the figure they'll hand over. (Rounding each seat separately can
    // leave the seats summing a cent or two from the tax on the whole
    // order below -- which is real, not a bug: the counter taxes one
    // receipt, four friends each round their own.)
    const seatSubtotal = concessionsTotal(lines);
    return '<div class="order-line"><b>' + escapeHtml(seat.name) + '</b> <span class="seat-id">(' + escapeHtml(id) + ')</span>' +
      ' &mdash; ' + formatPrice(Math.round((seatSubtotal + concessionTax(seatSubtotal)) * 100) / 100) +
      '<div class="order-items">' + detail + '</div></div>';
  }).join('');

  // Summed by item NAME, not id: two lines for the same snack placed
  // before and after the host renamed it are still the same thing to
  // buy, and the counter doesn't care what the id was.
  const totals = new Map();
  ordered.forEach(id => {
    (seatStates[id].concessions || []).forEach(l => {
      const prev = totals.get(l.name) || { qty: 0, total: 0 };
      prev.qty += l.qty;
      prev.total += (l.price || 0) * l.qty;
      totals.set(l.name, prev);
    });
  });

  let grand = 0;
  // `sum`, not `t`: t() is the copy lookup from public/copy.js.
  const rollupLines = Array.from(totals.entries()).map(([name, sum]) => {
    grand += sum.total;
    return '<div class="rollup-line"><span>' + escapeHtml(name) + ' \u00d7' + sum.qty + '</span><span>' +
      escapeHtml(formatPrice(Math.round(sum.total * 100) / 100)) + '</span></div>';
  }).join('');

  // Picks get their own tally: at the counter "and three BBQ, one icing"
  // is a separate ask, and reading it back off six individual orders is
  // exactly the counting this panel exists to save.
  const optionCounts = new Map();
  ordered.forEach(id => {
    (seatStates[id].concessions || []).forEach(l => {
      (l.options || []).filter(Boolean).forEach(name => {
        optionCounts.set(name, (optionCounts.get(name) || 0) + 1);
      });
    });
  });
  const optionRollup = optionCounts.size
    ? '<div class="rollup-line is-options"><span>' + escapeHtml(t('admin.orders.choices')) + '</span><span>' +
      escapeHtml(Array.from(optionCounts.entries()).map(([n, c]) => n + ' \u00d7' + c).join(', ')) +
      '</span></div>'
    : '';

  // The roll-up is what gets handed over at the counter, so it carries
  // tax -- a shopping list that adds up to less than the receipt is the
  // one way this panel could mislead.
  const subtotal = Math.round(grand * 100) / 100;
  const tax = concessionTax(subtotal);
  const taxRow = tax > 0
    ? '<div class="rollup-line"><span>' + escapeHtml(t('admin.orders.tax', { rate: formatTaxRate(concessionTaxRate) })) + '</span><span>' +
      escapeHtml(formatPrice(tax)) + '</span></div>'
    : '';

  el.innerHTML =
    '<h4>' + escapeHtml(t(ordered.length === 1 ? 'admin.orders.seatHeadingOne' : 'admin.orders.seatHeadingMany', { count: ordered.length })) + '</h4>' +
    perSeat +
    '<div class="order-rollup">' + rollupLines + optionRollup + taxRow +
    '<div class="rollup-line is-total"><span>' + escapeHtml(t('admin.orders.total')) + '</span><span>' +
    escapeHtml(formatPrice(Math.round((subtotal + tax) * 100) / 100)) + '</span></div></div>';
}

// ---------------- SAVING AS YOU GO ----------------
//
// There's no Save button. A field saves on its own (PATCH one field), a
// seat saves on its own (PUT/DELETE one seat), as each is changed.
//
// Writes go out one at a time, in the order they were made, so two
// quick taps on the same seat can't land out of order. A write that
// fails is kept -- under its seat or field, so a newer change to the same
// thing replaces it rather than a retry later overwriting the newer one --
// and the pill at the bottom turns into the retry button.
let saveQueue = Promise.resolve();
let writesInFlight = 0;
const failedWrites = new Map();   // key -> run(), for writes that didn't make it
let savedShowtimeId = null;       // set once something has saved in this editor

let pendingPatch = {};            // typed but not sent yet (see queuePatch)
let pendingPatchShowtime = null;
let patchTimer = null;

function enqueueWrite(key, run){
  writesInFlight++;
  renderSavePill();
  const showtimeId = key.split(':')[0];
  saveQueue = saveQueue.then(async () => {
    try{
      const res = await run();
      if (await handleAuthFailure(res)) return;
      if (!res.ok) throw new Error('status ' + res.status);
      failedWrites.delete(key);
      savedShowtimeId = showtimeId;
    }catch(e){
      failedWrites.set(key, run);
    }finally{
      writesInFlight--;
      renderSavePill();
    }
  });
  return saveQueue;
}

function retrySave(){
  if (!failedWrites.size) return;
  const writes = Array.from(failedWrites.entries());
  failedWrites.clear();
  writes.forEach(([key, run]) => enqueueWrite(key, run));
}

// Text fields wait until typing pauses (or the field loses focus) and
// then send; pickers and buttons send straight away (`now`).
function queuePatch(fields, now){
  if (!currentId) return;
  if (pendingPatchShowtime && pendingPatchShowtime !== currentId) flushPendingPatch();
  pendingPatchShowtime = currentId;
  Object.assign(pendingPatch, fields);
  clearTimeout(patchTimer);
  if (now) flushPendingPatch();
  else patchTimer = setTimeout(flushPendingPatch, 700);
  renderSavePill();
}

// One request per field, so a failed one only ever retries itself.
function flushPendingPatch(){
  clearTimeout(patchTimer);
  const id = pendingPatchShowtime;
  const fields = pendingPatch;
  pendingPatch = {};
  pendingPatchShowtime = null;
  if (!id) return;
  Object.keys(fields).forEach(field => {
    const body = JSON.stringify({ [field]: fields[field] });
    enqueueWrite(id + ':field:' + field, () => fetch('/api/showtimes/' + encodeURIComponent(id), {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body
    }));
  });
}

// Sends one seat as it is in seatStates now: in the block (with its name
// and paid flags) or, if it's gone from seatStates, released.
function writeSeat(seatId){
  const id = currentId;
  if (!id) return;
  const s = seatStates[seatId];
  const url = '/api/showtimes/' + encodeURIComponent(id) + '/seats/' + encodeURIComponent(seatId);
  if (!s || s.status !== 'assigned'){
    enqueueWrite(id + ':seat:' + seatId, () => fetch(url, { method: 'DELETE' }));
    return;
  }
  const body = JSON.stringify({ name: s.name || '', paid: !!s.paid, concessionsPaid: !!s.concessionsPaid });
  enqueueWrite(id + ':seat:' + seatId, () => fetch(url, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body
  }));
}

function renderSavePill(){
  const pill = document.getElementById('savePill');
  const typing = Object.keys(pendingPatch).length > 0;
  pill.classList.remove('is-error', 'is-saved');
  if (failedWrites.size){
    pill.textContent = t('admin.save.failed');
    pill.classList.add('is-error');
  } else if (writesInFlight || typing){
    pill.textContent = t('admin.save.saving');
  } else if (currentId && savedShowtimeId === currentId){
    pill.textContent = t('admin.save.saved');
    pill.classList.add('is-saved');
  } else {
    pill.classList.add('hidden');
    return;
  }
  pill.classList.remove('hidden');
}

// Closing the tab mid-save would lose the change; the browser asks first.
window.addEventListener('beforeunload', (e) => {
  if (writesInFlight || failedWrites.size || Object.keys(pendingPatch).length){
    flushPendingPatch();
    e.preventDefault();
    e.returnValue = '';
  }
});

// Waits for everything typed so far to reach the server.
async function settleWrites(){
  flushPendingPatch();
  await saveQueue;
}

async function duplicateShowtime(){
  if (!currentId) return;
  await settleWrites();
  try{
    const res = await fetch('/api/showtimes/' + encodeURIComponent(currentId) + '/duplicate', { method: 'POST' });
    if (await handleAuthFailure(res)) return;
    if (!res.ok) throw new Error('failed');
    const copy = (await res.json()).showtime;
    navigate('#/showtime/' + encodeURIComponent(copy.id));
  }catch(e){
    alert(t('admin.status.saveFailed'));
  }
}

async function deleteShowtime(){
  if (!currentId) return;
  if (!confirm(t('admin.deleteConfirm'))) return;
  const id = currentId;
  await settleWrites();
  try{
    const res = await fetch('/api/showtimes/' + encodeURIComponent(id), { method: 'DELETE' });
    if (await handleAuthFailure(res)) return;
    if (!res.ok) throw new Error('failed to delete');
    // Nothing left to retry against a showtime that's gone.
    Array.from(failedWrites.keys()).filter(k => k.startsWith(id + ':')).forEach(k => failedWrites.delete(k));
    currentId = null;
    renderSavePill();
    location.replace(parentHash);
  }catch(e){
    alert(t('admin.deleteFailed'));
  }
}

// The showtime's own fields, saved as they change.
(function wireShowtimeFields(){
  const byId = (id) => document.getElementById(id);
  byId('theaterField').addEventListener('input', (e) => queuePatch({ theater: e.target.value }));
  byId('theaterField').addEventListener('blur', flushPendingPatch);
  byId('showDate').addEventListener('change', (e) => queuePatch({ date: e.target.value }, true));
  byId('showTime').addEventListener('change', (e) => queuePatch({ time: e.target.value }, true));
  byId('format').addEventListener('change', (e) => queuePatch({ format: e.target.value }, true));
  byId('screen').addEventListener('change', (e) => {
    // A different screen can mean a different list of formats.
    syncFormatOptions();
    queuePatch({ screen: e.target.value, format: byId('format').value }, true);
    buildSeatGrid();
  });
  byId('price').addEventListener('input', (e) => { queuePatch({ price: e.target.value }); updateSummary(); });
  byId('price').addEventListener('blur', flushPendingPatch);
  byId('showInfo').addEventListener('input', (e) => queuePatch({ info: e.target.value }));
  // Picking a suggestion fires change; send it then rather than waiting.
  byId('showInfo').addEventListener('change', flushPendingPatch);
})();

// Shared by both upload controls -- they're otherwise identical apart
// from which endpoint/DOM ids they use.
async function loadImagePreview(apiPath, imgId){
  const img = document.getElementById(imgId);
  try{
    const res = await fetch(apiPath);
    if (await handleAuthFailure(res)) return;
    if (!res.ok) return;
    const data = await res.json();
    if (data.url){
      img.src = data.url;
      img.classList.remove('hidden');
    } else {
      img.classList.add('hidden');
    }
  }catch(e){
    // Non-fatal -- the upload control still works even if this fails.
  }
}

async function uploadImage(apiPath, fileInputId, statusId, onDone){
  const input = document.getElementById(fileInputId);
  const statusEl = document.getElementById(statusId);
  if (!input.files || !input.files[0]){
    statusEl.textContent = t('admin.status.chooseImage');
    return;
  }
  statusEl.textContent = t('admin.status.uploading');
  const formData = new FormData();
  formData.append('image', input.files[0]);
  try{
    const res = await fetch(apiPath, { method: 'POST', body: formData });
    if (await handleAuthFailure(res)) return;
    if (!res.ok){
      const data = await res.json().catch(() => ({}));
      statusEl.textContent = data.error || t('admin.status.uploadFailed');
      return;
    }
    input.value = '';
    statusEl.textContent = t('admin.status.uploaded');
    onDone();
    setTimeout(() => { if (statusEl.textContent === t('admin.status.uploaded')) statusEl.textContent = ''; }, 1500);
  }catch(e){
    statusEl.textContent = t('admin.status.uploadFailed');
  }
}

function uploadOgImage(){ return uploadImage('/api/og-image', 'ogFileInput', 'ogStatus', loadOgPreview); }

function uploadLogo(){ return uploadImage('/api/logo-image', 'logoFileInput', 'logoStatus', loadLogoPreview); }

// ---------------- PAYMENT HANDLES ----------------
// ---------------- CONCESSIONS MENU ----------------
//
// One global menu shared by every showtime (see lib/concessionMenu.js).
// Edited as a plain list of rows and saved whole -- reordering, renaming
// and deleting are then all the same operation, and a row keeps its id
// across saves so editing an item is an edit rather than a delete plus a
// re-add (which would orphan it from carts that reference it).

let menuItems = [];     // [{id, name, price, note, section, optionGroup}] -- id is '' for a row added here and not yet saved
let optionGroups = [];  // [{id, label, options[]}] -- the choice lists items point at
let menuIsDefault = true;  // true while the built-in AMC menu is what's in effect
// Served alongside the menu so this panel and the reservation page can't
// drift apart on it. Applies to concessions only -- the tickets aren't
// taxed, and they're already paid for by the time this matters.
let concessionTaxRate = 0;

function renderMenuRows(){
  const container = document.getElementById('menuRows');
  container.innerHTML = '';
  refreshSectionSuggestions();
  if (menuItems.length === 0){
    const empty = document.createElement('div');
    empty.className = 'menu-empty';
    empty.textContent = t('admin.menuEditor.empty');
    container.appendChild(empty);
    return;
  }

  // Same split the reservation page makes: unsectioned rows inline,
  // named sections folded away. 25 candy bars between the food and the
  // option groups is a lot of scrolling past on the way to anything else.
  //
  // Rows are filed by whatever the section field said at render time and
  // do NOT jump between sections as it's typed -- re-rendering on every
  // keystroke would yank focus out of the field mid-word. A row lands in
  // its new section on the next save.
  const sections = new Map();
  menuItems.forEach((item, idx) => {
    if (!item.section){
      container.appendChild(buildMenuRow(item, idx));
      return;
    }
    if (!sections.has(item.section)) sections.set(item.section, []);
    sections.get(item.section).push({ item, idx });
  });
  sections.forEach((entries, name) => {
    const wrap = document.createElement('details');
    wrap.className = 'menu-section';
    const summary = document.createElement('summary');
    const label = document.createElement('span');
    label.textContent = name;
    summary.appendChild(label);
    const count = document.createElement('span');
    count.className = 'menu-section-count';
    count.textContent = entries.length + ' item' + (entries.length === 1 ? '' : 's');
    summary.appendChild(count);
    wrap.appendChild(summary);
    entries.forEach(({ item, idx }) => wrap.appendChild(buildMenuRow(item, idx)));
    container.appendChild(wrap);
  });
}

// Feeds the datalist behind each row's section field, so filing an item
// under an existing section is a pick rather than a retype it can only
// get subtly wrong (a section is matched by its exact text).
function refreshSectionSuggestions(){
  const list = document.getElementById('sectionSuggestions');
  const names = Array.from(new Set(menuItems.map(i => i.section).filter(Boolean))).sort();
  list.innerHTML = names.map(n => '<option value="' + escapeHtml(n) + '"></option>').join('');
}

function buildMenuRow(item, idx){
  const row = document.createElement('div');
  row.className = 'menu-row';

  const top = document.createElement('div');
  top.className = 'menu-row-top';

  const name = document.createElement('input');
  name.type = 'text';
  name.className = 'menu-name';
  name.placeholder = 'Item name (e.g. Large Popcorn)';
  name.maxLength = 120;
  name.value = item.name || '';
  name.addEventListener('input', () => { menuItems[idx].name = name.value; });
  top.appendChild(name);

  const priceWrap = document.createElement('div');
  priceWrap.className = 'menu-price-wrap';
  priceWrap.appendChild(document.createTextNode('$'));
  const price = document.createElement('input');
  price.type = 'number';
  price.className = 'menu-price';
  price.step = '0.01';
  price.min = '0';
  price.placeholder = '0.00';
  price.value = (typeof item.price === 'number' && item.price > 0) ? item.price.toFixed(2) : '';
  price.addEventListener('input', () => { menuItems[idx].price = price.value; });
  priceWrap.appendChild(price);
  top.appendChild(priceWrap);

  const remove = document.createElement('button');
  remove.type = 'button';
  remove.className = 'menu-remove-btn';
  remove.textContent = 'Remove';
  // Removing here only drops it off the menu -- orders already placed
  // keep their own copy of the name and price (see lib/seats.js), so
  // nobody's cart empties out because the host tidied the list.
  remove.onclick = () => {
    menuItems.splice(idx, 1);
    renderMenuRows();
    document.getElementById('menuStatus').textContent = t('admin.menuEditor.removed');
  };
  top.appendChild(remove);
  row.appendChild(top);

  const bottom = document.createElement('div');
  bottom.className = 'menu-row-bottom';

  // Free text shown under the item on the reservation page. Nothing
  // computes off it -- "50c off" is a label explaining why the price
  // isn't the price on the board, not a discount the app applies.
  const note = document.createElement('input');
  note.type = 'text';
  note.className = 'menu-note';
  note.placeholder = 'Note shown to friends (e.g. 50\u00a2 off)';
  note.maxLength = 120;
  note.value = item.note || '';
  note.addEventListener('input', () => { menuItems[idx].note = note.value; });
  bottom.appendChild(note);

  // Presentation only: a named section is collapsed behind a header both
  // here and in the friend's cart. Blank keeps the item in the main list.
  const section = document.createElement('input');
  section.type = 'text';
  section.className = 'menu-section-input';
  section.setAttribute('list', 'sectionSuggestions');
  section.placeholder = 'Section';
  section.maxLength = 60;
  section.value = item.section || '';
  section.addEventListener('input', () => { menuItems[idx].section = section.value; });
  bottom.appendChild(section);

  // Which list of choices this item comes with, if any. Rebuilt from
  // optionGroups every render, so adding a group makes it selectable on
  // every item without a reload.
  const group = document.createElement('select');
  group.className = 'menu-group';
  const none = document.createElement('option');
  none.value = '';
  none.textContent = t('admin.menuEditor.noChoices');
  group.appendChild(none);
  optionGroups.forEach(g => {
    const opt = document.createElement('option');
    opt.value = g.id;
    opt.textContent = g.label || 'Untitled group';
    group.appendChild(opt);
  });
  // A brand-new group has no id until it's saved, so an item can't point
  // at one yet -- selecting it falls back to "No choices" here and the
  // host reassigns after saving. Keeps ids the single source of truth
  // rather than matching groups by their (editable) label.
  group.value = optionGroups.some(g => g.id && g.id === item.optionGroup) ? item.optionGroup : '';
  menuItems[idx].optionGroup = group.value;
  group.addEventListener('change', () => { menuItems[idx].optionGroup = group.value; });
  bottom.appendChild(group);

  row.appendChild(bottom);
  return row;
}

// ---------- option groups ----------

function renderGroupRows(){
  const container = document.getElementById('groupRows');
  container.innerHTML = '';
  if (optionGroups.length === 0){
    const empty = document.createElement('div');
    empty.className = 'menu-empty';
    empty.textContent = t('admin.menuEditor.groupsEmpty');
    container.appendChild(empty);
    return;
  }
  optionGroups.forEach((g, idx) => container.appendChild(buildGroupRow(g, idx)));
}

function buildGroupRow(group, idx){
  const row = document.createElement('div');
  row.className = 'group-row';

  const top = document.createElement('div');
  top.className = 'group-row-top';

  const label = document.createElement('input');
  label.type = 'text';
  label.className = 'group-label';
  label.placeholder = 'Group name (e.g. Sauce)';
  label.maxLength = 60;
  label.value = group.label || '';
  // Updates the matching <option> text in place rather than re-rendering
  // the item rows, which would yank focus out of this field mid-word.
  label.addEventListener('input', () => {
    optionGroups[idx].label = label.value;
    document.querySelectorAll('#menuRows select.menu-group option').forEach(opt => {
      if (opt.value && opt.value === optionGroups[idx].id) opt.textContent = label.value || 'Untitled group';
    });
    used.textContent = groupUsageLabel(optionGroups[idx].id);
  });
  top.appendChild(label);

  const used = document.createElement('div');
  used.className = 'group-used';
  used.textContent = groupUsageLabel(group.id);
  top.appendChild(used);

  const remove = document.createElement('button');
  remove.type = 'button';
  remove.className = 'menu-remove-btn';
  remove.textContent = 'Remove';
  // Items pointing at it fall back to "No choices" -- the server drops
  // dangling references on save too, so the two can't disagree.
  remove.onclick = () => {
    const goneId = optionGroups[idx].id;
    optionGroups.splice(idx, 1);
    menuItems.forEach(it => { if (it.optionGroup === goneId) it.optionGroup = ''; });
    renderGroupRows();
    renderMenuRows();
    document.getElementById('menuStatus').textContent = t('admin.menuEditor.removed');
  };
  top.appendChild(remove);
  row.appendChild(top);

  const box = document.createElement('textarea');
  box.className = 'option-box';
  box.placeholder = t('admin.menuEditor.optionsPlaceholder');
  box.value = (group.options || []).join('\n');
  box.addEventListener('input', () => {
    optionGroups[idx].options = box.value.split('\n').map(v => v.trim()).filter(Boolean);
  });
  row.appendChild(box);

  return row;
}

// "used by 3 items" / "not used yet" -- the answer to "can I delete this",
// which is otherwise a scroll back up through 39 dropdowns.
function groupUsageLabel(id){
  if (!id) return 'new';
  const n = menuItems.filter(it => it.optionGroup === id).length;
  return n === 0
    ? t('admin.menuEditor.groupUnused')
    : t(n === 1 ? 'admin.menuEditor.groupUsedOne' : 'admin.menuEditor.groupUsedMany', { count: n });
}

function addOptionGroup(){
  optionGroups.push({ id: '', label: '', options: [] });
  renderGroupRows();
  const labels = document.querySelectorAll('#groupRows input.group-label');
  if (labels.length) labels[labels.length - 1].focus();
}

function addMenuRow(){
  menuItems.push({ id: '', name: '', price: '', note: '', section: '', optionGroup: '' });
  renderMenuRows();
  const inputs = document.querySelectorAll('#menuRows input.menu-name');
  if (inputs.length) inputs[inputs.length - 1].focus();
}

// Applies a {items, optionGroups, isDefault} payload from either endpoint to
// the whole panel, so load, save and reset all land the same way.
function applyMenuPayload(data){
  menuItems = Array.isArray(data.items) ? data.items : [];
  if (typeof data.taxRate === 'number') concessionTaxRate = data.taxRate;
  optionGroups = Array.isArray(data.optionGroups) ? data.optionGroups : [];
  menuIsDefault = !!data.isDefault;
  // Nothing to restore to while the built-ins are already what's showing.
  document.getElementById('menuResetBtn').classList.toggle('hidden', menuIsDefault);
  // Groups first: the item rows build their dropdowns from them.
  renderGroupRows();
  renderMenuRows();
}

// What the panel says when it isn't reporting the result of an action.
function menuRestingStatus(){
  return menuIsDefault
    ? t('admin.menuEditor.usingDefault')
    : '';
}

async function loadConcessionMenu(){
  try{
    const res = await fetch('/api/concession-menu');
    if (await handleAuthFailure(res)) return;
    if (!res.ok) return;
    applyMenuPayload(await res.json());
    document.getElementById('menuStatus').textContent = menuRestingStatus();
  }catch(e){
    document.getElementById('menuStatus').textContent = t('admin.menuEditor.loadFailed');
  }
}

async function resetConcessionMenu(){
  if (!confirm(t('admin.menuEditor.resetConfirm'))) return;
  const statusEl = document.getElementById('menuStatus');
  statusEl.textContent = t('admin.menuEditor.restoring');
  try{
    const res = await fetch('/api/concession-menu/reset', { method: 'POST' });
    if (await handleAuthFailure(res)) return;
    if (!res.ok){ statusEl.textContent = t('admin.menuEditor.restoreFailed'); return; }
    applyMenuPayload(await res.json());
    statusEl.textContent = t('admin.menuEditor.restored');
  }catch(e){
    statusEl.textContent = t('admin.menuEditor.restoreFailed');
  }
}

async function saveConcessionMenu(){
  const statusEl = document.getElementById('menuStatus');
  statusEl.textContent = t('admin.status.saving');
  try{
    const res = await fetch('/api/concession-menu', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ items: menuItems, optionGroups })
    });
    if (await handleAuthFailure(res)) return;
    if (!res.ok){ statusEl.textContent = t('admin.status.saveFailed'); return; }
    // Re-render from what the server actually stored: blank rows are
    // dropped there, duplicate options collapsed, and new rows come back
    // with the id they were given, which is what keeps the next save an
    // edit instead of a duplicate.
    applyMenuPayload(await res.json());
    statusEl.textContent = t('admin.status.saved');
  }catch(e){
    statusEl.textContent = t('admin.status.saveFailed');
  }
}

async function loadPaymentHandles(){
  try{
    const res = await fetch('/api/payment-handles');
    if (await handleAuthFailure(res)) return;
    if (!res.ok) return;
    const data = await res.json();
    document.getElementById('venmoInput').value = data.venmo || '';
    document.getElementById('cashappInput').value = data.cashapp || '';
  }catch(e){
    // Non-fatal -- the fields just start blank if this fails.
  }
}

async function savePaymentHandles(){
  const venmoInput = document.getElementById('venmoInput');
  const cashappInput = document.getElementById('cashappInput');
  const statusEl = document.getElementById('paymentHandlesStatus');
  statusEl.textContent = t('admin.status.saving');
  try{
    const res = await fetch('/api/payment-handles', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ venmo: venmoInput.value, cashapp: cashappInput.value })
    });
    if (await handleAuthFailure(res)) return;
    if (!res.ok){
      statusEl.textContent = t('admin.status.saveFailed');
      return;
    }
    const data = await res.json();
    venmoInput.value = data.venmo || '';
    cashappInput.value = data.cashapp || '';
    statusEl.textContent = t('admin.status.saved');
    setTimeout(() => { if (statusEl.textContent === t('admin.status.saved')) statusEl.textContent = ''; }, 1500);
  }catch(e){
    statusEl.textContent = t('admin.status.saveFailed');
  }
}

// Rebuilds the Format dropdown from the selected screen's `formats`
// (seat-layout.js), keeping `preferred` -- or failing that, whatever was
// picked before -- if this screen offers it, else its first format. A
// showtime saved with a format its screen doesn't offer (from before
// formats were tied to screens) opens on the screen's default instead,
// and saving writes that. A screen with a single format gets a disabled
// dropdown: it still shows the format, there's just nothing to pick.
function syncFormatOptions(preferred){
  const select = document.getElementById('format');
  const layout = SEAT_LAYOUTS[document.getElementById('screen').value] || SEAT_LAYOUTS[DEFAULT_SCREEN];
  const formats = layout.formats || [];
  const want = preferred !== undefined ? preferred : select.value;
  select.innerHTML = '';
  formats.forEach(f => {
    const option = document.createElement('option');
    option.textContent = f;
    select.appendChild(option);
  });
  select.value = formats.includes(want) ? want : (formats[0] || '');
  select.disabled = formats.length < 2;
}

// Builds the Screen dropdown's options from SEAT_LAYOUTS (seat-layout.js),
// grouped by theater, so adding a new auditorium there is the only thing
// that's ever needed -- nothing here to keep in sync by hand.
function populateScreenOptions(){
  const select = document.getElementById('screen');
  select.innerHTML = '';
  const groups = {};
  const groupOrder = [];
  Object.keys(SEAT_LAYOUTS).forEach(screenId => {
    const layout = SEAT_LAYOUTS[screenId];
    if (!groups[layout.theater]) {
      groups[layout.theater] = [];
      groupOrder.push(layout.theater);
    }
    groups[layout.theater].push({ screenId, layout });
  });
  groupOrder.forEach(theaterName => {
    const optgroup = document.createElement('optgroup');
    optgroup.label = theaterName;
    groups[theaterName].forEach(({ screenId, layout }) => {
      const option = document.createElement('option');
      option.value = screenId;
      option.textContent = layout.name
        ? t('admin.auditorium', { number: layout.auditorium, name: layout.name })
        : t('admin.auditoriumUnnamed', { number: layout.auditorium });
      optgroup.appendChild(option);
    });
    select.appendChild(optgroup);
  });
}

// ---------------- INIT ----------------
populateScreenOptions();
syncFormatOptions();
route();
loadInfoSuggestions();
loadOgPreview();
loadLogoPreview();
loadPaymentHandles();
loadConcessionMenu();
