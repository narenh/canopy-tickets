<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover lets the page draw under the notch/status bar and
     the home indicator instead of iOS letterboxing it -- what lets the
     backdrop below run edge to edge. Nothing else here sits near an edge
     (the card is centered), so there's nothing to pad back in. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Canopy Tickets</title>
<!-- OG_META -->
<style>
  :root{
    --gold:#c9a24b;
    --bg:#0b0b0d;
    --muted:#9a9a9a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--bg);
    color:#fff;
    font-family:-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    padding:20px;
  }
  .hidden{display:none !important;}
  .card{
    width:100%;
    max-width:340px;
    background:#151517;
    border:1px solid #2a2a2a;
    border-radius:14px;
    padding:28px 24px;
  }
  .site-logo{
    display:block;
    max-height:56px;
    max-width:100%;
    width:auto;
    height:auto;
    margin:0 auto 14px;
  }
  /* When a logo was uploaded, the site name in it is enough -- drop the
     redundant "Canopy Tickets" heading rather than show both. */
  .site-logo ~ h1{display:none;}
  h1{font-size:20px;margin:0 0 6px;}
  h2{font-size:19px;margin:0 0 4px;text-align:center;}
  p{
    margin:0 0 20px;
    color:var(--muted);
    font-size:13px;
    text-align:center;
    line-height:1.4;
  }
  .for-email{margin-bottom:18px;}
  .for-email button{
    width:auto;
    background:none;
    color:var(--gold);
    padding:0;
    font-size:13px;
    font-weight:600;
  }
  /* 16px: iOS Safari zooms the page in when a smaller control takes focus. */
  input[type="email"], input[type="text"], input[type="password"]{
    width:100%;
    background:#0f0f10;
    color:#fff;
    border:1px solid #3a3a3a;
    border-radius:10px;
    padding:12px 14px;
    font-size:16px;
    margin-bottom:12px;
  }
  .name-row{display:flex;gap:10px;}
  .name-row input{min-width:0;}
  button{
    width:100%;
    background:var(--gold);
    color:#241c07;
    border:none;
    border-radius:12px;
    padding:12px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
  }
  button:disabled{opacity:.5;cursor:not-allowed;}
  /* The second way in, under "or": quieter than the passkey button. */
  button.secondary{
    background:#1e1e21;
    color:#fff;
    border:1px solid #3a3a3a;
  }
  .passkey-btn{display:flex;align-items:center;justify-content:center;gap:8px;}
  .passkey-btn svg{width:18px;height:18px;flex:0 0 auto;}
  .or{
    display:flex;
    align-items:center;
    gap:10px;
    color:var(--muted);
    font-size:12px;
    margin:18px 0 14px;
  }
  .or::before, .or::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.14);}
  .hint{font-size:12px;margin:12px 0 0;}
  .admin-setup-link{margin:16px 0 0;}
  .admin-setup-link button{
    width:auto;
    background:none;
    color:var(--muted);
    padding:0;
    font-size:12px;
    font-weight:600;
    text-decoration:underline;
  }
  .error{
    color:#e2857a;
    font-size:13px;
    min-height:18px;
    margin-bottom:6px;
    text-align:center;
  }

  /* The photo, like a phone's contact photo: a silhouette in a circle
     with a "+" badge until there's a photo, then the photo with a pencil
     badge (tap again to pick another). The whole thing, badge included,
     is the tap target. */
  .photo-pick{
    position:relative;
    display:block;
    width:112px;
    height:112px;
    margin:0 auto;
    cursor:pointer;
  }
  .photo-circle{
    width:100%;
    height:100%;
    border-radius:50%;
    overflow:hidden;
    background:#26262a;
    border:1px solid rgba(255,255,255,.12);
    display:flex;
    align-items:flex-end;
    justify-content:center;
  }
  .photo-pick.has-photo .photo-circle{border:2px solid var(--gold);}
  .photo-circle img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-circle svg{width:78%;height:78%;display:block;}
  .photo-badge{
    position:absolute;
    right:2px;
    bottom:2px;
    width:32px;
    height:32px;
    border-radius:50%;
    background:var(--gold);
    border:3px solid #151517;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .photo-badge svg{width:14px;height:14px;display:block;}
  .photo-badge .icon-edit{display:none;}
  .photo-pick.has-photo .photo-badge .icon-add{display:none;}
  .photo-pick.has-photo .photo-badge .icon-edit{display:block;}
  .photo-pick input{position:absolute;inset:0;opacity:0;cursor:pointer;}
  .photo-pick{margin-bottom:18px;}
  body.has-backdrop .photo-badge{border-color:#2a2a2d;}

  /* The link-preview image fills the screen behind a frosted-glass card.
     cover on a fixed layer fills the height of a portrait phone and crops
     the 16:9 image's sides; the dim keeps the card readable over a busy
     frame. 100lvh rather than bottom:0: the large viewport is the height
     with Safari's toolbars collapsed, so the image still reaches the
     bottom edge behind a translucent toolbar. The page colour moves from
     body to html, so the script can set it without body painting a solid
     box over the backdrop (which sits at z-index -1). */
  html.has-backdrop{background:var(--bg);}
  html.has-backdrop body{background:transparent;}
  body.has-backdrop::before{
    content:"";
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:100lvh;
    z-index:-1;
    background:var(--backdrop) center / cover no-repeat, var(--bg);
  }
  body.has-backdrop::after{
    content:"";
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:100lvh;
    z-index:-1;
    background:rgba(0,0,0,0.25);
  }
  /* iOS Safari 26 paints the strips behind its status bar and toolbar a
     single solid colour it picks from the page -- a fixed bar touching
     that edge if there is one, the page background if not -- and won't
     show the image there. These two bars give it a colour to pick: each
     is the average colour of the image's edge (set by the script below)
     and fades into the image. */
  .edge-tint{
    position:fixed;
    left:0;
    right:0;
    height:40px;
    z-index:0;
    pointer-events:none;
    background-color:transparent;
  }
  .edge-tint.top{
    top:0;
    -webkit-mask-image:linear-gradient(to bottom, #000, transparent);
    mask-image:linear-gradient(to bottom, #000, transparent);
  }
  .edge-tint.bottom{
    bottom:0;
    -webkit-mask-image:linear-gradient(to top, #000, transparent);
    mask-image:linear-gradient(to top, #000, transparent);
  }
  body.has-backdrop .card{
    background:rgba(21,21,23,0.45);
    border-color:rgba(255,255,255,0.14);
    -webkit-backdrop-filter:blur(20px) saturate(140%);
    backdrop-filter:blur(20px) saturate(140%);
    box-shadow:0 10px 40px rgba(0,0,0,0.35);
  }
  body.has-backdrop p{color:#d0d0d0;}
  body.has-backdrop input[type="email"], body.has-backdrop input[type="text"], body.has-backdrop input[type="password"]{
    background:rgba(0,0,0,0.35);
    border-color:rgba(255,255,255,0.18);
  }
</style>
</head>
<body data-backdrop="__OG_IMAGE_URL__">
  <div class="edge-tint top" id="edgeTop" aria-hidden="true"></div>
  <div class="edge-tint bottom" id="edgeBottom" aria-hidden="true"></div>

  <!-- First run (no admin yet), or ADMIN_RECOVERY: the setup password
       (ADMIN_PASSWORD) first; whoever then signs in or up here becomes
       the admin. -->
  <form class="card hidden" id="adminSetupForm">
    <!-- LOGO_IMG -->
    <h2 data-copy="welcome.adminSetupHeading"></h2>
    <p data-copy="welcome.adminSetupHint"></p>
    <div class="error" id="adminSetupError"></div>
    <input type="password" id="adminSetupPassword" placeholder="Setup password" autocomplete="off">
    <button type="submit" id="adminSetupBtn" data-copy="welcome.setupButton"></button>
    <p class="for-email" id="adminSetupBack" style="margin:14px 0 0"><button type="button" onclick="showCard('emailForm')" data-copy="welcome.back"></button></p>
  </form>

  <!-- Step 1: sign in with a passkey, or an email to get one. -->
  <form class="card" id="emailForm">
    <!-- LOGO_IMG -->
    <h1>Canopy Tickets</h1>
    <p data-copy="welcome.tagline"></p>
    <div class="error" id="emailError"></div>
    <button type="button" class="passkey-btn" id="signInBtn" onclick="signIn('emailError', 'signInBtn')">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="9" r="4.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M11.5 12.5l8.5 8.5M17 18l2-2M15 16l1.6-1.6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      <span data-copy="welcome.signIn"></span>
    </button>
    <div class="or" data-copy="welcome.or"></div>
    <input type="email" id="email" placeholder="Email" autocomplete="email" autocapitalize="off" spellcheck="false" required>
    <button type="submit" class="secondary" id="emailBtn" data-copy="welcome.continueEmail"></button>
    <!-- Only while there's no admin yet (or in recovery). -->
    <p class="admin-setup-link hidden" id="adminSetupLink"><button type="button" onclick="showAdminSetup()" data-copy="welcome.adminSetupLink"></button></p>
  </form>

  <!-- A profile from before passkeys (or reset by the host): any movie's
       password, then the passkey. -->
  <form class="card hidden" id="setupForm">
    <h2 id="setupHeading"></h2>
    <p class="for-email"><span class="email-label"></span> &middot; <button type="button" onclick="backToEmail()">Change</button></p>
    <p id="setupHint" data-copy="welcome.setupHint"></p>
    <div class="error" id="setupError"></div>
    <input type="password" id="moviePassword" placeholder="Movie password" autocomplete="off">
    <button type="submit" id="setupBtn" data-copy="welcome.setupButton"></button>
  </form>

  <!-- A profile that already has a passkey: only that gets in. -->
  <div class="card hidden" id="hasPasskeyCard">
    <h2 id="hasPasskeyHeading"></h2>
    <p class="for-email"><span class="email-label"></span> &middot; <button type="button" onclick="backToEmail()">Change</button></p>
    <p data-copy="welcome.hasPasskeyHint"></p>
    <div class="error" id="hasPasskeyError"></div>
    <button type="button" class="passkey-btn" id="hasPasskeyBtn" onclick="signIn('hasPasskeyError', 'hasPasskeyBtn')" data-copy="welcome.signIn"></button>
    <!-- After the setup password (recovery): a lost passkey's replacement. -->
    <button type="button" class="secondary hidden" id="newPasskeyBtn" style="margin-top:10px" onclick="enrollAfterSetup('hasPasskeyError', 'newPasskeyBtn')" data-copy="welcome.newPasskey"></button>
  </div>

  <!-- Step 2, for an email we haven't seen: name and photo, all required. -->
  <form class="card hidden" id="profileForm">
    <h2 data-copy="welcome.profileHeading"></h2>
    <p class="for-email"><span class="email-label"></span> &middot; <button type="button" onclick="backToEmail()">Change</button></p>
    <label class="photo-pick" id="photoPick">
      <span class="photo-circle">
        <img id="photoPreview" class="hidden" alt="">
        <!-- Placeholder silhouette until a photo is picked. -->
        <svg id="photoPrompt" viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="25" r="12" fill="#6e6e74"/>
          <path d="M8 64c0-14 10.7-24 24-24s24 10 24 24z" fill="#6e6e74"/>
        </svg>
      </span>
      <span class="photo-badge" aria-hidden="true">
        <svg class="icon-add" viewBox="0 0 14 14"><path d="M7 1.5v11M1.5 7h11" stroke="#241c07" stroke-width="2.4" stroke-linecap="round"/></svg>
        <svg class="icon-edit" viewBox="0 0 14 14"><path d="M2 12l.6-3L9.4 2.2a1.4 1.4 0 0 1 2 0l.4.4a1.4 1.4 0 0 1 0 2L5 11.4z" fill="#241c07"/></svg>
      </span>
      <input type="file" id="photoInput" accept="image/*" aria-label="Add a profile photo">
    </label>
    <div class="name-row">
      <input type="text" id="firstName" placeholder="First name" autocomplete="given-name" maxlength="60">
      <input type="text" id="lastName" placeholder="Last name" autocomplete="family-name" maxlength="60">
    </div>
    <div class="error" id="profileError"></div>
    <button type="submit" id="profileBtn">Sign up</button>
    <p class="hint" data-copy="welcome.signUpHint"></p>
  </form>

<script src="/copy.js"></script>
<script src="/vendor/cropperjs-1.6.3/cropper.min.js"></script>
<script src="/photo-crop.js"></script>
<script src="/vendor/simplewebauthn-browser-14.0.0/index.umd.min.js"></script>
<script>
applyCopy();

// ---------------- Backdrop ----------------
// The link-preview image behind the card, when one has been uploaded.
const BACKDROP = document.body.getAttribute('data-backdrop');
if (BACKDROP && BACKDROP.charAt(0) === '/'){
  document.body.style.setProperty('--backdrop', 'url("' + BACKDROP + '")');
  document.body.classList.add('has-backdrop');
  document.documentElement.classList.add('has-backdrop');
  tintEdgesFrom(BACKDROP);
}

// Works out the colour along the top and bottom edges of the backdrop as
// it's actually cropped on this screen (cover, centered), and hands each
// to its .edge-tint bar -- and the bottom one to the page background too,
// for a Safari that ignores the bars and only reads that. Scaled down to
// a few dozen pixels first: an average doesn't need the full 4K image.
function tintEdgesFrom(url){
  const img = new Image();
  img.onload = () => {
    try{
      const vw = window.innerWidth, vh = window.innerHeight;
      const cw = 48, ch = Math.max(2, Math.round(cw * vh / vw));
      const scale = Math.max(cw / img.naturalWidth, ch / img.naturalHeight);
      const dw = img.naturalWidth * scale, dh = img.naturalHeight * scale;
      const canvas = document.createElement('canvas');
      canvas.width = cw;
      canvas.height = ch;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, (cw - dw) / 2, (ch - dh) / 2, dw, dh);
      // 0.75: the backdrop sits under a 25% black dim (body::after).
      const edge = (y) => {
        const d = ctx.getImageData(0, y, cw, 1).data;
        const sum = [0, 0, 0];
        for (let i = 0; i < d.length; i += 4){ sum[0] += d[i]; sum[1] += d[i + 1]; sum[2] += d[i + 2]; }
        return 'rgb(' + sum.map(v => Math.round(v / cw * 0.75)).join(',') + ')';
      };
      const top = edge(0), bottom = edge(ch - 1);
      document.getElementById('edgeTop').style.backgroundColor = top;
      document.getElementById('edgeBottom').style.backgroundColor = bottom;
      document.documentElement.style.backgroundColor = bottom;
    }catch(e){
      // Leave the default dark strips.
    }
  };
  img.src = url;
}

// ---------------- Passkeys ----------------
// Signing in is a passkey (Face ID / Touch ID / the phone's lock) and
// nothing else. The server hands out a challenge, the browser has the
// phone sign it, the server checks it -- SimpleWebAuthnBrowser does the
// browser half.
// (Inlined by the server -- see INLINE_SCRIPTS in server.js. If it's
// somehow missing, say so rather than leaving dead buttons.)
const { startRegistration, startAuthentication, browserSupportsWebAuthn } = window.SimpleWebAuthnBrowser || {
  startRegistration: () => Promise.reject(new Error('passkey library did not load -- reload the page')),
  startAuthentication: () => Promise.reject(new Error('passkey library did not load -- reload the page')),
  browserSupportsWebAuthn: () => true
};

let email = '';

// Signed in: the same URL now serves the reservation page -- or, having
// just set up (or recovered) the admin account, straight to the editor.
let adminFlow = false;
function enter(){
  if (adminFlow) window.location.href = '/admin';
  else window.location.reload();
}

async function postJson(url, body){
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {})
  });
  const data = await res.json().catch(() => ({}));
  return { res, data };
}

// What a failed passkey prompt means, in words. NotAllowedError is the
// browser's answer for cancelled, timed out, and "no passkey here" alike
// -- nearly always someone tapping Cancel, so it says nothing (empty
// string) and leaves them where they were. Anything else carries the
// browser's own error after the generic line, so a report from a phone
// says what actually went wrong.
function passkeyErrorText(err, making){
  if (err && err.name === 'NotAllowedError') return '';
  if (err && err.name === 'InvalidStateError') return t('welcome.passkeyExists');
  return t('welcome.failed') + detail(err && (err.name + ': ' + err.message));
}

function detail(text){
  return text ? ' (' + String(text).slice(0, 160) + ')' : '';
}

// Makes the passkey from the server's options and sends it back. Returns
// true once signed in; otherwise puts the reason in errorEl.
async function finishRegistration(options, errorEl){
  let response;
  try{
    response = await startRegistration({ optionsJSON: options });
  }catch(err){
    errorEl.textContent = passkeyErrorText(err, true);
    return false;
  }
  const { res, data } = await postJson('/api/auth/register/verify', { response });
  if (res.ok) return true;
  errorEl.textContent = data.reason === 'has_passkey' ? t('welcome.hasPasskeyNow')
    : data.reason === 'conflict' ? t('welcome.emailTaken')
    : data.reason === 'expired' ? t('welcome.expired')
    : t('welcome.failed') + detail(data.error || res.status);
  return false;
}

async function signIn(errorId, btnId){
  const errorEl = document.getElementById(errorId);
  const btn = document.getElementById(btnId);
  errorEl.textContent = '';
  btn.disabled = true;
  try{
    const start = await postJson('/api/auth/login/options');
    if (!start.res.ok){ errorEl.textContent = t('welcome.failed') + detail(start.data.error || start.res.status); return; }
    let response;
    try{
      response = await startAuthentication({ optionsJSON: start.data.options });
    }catch(err){
      errorEl.textContent = passkeyErrorText(err, false);
      return;
    }
    const { res, data } = await postJson('/api/auth/login/verify', { response });
    if (res.ok){ enter(); return; }
    errorEl.textContent = data.reason === 'unknown_passkey' ? t('welcome.unknownPasskey') : t('welcome.failed') + detail(data.error || res.status);
  }catch(err){
    errorEl.textContent = t('welcome.unreachable');
  }finally{
    btn.disabled = false;
  }
}

// No passkeys in this browser at all (old phones, some in-app browsers):
// say so up front rather than failing at the last step.
if (!browserSupportsWebAuthn()){
  document.getElementById('emailError').textContent = t('welcome.noPasskeys');
  document.getElementById('signInBtn').disabled = true;
}

// ---------------- Step 1: email ----------------
const CARDS = ['adminSetupForm', 'emailForm', 'profileForm', 'setupForm', 'hasPasskeyCard'];
let canEnroll = false;   // the setup password was entered: no movie password needed
function showCard(id){
  CARDS.forEach(c => document.getElementById(c).classList.toggle('hidden', c !== id));
  document.querySelectorAll('.email-label').forEach(el => { el.textContent = email; });
}

document.getElementById('emailForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('emailError');
  const btn = document.getElementById('emailBtn');
  errorEl.textContent = '';
  btn.disabled = true;
  try{
    const { res, data } = await postJson('/api/auth/lookup', { email: document.getElementById('email').value });
    if (res.status === 400){ errorEl.textContent = t('welcome.badEmail'); return; }
    if (!res.ok){ errorEl.textContent = t('welcome.failed'); return; }
    email = data.email;
    canEnroll = !!data.canEnroll;
    if (data.state === 'new'){
      showCard('profileForm');
      document.getElementById('firstName').focus();
    } else if (data.state === 'setup'){
      document.getElementById('setupHeading').textContent = t('welcome.welcomeBack', { name: data.firstName });
      document.getElementById('setupError').textContent = '';
      // After the setup password there's no movie password to ask for.
      document.getElementById('moviePassword').classList.toggle('hidden', canEnroll);
      document.getElementById('setupHint').textContent = t(canEnroll ? 'welcome.setupHintAdmin' : 'welcome.setupHint');
      showCard('setupForm');
      if (!canEnroll) document.getElementById('moviePassword').focus();
    } else {
      document.getElementById('hasPasskeyHeading').textContent = t('welcome.welcomeBack', { name: data.firstName });
      document.getElementById('hasPasskeyError').textContent = '';
      document.getElementById('newPasskeyBtn').classList.toggle('hidden', !canEnroll);
      showCard('hasPasskeyCard');
    }
  }catch(err){
    errorEl.textContent = t('welcome.unreachable');
  }finally{
    btn.disabled = false;
  }
});

function backToEmail(){
  showCard('emailForm');
  document.getElementById('email').focus();
}

// ---------------- First run: the setup password ----------------
// With no admin (a brand-new install) the page is only this: no account
// can exist before the admin's, and the server refuses everything else
// until it's done. In recovery it's the small "Admin setup" link under
// sign-in, so friends aren't asked for a password they don't have. Once
// it's right, the usual sign-up / sign-in follows on this browser.
function showAdminSetup(){
  showCard('adminSetupForm');
  document.getElementById('adminSetupPassword').focus();
}

function adminSetupDone(){
  adminFlow = true;
  document.getElementById('adminSetupLink').classList.add('hidden');
  document.querySelector('#emailForm [data-copy="welcome.tagline"]').textContent = t('welcome.taglineAdmin');
  showCard('emailForm');
}

(async function checkAdminSetup(){
  try{
    const st = await (await fetch('/api/auth/state')).json();
    if (!st.adminSetup) return;
    if (st.adminSetupGranted){ adminSetupDone(); return; }
    if (st.adminExists){
      document.getElementById('adminSetupLink').classList.remove('hidden');
      return;
    }
    // Nothing to go back to.
    document.getElementById('adminSetupBack').classList.add('hidden');
    showAdminSetup();
  }catch(e){}
})();

document.getElementById('adminSetupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('adminSetupError');
  const btn = document.getElementById('adminSetupBtn');
  errorEl.textContent = '';
  btn.disabled = true;
  try{
    const { res } = await postJson('/api/auth/admin-setup', { password: document.getElementById('adminSetupPassword').value });
    if (!res.ok){
      errorEl.textContent = res.status === 403 ? t('welcome.wrongSetupPassword')
        : res.status === 429 ? t('welcome.tooMany') : t('welcome.failed');
      return;
    }
    adminSetupDone();
  }catch(err){
    errorEl.textContent = t('welcome.unreachable');
  }finally{
    btn.disabled = false;
  }
});

// After the setup password: a passkey for an existing profile, no movie
// password -- including another one for a profile that has one (recovery).
async function enrollAfterSetup(errorId, btnId){
  const errorEl = document.getElementById(errorId);
  const btn = document.getElementById(btnId);
  errorEl.textContent = '';
  btn.disabled = true;
  try{
    const { res, data } = await postJson('/api/auth/register/setup', { email });
    if (!res.ok){ errorEl.textContent = t('welcome.failed') + detail(data.error || res.status); return; }
    if (await finishRegistration(data.options, errorEl)) enter();
  }catch(err){
    errorEl.textContent = t('welcome.unreachable');
  }finally{
    btn.disabled = false;
  }
}

// ---------------- First passkey for an existing profile ----------------
document.getElementById('setupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (canEnroll){ enrollAfterSetup('setupError', 'setupBtn'); return; }
  const errorEl = document.getElementById('setupError');
  const btn = document.getElementById('setupBtn');
  errorEl.textContent = '';
  btn.disabled = true;
  try{
    const { res, data } = await postJson('/api/auth/register/setup', {
      email, moviePassword: document.getElementById('moviePassword').value
    });
    if (!res.ok){
      errorEl.textContent = res.status === 403 ? t('welcome.wrongMoviePassword')
        : res.status === 429 ? t('welcome.tooMany')
        : data.reason === 'has_passkey' ? t('welcome.hasPasskeyNow')
        : t('welcome.failed');
      return;
    }
    if (await finishRegistration(data.options, errorEl)) enter();
  }catch(err){
    errorEl.textContent = t('welcome.unreachable');
  }finally{
    btn.disabled = false;
  }
});

// ---------------- New profile: name + photo, then the passkey ----------------
let photoBlob = null;

// Sign up stays tappable; what's missing is said when it's tapped.
function missingForProfile(){
  if (!photoBlob) return t('welcome.photoRequired');
  if (!document.getElementById('firstName').value.trim() || !document.getElementById('lastName').value.trim()){
    return t('welcome.nameRequired');
  }
  return '';
}

// Picking a photo opens it for framing (public/photo-crop.js). Nothing
// leaves the phone until the passkey is made, and then only the framed
// square.
document.getElementById('photoInput').addEventListener('change', async (e) => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const errorEl = document.getElementById('profileError');
  errorEl.textContent = '';
  let result;
  try{
    result = await cropProfilePhoto(file, t('welcome.cropHint'));
  }catch(err){
    errorEl.textContent = t('welcome.photoUnreadable');
    return;
  }
  if (!result) return;
  photoBlob = result.blob;
  const preview = document.getElementById('photoPreview');
  preview.src = result.dataUrl;
  preview.classList.remove('hidden');
  document.getElementById('photoPrompt').classList.add('hidden');
  document.getElementById('photoPick').classList.add('has-photo');
  if (errorEl.textContent === t('welcome.photoRequired')) errorEl.textContent = '';
});

// The profile only exists once its passkey does (the server creates both
// together), so the photo goes up straight after, signed in.
document.getElementById('profileForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('profileError');
  const btn = document.getElementById('profileBtn');
  errorEl.textContent = missingForProfile();
  if (errorEl.textContent) return;
  btn.disabled = true;
  try{
    const { res, data } = await postJson('/api/auth/register/new', {
      email,
      firstName: document.getElementById('firstName').value,
      lastName: document.getElementById('lastName').value
    });
    if (res.status === 409){ errorEl.textContent = t('welcome.emailTaken'); return; }
    if (!res.ok){ errorEl.textContent = data.error || t('welcome.failed'); return; }
    if (!(await finishRegistration(data.options, errorEl))) return;
    const form = new FormData();
    form.append('photo', photoBlob, 'photo.jpg');
    await fetch('/api/profile/photo', { method: 'POST', body: form }).catch(() => {});
    // The reservation page offers "are these yours?" once, after this.
    try{ sessionStorage.setItem('canopy_new_profile', '1'); }catch(err){}
    enter();
  }catch(err){
    errorEl.textContent = t('welcome.unreachable');
  }finally{
    btn.disabled = false;
  }
});
</script>
