<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover lets the page draw under the notch/status bar and
     the home indicator instead of iOS letterboxing it -- what lets the
     backdrop below run edge to edge. Nothing else here sits near an edge
     (the form is centered), so there's nothing to pad back in. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Canopy Tickets</title>
<!-- OG_META -->
<style>
  :root{
    --gold:#c9a24b;
    --bg:#0b0b0d;
    --muted:#9a9a9a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--bg);
    color:#fff;
    font-family:-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    padding:20px;
  }
  form{
    width:100%;
    max-width:320px;
    background:#151517;
    border:1px solid #2a2a2a;
    border-radius:14px;
    padding:28px 24px;
  }
  .site-logo{
    display:block;
    max-height:56px;
    max-width:100%;
    width:auto;
    height:auto;
    margin:0 auto 14px;
  }
  /* When a logo was uploaded, the site name in it is enough -- drop the
     redundant "Canopy Tickets" heading rather than show both. */
  .site-logo ~ h1{
    display:none;
  }
  h1{
    font-size:20px;
    margin:0 0 6px;
  }
  p{
    margin:0 0 20px;
    color:var(--muted);
    font-size:13px;
    text-align:center;
  }
  /* 16px: iOS Safari zooms the page in when a smaller control takes focus,
     and this one is autofocused, so it would zoom before a tap. */
  input{
    width:100%;
    background:#0f0f10;
    color:#fff;
    border:1px solid #3a3a3a;
    border-radius:10px;
    padding:12px 14px;
    font-size:16px;
    margin-bottom:14px;
  }
  button{
    width:100%;
    background:var(--gold);
    color:#241c07;
    border:none;
    border-radius:12px;
    padding:12px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
  }
  /* Friend login only (see the script below): the link-preview image
     fills the screen behind a frosted-glass form. cover on a fixed layer
     fills the height of a portrait phone and crops the 16:9 image's
     sides; the dim keeps the form readable over a busy frame. */
  /* 100lvh rather than bottom:0: the large viewport is the height with
     Safari's toolbars collapsed, so the image still reaches the bottom
     edge behind a translucent toolbar instead of stopping above it. */
  /* The page colour moves from body to html here, so the script below
     can set it without body painting a solid box over the backdrop
     (which sits at z-index -1, behind body's own background). */
  html.has-backdrop{background:var(--bg);}
  html.has-backdrop body{background:transparent;}
  body.has-backdrop::before{
    content:"";
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:100lvh;
    z-index:-1;
    background:var(--backdrop) center / cover no-repeat, var(--bg);
  }
  body.has-backdrop::after{
    content:"";
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:100lvh;
    z-index:-1;
    background:rgba(0,0,0,0.25);
  }
  /* iOS Safari 26 paints the strips behind its status bar and toolbar a
     single solid colour it picks from the page -- a fixed bar touching
     that edge if there is one, the page background if not -- and won't
     show the image there. These two bars give it a colour to pick: each
     is the average colour of the image's edge (set by the script below)
     and fades into the image, so the strip reads as a continuation of
     it rather than a band. */
  .edge-tint{
    position:fixed;
    left:0;
    right:0;
    height:40px;
    z-index:0;
    pointer-events:none;
    background-color:transparent;
  }
  .edge-tint.top{
    top:0;
    -webkit-mask-image:linear-gradient(to bottom, #000, transparent);
    mask-image:linear-gradient(to bottom, #000, transparent);
  }
  .edge-tint.bottom{
    bottom:0;
    -webkit-mask-image:linear-gradient(to top, #000, transparent);
    mask-image:linear-gradient(to top, #000, transparent);
  }
  body.has-backdrop form{
    background:rgba(21,21,23,0.45);
    border-color:rgba(255,255,255,0.14);
    -webkit-backdrop-filter:blur(20px) saturate(140%);
    backdrop-filter:blur(20px) saturate(140%);
    box-shadow:0 10px 40px rgba(0,0,0,0.35);
  }
  body.has-backdrop p{color:#d0d0d0;}
  body.has-backdrop input{
    background:rgba(0,0,0,0.35);
    border-color:rgba(255,255,255,0.18);
  }
  .error{
    color:#e2857a;
    font-size:13px;
    min-height:18px;
    margin-bottom:6px;
  }
</style>
</head>
<body data-backdrop="__OG_IMAGE_URL__">
  <div class="edge-tint top" id="edgeTop" aria-hidden="true"></div>
  <div class="edge-tint bottom" id="edgeBottom" aria-hidden="true"></div>
  <form id="loginForm">
    <!-- LOGO_IMG -->
    <h1>Canopy Tickets</h1>
    <p data-copy="login.tagline"></p>
    <div class="error" id="errorMsg"></div>
    <input type="password" id="password" placeholder="Password" autofocus autocomplete="current-password">
    <button type="submit">Enter</button>
  </form>

<script src="/copy.js"></script>
<script>
// One form, two doors: / takes the friend password and /admin takes the
// admin one. Each door only accepts its own (see server.js > Auth), so
// this just has to post to the right endpoint and come back to the same
// page once signed in.
const IS_ADMIN = /^\/admin(\/|$)/.test(window.location.pathname);
const HOME = IS_ADMIN ? '/admin' : '/';

// The login form is served at the page it guards, so getting in is a
// reload of this same URL -- which keeps its hash, so a link to one
// screen (/admin#/menu) still lands there after logging in. (Assigning
// the same URL with a hash doesn't reload; it only scrolls.)
function goHome(){
  if (window.location.pathname === HOME) window.location.reload();
  else window.location.href = HOME;
}
if (IS_ADMIN) document.querySelector('[data-copy="login.tagline"]').setAttribute('data-copy', 'login.adminTagline');

// The friend door gets the link-preview image as a backdrop, when one
// has been uploaded; the admin door stays plain.
const BACKDROP = document.body.getAttribute('data-backdrop');
if (!IS_ADMIN && BACKDROP && BACKDROP.charAt(0) === '/'){
  document.body.style.setProperty('--backdrop', 'url("' + BACKDROP + '")');
  document.body.classList.add('has-backdrop');
  document.documentElement.classList.add('has-backdrop');
  tintEdgesFrom(BACKDROP);
}

// Works out the colour along the top and bottom edges of the backdrop as
// it's actually cropped on this screen (cover, centered), and hands each
// to its .edge-tint bar -- and the bottom one to the page background too,
// for a Safari that ignores the bars and only reads that. Scaled down to
// a few dozen pixels first: an average doesn't need the full 4K image.
function tintEdgesFrom(url){
  const img = new Image();
  img.onload = () => {
    try{
      const vw = window.innerWidth, vh = window.innerHeight;
      const cw = 48, ch = Math.max(2, Math.round(cw * vh / vw));
      const scale = Math.max(cw / img.naturalWidth, ch / img.naturalHeight);
      const dw = img.naturalWidth * scale, dh = img.naturalHeight * scale;
      const canvas = document.createElement('canvas');
      canvas.width = cw;
      canvas.height = ch;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, (cw - dw) / 2, (ch - dh) / 2, dw, dh);
      // 0.75: the backdrop sits under a 25% black dim (body::after).
      const edge = (y) => {
        const d = ctx.getImageData(0, y, cw, 1).data;
        const sum = [0, 0, 0];
        for (let i = 0; i < d.length; i += 4){ sum[0] += d[i]; sum[1] += d[i + 1]; sum[2] += d[i + 2]; }
        return 'rgb(' + sum.map(v => Math.round(v / cw * 0.75)).join(',') + ')';
      };
      const top = edge(0), bottom = edge(ch - 1);
      document.getElementById('edgeTop').style.backgroundColor = top;
      document.getElementById('edgeBottom').style.backgroundColor = bottom;
      document.documentElement.style.backgroundColor = bottom;
    }catch(e){
      // Leave the default dark strips.
    }
  };
  img.src = url;
}

applyCopy();

(async function checkExistingSession(){
  try{
    const res = await fetch('/api/session');
    const data = await res.json();
    if (!data || !(IS_ADMIN ? data.admin : data.shared)) return;
    // Guard against bouncing back and forth with this page forever if two
    // requests in the same flow ever land on processes that disagree
    // about session validity (e.g. mid-redeploy).
    const key = 'canopy_auth_redirect_at';
    const last = Number(sessionStorage.getItem(key) || 0);
    if (Date.now() - last < 4000) return;
    sessionStorage.setItem(key, String(Date.now()));
    goHome();
  }catch(e){}
})();

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('errorMsg');
  errorEl.textContent = '';
  const password = document.getElementById('password').value;
  try{
    const res = await fetch(IS_ADMIN ? '/api/admin/login' : '/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password })
    });
    if (res.ok){
      goHome();
      return;
    }
    errorEl.textContent = res.status === 401 ? t('login.wrongPassword') : t('login.failed');
  }catch(e){
    errorEl.textContent = t('login.unreachable');
  }
});
</script>
</body>
</html>
