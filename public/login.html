<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canopy Tickets</title>
<!-- OG_META -->
<style>
  :root{
    --gold:#c9a24b;
    --bg:#0b0b0d;
    --muted:#9a9a9a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--bg);
    color:#fff;
    font-family:-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    padding:20px;
  }
  form{
    width:100%;
    max-width:320px;
    background:#151517;
    border:1px solid #2a2a2a;
    border-radius:14px;
    padding:28px 24px;
  }
  .site-logo{
    display:block;
    max-height:56px;
    max-width:100%;
    width:auto;
    height:auto;
    margin:0 auto 14px;
  }
  h1{
    font-size:20px;
    margin:0 0 6px;
  }
  p{
    margin:0 0 20px;
    color:var(--muted);
    font-size:13px;
  }
  input{
    width:100%;
    background:#0f0f10;
    color:#fff;
    border:1px solid #3a3a3a;
    border-radius:10px;
    padding:12px 14px;
    font-size:15px;
    margin-bottom:14px;
  }
  button{
    width:100%;
    background:var(--gold);
    color:#241c07;
    border:none;
    border-radius:12px;
    padding:12px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
  }
  .error{
    color:#e2857a;
    font-size:13px;
    min-height:18px;
    margin-bottom:6px;
  }
</style>
</head>
<body>
  <form id="loginForm">
    <!-- LOGO_IMG -->
    <h1>Canopy Tickets</h1>
    <p>Enter your password to continue.</p>
    <div class="error" id="errorMsg"></div>
    <input type="password" id="password" placeholder="Password" autofocus autocomplete="current-password">
    <button type="submit">Enter</button>
  </form>

<script>
(async function checkExistingSession(){
  try{
    const res = await fetch('/api/session');
    const data = await res.json();
    if (!data || !data.authed) return;
    // Guard against bouncing back and forth with '/' forever if two
    // requests in the same flow ever land on processes that disagree
    // about session validity (e.g. mid-redeploy).
    const key = 'canopy_auth_redirect_at';
    const last = Number(sessionStorage.getItem(key) || 0);
    if (Date.now() - last < 4000) return;
    sessionStorage.setItem(key, String(Date.now()));
    window.location.href = '/';
  }catch(e){}
})();

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('errorMsg');
  errorEl.textContent = '';
  const password = document.getElementById('password').value;
  try{
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password })
    });
    if (res.ok){
      window.location.href = '/';
      return;
    }
    errorEl.textContent = res.status === 401 ? 'Wrong password.' : 'Something went wrong. Try again.';
  }catch(e){
    errorEl.textContent = 'Could not reach the server. Try again.';
  }
});
</script>
</body>
</html>
